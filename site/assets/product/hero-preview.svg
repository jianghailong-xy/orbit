  <text x="518" y="310" fill="#8fa4c9" font-family="ui-sans-serif,system-ui" font-size="13">SESSION HISTORY</text><path d="M518 331h172M518 354h145M518 377h160" stroke="#415579" stroke-width="8" stroke-linecap="round"/><circle cx="526" cy="423" r="7" fill="#73e1b0"/><text x="542" y="429" fill="#d8e8ff" font-family="ui-sans-serif,system-ui" font-size="14">human merge decision</text>
