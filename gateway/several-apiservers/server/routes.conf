# Several apiservers (docs/self-hosting.md, "Several apiservers"): the two routes that go to any apiserver. Included by
# gateway/nginx.conf inside its server, where a deployment mounts this directory; the upstreams are in
# ../http/upstreams.conf. Everything else a person sends still reaches the first apiserver (the /api/ location), where
# a Codex "Sign in with ChatGPT" runs in the process that started it.
#
# Proxy settings mirror the /api/ location's. A stopped apiserver can stay listed until the next resolve, at most 10 s:
# connecting to it fails within proxy_connect_timeout, 2 s (a connection inside the project's network takes far less,
# and a busy apiserver still accepts one), and the request goes on to another apiserver, which nginx then skips for
# 10 s (max_fails 1, fail_timeout 10 s, the defaults).

# A session's stream (GET /api/sessions/:id/events), by session over every apiserver: one session's streams share the
# process's NATS subscription to its live stream (ses.<id>.live), and that process alone receives its deltas. Two
# spellings of one session, its public id and its UUID, are hashed apart, which costs a second subscription and
# nothing else: each process counts its own watchers and the link gateway sums them. The clients use the public id.
location ~ ^/api/sessions/(?<orbit_stream_session>[^/]+)/events$ {
    proxy_pass http://orbit_session_streams$request_uri;
    proxy_http_version 1.1;
    proxy_set_header X-Orbit-Gateway 1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_connect_timeout 2s;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
}

# A runner's link token (POST /api/runner/link-token): any apiserver signs one, with the key every apiserver is given.
# Runners ask for one when they first connect and about once an hour after, and all at once when they restart
# together after a release.
location = /api/runner/link-token {
    proxy_pass http://orbit_link_tokens$request_uri;
    proxy_http_version 1.1;
    proxy_set_header X-Orbit-Gateway 1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_connect_timeout 2s;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
}
