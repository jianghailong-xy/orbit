# Several apiservers (docs/self-hosting.md, "Several apiservers"): every apiserver, for the two routes in
# ../server/routes.conf. Included by gateway/nginx.conf in the http context, where a deployment mounts this directory.
#
# Every apiserver answers to the network alias orbit-apiservers (docker-compose.yml gives it to the apiserver, and
# apiserver-2 and on take it with the rest when they extend that service). `resolve` reads the name again every 10 s
# (the resolver's `valid`), so an apiserver that is added or recreated joins within that, and one that stops leaves.
# It needs nginx 1.27.3 or later: an older one refuses to start with this file.

# A session's streams, by session (the location captures its id). Plain `hash`, not `consistent`: nginx places a
# server on the consistent hash's circle by its name, which every address of the alias shares, and takes those
# addresses in turn, so one session's streams would go everywhere. Plain hash picks an address by its place in the
# list: the streams of one session reach one apiserver for as long as the set of apiservers stays the same. When it
# changes, part of the sessions move, each when its stream next reconnects; a stream already open stays where it is.
upstream orbit_session_streams {
    zone orbit_session_streams 64k;
    hash $orbit_stream_session;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server orbit-apiservers:3000 resolve;
}

# Link tokens: to the apiserver with the fewest requests in flight, so that a busy one takes fewer.
upstream orbit_link_tokens {
    zone orbit_link_tokens 64k;
    least_conn;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server orbit-apiservers:3000 resolve;
}
