# Several apiservers (docs/self-hosting.md, "Several apiservers"): what the /api/ and /api/events locations of
# gateway/nginx.conf send to, where a deployment mounts this directory. Included inside each of those locations, after
# the line that names the first apiserver; the upstream is in ../http/upstreams.conf.
#
# The first apiserver still takes every one of these requests while it is up. When it stops (an upgrade recreates it
# while the others run) it closes its listener first, and a connection to it is refused at once: nginx then sends the
# request to another apiserver, a POST too, since nothing of it was sent, and passes the first over for 10 s. A
# container that is gone and still resolved is given up on after 2 s, as the routes in ../server/routes.conf do.
set $apiserver orbit_first_apiserver;
proxy_connect_timeout 2s;
