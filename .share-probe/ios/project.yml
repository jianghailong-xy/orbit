# TEMPORARY evidence probe (see ../README.md).
name: MenuProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Simulator only: ad-hoc "sign to run locally", no team, no profile.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  MenuProbe:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.menuprobe
        PRODUCT_NAME: MenuProbe
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  MenuProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MenuProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.menuprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MenuProbe:
    build:
      targets:
        MenuProbe: all
        MenuProbeUITests: [test]
    test:
      targets:
        - MenuProbeUITests
