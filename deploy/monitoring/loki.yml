# Loki (docs/self-hosting.md, "Logs"): one process, its index and chunks on the loki-data volume, reached by Alloy and
# Grafana inside this Compose project's network alone. It has no authentication of its own (auth_enabled: false), so
# what keeps it private is that no port of it is published.
#
# Retention is ORBIT_LOKI_RETENTION (168h, seven days, unless .env says otherwise): the compactor deletes older chunks,
# and a line older than that is refused when it arrives.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  instance_addr: 127.0.0.1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${ORBIT_LOKI_RETENTION:-168h}
  reject_old_samples: true
  reject_old_samples_max_age: ${ORBIT_LOKI_RETENTION:-168h}
  # The request id travels as structured metadata (deploy/monitoring/alloy/config.alloy), not as a label.
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
