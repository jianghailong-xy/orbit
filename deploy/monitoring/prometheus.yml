# What the prometheus service in docker-compose.yml scrapes (docs/self-hosting.md, "Monitoring"). Every target is
# reached by name over the Compose project's network; none of them publishes a port on the host.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # Every apiserver, by the name each one answers to: apiserver, apiserver-2 and on from docker-compose.override.yml,
  # and a two-stage release's apiserver-next while it runs beside the apiserver. Each answer is one target, on the
  # apiserver's internal metrics listener (METRICS_INTERNAL_PORT), which serves /metrics and nothing else.
  - job_name: apiserver
    dns_sd_configs:
      - names: [orbit-apiservers]
        type: A
        port: 9091
        refresh_interval: 15s

  # The runner link's gateway, only while the runner-link profile runs it: without it the name resolves to nothing,
  # so there is no target, rather than one that is down.
  - job_name: link-gateway
    dns_sd_configs:
      - names: [link-gateway]
        type: A
        port: 9464
        refresh_interval: 15s

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
