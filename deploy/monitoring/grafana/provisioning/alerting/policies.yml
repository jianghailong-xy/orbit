# Which contact point takes which alert. The Watchdog goes to the heartbeat URL, every minute for as long as it fires;
# everything else goes to the contact point ORBIT_ALERT_CONTACT names (orbit-ntfy unless .env says otherwise) and, once
# ORBIT_NOTIFY_TOKEN is set, to the Orbit app as well. ntfy keeps every alert either way: apiserver down above all,
# which the Orbit app cannot carry, because the apiserver is what sends its push.
apiVersion: 1
policies:
  - orgId: 1
    receiver: $ORBIT_ALERT_CONTACT
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: orbit-watchdog
        object_matchers:
          - [watchdog, "=", "true"]
        group_by: [alertname]
        group_wait: 0s
        # Not 1m and 1m: the alert is re-sent every minute and the dispatcher flushes just before a 1m repeat interval has
        # elapsed, so it skipped every other flush and pinged every two minutes. A flush every 30 s with a 45 s repeat
        # interval pings every 60 s.
        group_interval: 30s
        repeat_interval: 45s
      # ORBIT_APP_ALERTS is ".+" when ORBIT_NOTIFY_TOKEN is set and empty when it is not (docker-compose.yml): every
      # alert has a name, so this route takes every alert the Watchdog route left, or none. It continues, so the
      # route below still gives each one to ORBIT_ALERT_CONTACT.
      - receiver: orbit-app
        object_matchers:
          - [alertname, "=~", "$ORBIT_APP_ALERTS"]
        continue: true
      - receiver: $ORBIT_ALERT_CONTACT
