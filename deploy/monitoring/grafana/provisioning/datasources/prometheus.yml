# The one data source: the prometheus service, by its name in the Compose project's network (docs/self-hosting.md,
# "Monitoring"). Provisioned, so it cannot be edited or deleted from Grafana's UI.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: orbit-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
