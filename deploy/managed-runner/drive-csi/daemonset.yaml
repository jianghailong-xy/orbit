# orbit-drive-csi: the drive.orbit.dev node plugin on every node that runs managed runner Pods (§6.1). The only
# privileged part of the drive: it opens /dev/fuse and mounts. Each runner's daemon, which parses what agents write,
# runs as a uid of its own with no capabilities, no_new_privs and a seccomp filter (src/drive-mount/README.md).
#
# Replace:
#   __DRIVE_CSI_IMAGE_AT_SHA256_DIGEST__  the image built from Dockerfile (README.md, "Image"), by digest
#   __MANAGED_RUNNER_NAMESPACE__      the profile's kubernetes.namespace
#   __ORBIT_HTTPS_URL__               the Orbit server the daemons speak to (the profile's runner.serverUrl)
#
# updateStrategy OnDelete: a new image is rolled node by node by an operator (README.md, "Upgrade"), never by the
# DaemonSet controller, so an upgrade is never a surprise outage of every drive on the cluster.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: orbit-drive-csi
  namespace: orbit-drive-system
  labels:
    app.kubernetes.io/name: orbit-drive-csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orbit-drive-csi
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbit-drive-csi
    spec:
      serviceAccountName: orbit-drive-csi
      priorityClassName: system-node-critical
      # Attribution (§5.8): a FUSE request carries the caller's pid in the mounter's pid namespace.
      hostPID: true
      # Stopping, every daemon commits its open writes (at most 60 s); the mounts stay for the next start.
      terminationGracePeriodSeconds: 90
      containers:
        - name: plugin
          image: __DRIVE_CSI_IMAGE_AT_SHA256_DIGEST__
          args:
            - csi
            - --endpoint=unix:///csi/csi.sock
            - --managed-namespace=__MANAGED_RUNNER_NAMESPACE__
            - --secrets-namespace=orbit-drive-system
            - --server=__ORBIT_HTTPS_URL__
            # Not the default 200000: while an older driver's plugin (documents.orbit.dev, files.orbit.dev) runs on
            # the same node (README.md, "Moving from an older driver"), its daemons take uids from 200000, and no
            # daemon of this plugin may share a uid with one of them.
            - --daemon-uid-base=300000
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          ports:
            - name: healthz
              containerPort: 9808
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            # The kubelet's targets: the bind of a runner's directory must reach the kubelet's namespace.
            - name: kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            # Each runner's plain directory; the FUSE mount at <runner>/drive must reach every Pod's bind of it.
            - name: files
              mountPath: /var/lib/orbit-drive
              mountPropagation: Bidirectional
            - name: spool
              mountPath: /var/lib/orbit-drive-spool
            - name: state
              mountPath: /var/lib/orbit-drive-state
            # The watchdog aborts a frozen daemon's connection (§5.7).
            - name: fusectl
              mountPath: /sys/fs/fuse
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/drive.orbit.dev/csi.sock
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
          args:
            - --csi-address=/csi/csi.sock
            - --health-port=9808
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/drive.orbit.dev
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: files
          hostPath:
            path: /var/lib/orbit-drive
            type: DirectoryOrCreate
        - name: spool
          hostPath:
            path: /var/lib/orbit-drive-spool
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/lib/orbit-drive-state
            type: DirectoryOrCreate
        - name: fusectl
          hostPath:
            path: /sys/fs/fuse
            type: Directory
