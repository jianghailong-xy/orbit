# Who may touch the mount credentials (§4.3, §6.1). Two identities, one Secret each way, nothing else:
#
#   - the plugin's ServiceAccount may get Secrets in orbit-drive-system and nothing else, cluster-wide or here;
#   - the managed runner manager may get, create, update and delete Secrets in orbit-drive-system (mrf-<runner uuid>),
#     beside what it already holds in the managed namespace (../README.md, "Manager permissions").
#
# Replace __MANAGER_SERVICE_ACCOUNT_NAMESPACE__ and __MANAGER_SERVICE_ACCOUNT__ with the identity the profile's
# admission.managerUsername names (system:serviceaccount:<namespace>:<name>).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbit-drive-csi
  namespace: orbit-drive-system
  labels:
    app.kubernetes.io/name: orbit-drive-csi
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orbit-drive-csi-read-mount-credentials
  namespace: orbit-drive-system
  labels:
    app.kubernetes.io/name: orbit-drive-csi
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orbit-drive-csi-read-mount-credentials
  namespace: orbit-drive-system
  labels:
    app.kubernetes.io/name: orbit-drive-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orbit-drive-csi-read-mount-credentials
subjects:
  - kind: ServiceAccount
    name: orbit-drive-csi
    namespace: orbit-drive-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orbit-runner-manager-mount-credentials
  namespace: orbit-drive-system
  labels:
    app.kubernetes.io/name: orbit-drive-csi
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orbit-runner-manager-mount-credentials
  namespace: orbit-drive-system
  labels:
    app.kubernetes.io/name: orbit-drive-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orbit-runner-manager-mount-credentials
subjects:
  - kind: ServiceAccount
    name: __MANAGER_SERVICE_ACCOUNT__
    namespace: __MANAGER_SERVICE_ACCOUNT_NAMESPACE__
