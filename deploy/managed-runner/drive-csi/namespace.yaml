# The Drive CSI plugin's own namespace (docs/drive-technical-design.md §6.1): the privileged node
# plugin and each runner's mount credential (Secret mrf-<runner uuid>) live here, never in the managed-runner
# namespace, whose Pod Security level is unchanged.
apiVersion: v1
kind: Namespace
metadata:
  name: orbit-drive-system
  labels:
    app.kubernetes.io/name: orbit-drive-csi
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
