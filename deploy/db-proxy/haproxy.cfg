# The database entry for apiserver and wiki-worker (deploy/db-proxy.yml): plain TCP, one server
# connection per client connection, so LISTEN/NOTIFY and session advisory locks behave exactly as
# they do without the proxy. How to switch the target: docs/postgres-standby.md, "Database proxy".

global
    log stdout format raw local0 info
    # The runtime API, reachable only from inside this container:
    #   docker exec orbit-db-proxy sh -c 'echo "show servers state postgres" | nc 127.0.0.1 9999'
    stats socket ipv4@127.0.0.1:9999 level admin
    stats timeout 1m
    # On a reload the old process keeps its connections until they end, and a database client keeps
    # its own for hours: end them after 10 s rather than leave two targets in use.
    hard-stop-after 10s

# Docker's DNS, so a target named by container or service follows that container when it is
# recreated with another address.
resolvers docker
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 10s

defaults
    mode tcp
    log global
    timeout connect 5s
    # A database session can sit idle for a long time (the apiserver's LISTEN connection waits for the
    # next NOTIFY), and the proxy must not be what ends it.
    timeout client 24h
    timeout server 24h
    # Find a peer that vanished without closing, on the timings the apiserver asks of PostgreSQL itself
    # for its coordination connection (src/apiserver/src/realtime/control-plane-leader.ts): 10 s idle,
    # then 3 probes 5 s apart.
    option clitcpka
    clitcpka-idle 10s
    clitcpka-intvl 5s
    clitcpka-cnt 3
    option srvtcpka
    srvtcpka-idle 10s
    srvtcpka-intvl 5s
    srvtcpka-cnt 3

frontend db
    bind :5432
    option tcplog
    default_backend postgres

backend postgres
    # ORBIT_DB_PROXY_TARGET is host:port. The check only opens and closes a TCP connection, which
    # PostgreSQL does not log.
    server primary "${ORBIT_DB_PROXY_TARGET}" resolvers docker resolve-prefer ipv4 init-addr libc,none check inter 2s fall 2 rise 1

# The container's health check: 200 while the target passes its check, 503 otherwise.
frontend health
    mode http
    bind 127.0.0.1:8405
    timeout client 10s
    timeout http-request 5s
    no log
    monitor-uri /healthz
    monitor fail if { nbsrv(postgres) lt 1 }
