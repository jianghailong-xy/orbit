org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# One Kotlin compile daemon serves every build on a host. Inheriting the 2g above, it ran out of heap whenever builds overlapped.
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
# Local builds only: release.yml takes versionName from the v* tag and versionCode from the commit count.
orbitVersionName=0.1.0-internal.1
orbitVersionCode=1
