# The runner link's NATS (docs/runner-link-design.md §6.3): the whole configuration of docker-compose.yml's nats
# service, which mounts this file read-only and starts nats-server with it alone, so the image's own file, which opens
# a cluster port with a well-known route password, is never read. Core publish and subscribe only: no JetStream, no
# cluster, no leaf nodes, no other listener. test/compose-topology.test.mjs pins every line of it.
#
# Two users, each by the public half of its nkey (link-gateway nkey makes a pair), each allowed only what it does.
# The keys come from the environment, which Compose fills from .env; with either one empty or unset, nats-server
# refuses to start. A client without one of the two seeds cannot connect at all.

# The clients' port, reached inside the project's network only, and the monitoring port the health check reads.
port: 4222
http_port: 8222

authorization {
  users: [
    # The apiserver (src/apiserver/src/realtime/runner-hints.ts): publishes each runner's hints and turn prefix
    # requests on rnr.<runnerId>, reads the live stream of a session it has a client of on ses.<sessionId>.live, and
    # takes its requests' answers on its inbox.
    {
      nkey: $RUNNER_LINK_NATS_APISERVER_KEY
      permissions: {
        publish: { allow: ["rnr.>"] }
        subscribe: { allow: ["ses.*.live", "_INBOX.>"] }
      }
    }
    # The link gateway (src/link-gateway/hints.go, live.go): reads the hints and requests of the runners it holds,
    # publishes their live streams, and answers a request on the reply subject it came with.
    {
      nkey: $RUNNER_LINK_NATS_GATEWAY_KEY
      permissions: {
        publish: { allow: ["ses.*.live"] }
        subscribe: { allow: ["rnr.>"] }
        allow_responses: true
      }
    }
  ]
}
