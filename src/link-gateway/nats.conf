# The runner link's NATS (docs/runner-link-design.md §6.3): the whole configuration of docker-compose.yml's nats
# service, which mounts this file read-only and starts nats-server with it alone, so the image's own file, which opens
# a cluster port with a well-known route password, is never read. Core publish and subscribe only: no JetStream, no
# cluster, no leaf nodes, no other listener. test/compose-topology.test.mjs pins every line of it.
#
# Two users, each by the public half of its nkey (link-gateway nkey makes a pair), each allowed only what it does.
# The keys come from the environment, which Compose fills from .env; with either one empty or unset, nats-server
# refuses to start. A client without one of the two seeds cannot connect at all. No trace or debug logging, either of
# which would print what a message carries.

# The clients' port, reached inside the project's network only, and the monitoring port the health check reads.
port: 4222
http_port: 8222

authorization {
  users: [
    # The apiserver (src/apiserver/src/realtime/runner-hints.ts): publishes each runner's hints and turn prefix
    # requests on rnr.<runnerId>, reads the live stream of a session it has a client of on ses.<sessionId>.live, and
    # takes its requests' answers on its inbox. Its processes reach each other on api.> (src/apiserver/src/runners/
    # relay-peers.ts): what each holds for a runner on api.held, requests to one on api.<instanceId>, each answered
    # once. An Antigravity code or a Cursor key crosses only in such an answer, to the asking process's inbox. A browser
    # viewer's byte stream (src/apiserver/src/managed-runners/browser-viewer.ts) is opened by a request on rnr.<runnerId>
    # and then sent on vnc.<streamId>.down and read on vnc.<streamId>.up.
    {
      nkey: $RUNNER_LINK_NATS_APISERVER_KEY
      permissions: {
        publish: { allow: ["rnr.>", "api.>", "vnc.*.down"] }
        subscribe: { allow: ["ses.*.live", "_INBOX.>", "api.>", "vnc.*.up"] }
        allow_responses: true
      }
    }
    # The link gateway (src/link-gateway/hints.go, live.go, streams.go): reads the hints and requests of the runners it
    # holds, publishes their live streams, answers a request on the reply subject it came with, and relays the browser's
    # byte streams on vnc.<streamId>.down and .up. Its nodes ask each other for a runner process's heartbeat facts on
    # lfx.<runnerId> and take the answers on their own inbox, _LFX.> (facts.go). Nothing on api.> and no _INBOX: it
    # never sees what the apiserver processes hand each other.
    {
      nkey: $RUNNER_LINK_NATS_GATEWAY_KEY
      permissions: {
        publish: { allow: ["ses.*.live", "vnc.>", "lfx.*"] }
        subscribe: { allow: ["rnr.>", "vnc.>", "lfx.*", "_LFX.>"] }
        allow_responses: true
      }
    }
  ]
}
