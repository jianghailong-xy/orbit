server {
    listen 80;
    # The IPv6 listener, written here rather than left to the image's entrypoint script.
    # `10-listen-on-ipv6-by-default.sh` exits immediately when it finds this line and otherwise runs
    # `apk manifest nginx` to decide whether to add it — a call that wants the network, and that
    # hangs when the host is loaded or the link is flaky. While it hangs the entrypoint never reaches
    # `nginx`, the container stays unhealthy, and the site answers 502 from the gateway until it
    # unwedges (2026-09-22: ~8 minutes in the middle of a routine deploy, and the deploy script
    # exited 1). This is the line the script would have written anyway, one step earlier, and with no
    # network in the boot path. Do not remove it: its absence is not a cosmetic difference.
    listen  [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe — answered by nginx directly, no upstream needed
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # REST + SSE → control plane (same-origin, so no CORS needed)
    location /api/ {
        # File/attachment uploads (multipart POST /api/attachments) run up to the 25MB
        # app cap; nginx's 1MB default would 413 them here before they reach the apiserver.
        # Headroom above 25MB lets the app return its precise error instead of a bare 413.
        client_max_body_size 30m;

        proxy_pass http://apiserver:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: stream immediately, keep the connection long-lived
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Vite writes these with a content hash in the filename, so a given URL's bytes can never
    # change — the deploy publishes new names instead. Say so: without any Cache-Control the
    # only freshness signal was an ETag, which still costs a revalidation round trip per file
    # per load, and left Cloudflare reporting `cf-cache-status: DYNAMIC` — i.e. pulling the
    # ~2MB bundle from this origin on every cold load rather than serving it from the edge.
    # `=404` rather than the SPA fallback below: a missing asset is a broken deploy or a tab older
    # than this one, and answering it with index.html would hand the browser HTML where it expects
    # JavaScript. No `always` on the header: only a file that exists is immutable. `always` stamped
    # the 404 as well, and Chromium keeps that as it would the file: after a rollback or a revert
    # brought the same name back it went on failing without asking, through every reload.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The one script a page waits for before its first paint: the parser stops here, so asking again on
    # every load would hold every page back a round trip (measured: at 100 ms, first paint from 132 to
    # 220 ms). A copy a day old does no harm: it only reads a stored choice, and lib/theme.tsx has the
    # last word once the app mounts. `=` and no fallback, for the reason /assets/ gives.
    location = /theme-boot.js {
        add_header Cache-Control "public, max-age=86400";
    }

    # Runner downloads (/install.sh, the runner's self-update, the macOS app): the files the image
    # ships and nothing else. A missing one is a 404 — /dl/previous/ is empty until one release has
    # replaced another — never the SPA shell, which a runner would read as a broken manifest.
    # Revalidated like the shell, so no cache keeps serving a release after a deploy replaced it.
    location /dl/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # A public share page (/s/<token> and the pages under it): the same SPA shell as `/` below,
    # with two headers of its own. Its address is the capability that opens it, so a search
    # engine must not keep it and the next site a reader clicks through to must not be handed
    # it in a Referer. Two nginx rules shape this block:
    #   - an add_header here drops every add_header this block would otherwise inherit, so the
    #     shell's Cache-Control from `location /` is written again;
    #   - the shell is served from THIS block. `try_files $uri /index.html` would end in an
    #     internal redirect to /index.html, which `location /` answers with its headers instead.
    location /s/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; object-src 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Content-Security-Policy "script-src *:*/assets/ *:*/theme-boot.js" always;
        try_files /index.html =404;
    }

    # SPA fallback. The shell is the one file that must NOT be cached blind: it names the
    # hashed assets above, so serving a stale copy pins the browser to the previous deploy —
    # which is exactly the failure `immutable` would otherwise make permanent. `no-cache`
    # means revalidate, not "don't store": the ETag still answers 304 for an unchanged shell.
    #
    # The Content-Security-Policy is the login's second line of defence: the token is in localStorage,
    # so a script running on this origin is the account. Written out here and in `location /s/`, because
    # each block has add_headers of its own, and never at server level, where `location /api/` would
    # inherit them beside the `sandbox` policy the apiserver puts on a user's file.
    #
    # Two policies, and a browser holds a page to both. The first says what a page may load:
    #   - default-src, script-src: this origin's files, and nothing inline or evaluated.
    #   - style-src 'unsafe-inline': the shell's splash, the <style> Mermaid puts in every diagram, and
    #     the style attributes components render.
    #   - img-src data: blob:: pictures the client fetched with the login. http: https:: a picture on the
    #     open web, which Markdown in a reply or a comment may name.
    #   - object-src, base-uri, form-action: nothing here uses a plugin or a <base>, and default-src does
    #     not cover the last two.
    # The second says which of this origin's files may be scripts: the build's, under /assets/, and
    # public/theme-boot.js, the one that has to run before first paint. 'self' alone also admits a user's
    # file under /api/ whose type says script. Its host is `*` because a path needs a host and the first
    # policy has settled that one; the host a browser sees cannot be read here, the gateway's Host having
    # dropped the port.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; object-src 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Content-Security-Policy "script-src *:*/assets/ *:*/theme-boot.js" always;
        try_files $uri $uri/ /index.html;
    }
}
