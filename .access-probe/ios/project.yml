# TEMPORARY evidence probe (see ../README.md).
name: AccessProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
packages:
  OrbitKit:
    path: ../../src/macos/OrbitKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Simulator only: ad-hoc "sign to run locally", no team, no profile.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  AccessProbe:
    type: application
    platform: iOS
    sources:
      - Sources
      - Generated
      # The app's own asset catalog, for its accent colour.
      - path: ../../src/ios/Support/Assets.xcassets
    dependencies:
      - package: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.accessprobe
        PRODUCT_NAME: AccessProbe
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  AccessProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AccessProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.accessprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AccessProbe:
    build:
      targets:
        AccessProbe: all
        AccessProbeUITests: [test]
    test:
      targets:
        - AccessProbeUITests
