# Docker's json-file driver keeps a container's output forever unless told otherwise: the
# gateway's access log reached 1GB in six days. Rotate at 100MB and keep five files, the older
# ones gzipped — a few days of gateway history, which reading real client traffic out of the
# access log depends on. Takes effect when a container is next recreated.
x-logging: &logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"
    compress: "true"

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    logging: *logging
    # Docker's default 64MB /dev/shm is smaller than the ~67MB dynamic shared memory segment
    # VACUUM allocates (maintenance_work_mem-sized). On 2026-10-09 a manual VACUUM on the
    # production box died with `could not resize shared memory segment ... to 67145440 bytes:
    # No space left on device` — and PG16 parallelizes VACUUM automatically on any table over
    # min_parallel_table_scan_size (8MB), so even a plain VACUUM hits it. The official postgres
    # image documents 256MB as the recommended size; evidence in docs/postgres-runtime-settings.md §6.
    shm_size: "256m"
    # The image's entrypoint only fixes up PGDATA's ownership, so create and chown the
    # archive here — still as root — before it drops to the postgres user. Without this
    # archive_command cannot write into the bind mount and WAL archiving stalls.
    entrypoint:
      - /bin/sh
      - -c
      - 'mkdir -p /archive/wal /archive/base && chown postgres:postgres /archive /archive/wal /archive/base && exec docker-entrypoint.sh "$$@"'
      - --
    # Continuous WAL archiving: every finished segment is gzipped into ./data/pg-archive
    # (scripts/pg-archive-wal.sh), and a written-to database closes a segment at least
    # every 5 minutes, so recovery lands within that of any moment. The pgbackup service
    # takes the base backups those segments are replayed onto.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - "archive_command=/usr/local/bin/pg-archive-wal.sh %p %f"
      - -c
      - archive_timeout=300
      - -c
      - wal_compression=on
      # SQL-level observability. pg_stat_statements has to be preloaded, so it belongs on
      # this command line: ALTER SYSTEM writes postgresql.auto.conf, which neither survives
      # a container rebuild from this file nor runs inside a transaction block. track=top
      # keeps the totals addable — a statement's time already includes the triggers and
      # functions it fires, so tracking nested ones too would double-count them.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=top
      # Name the queries behind pg_stat_database's temp_bytes. 1MB passes over trivial
      # spills but still catches a query that writes many small files, which a threshold
      # set at work_mem would hide.
      - -c
      - log_temp_files=1024
      # Bound what a runaway statement or an abandoned transaction can hold. All three were 0
      # — unlimited — which is how one updateMany held the owner row lock for five minutes on
      # 2026-09-14, and how a 13-minute fan-out left nine UPDATEs queued behind it on 2026-09-19
      # until the pool ran dry. Each number is measured, not a rule of thumb;
      # docs/postgres-runtime-settings.md carries the evidence per setting.
      #
      # statement_timeout is sized by migrations, not by queries. Across 9.2 days / 62.8M calls
      # the one application statement that ever ran past it is the once-a-minute dispatch sweep
      # (655s worst), a read-only backstop whose next tick redoes whatever this one dropped.
      # Migrations apply at apiserver boot and a failed one is a crash loop, so this leaves 5.8x
      # over the longest we have run (52s). The nightly pg_basebackup takes 7-10 minutes and is
      # not subject to it: BASE_BACKUP runs in a walsender, which never arms the timer.
      # A migration or a manual VACUUM/REINDEX needing more sets `SET statement_timeout = 0`
      # itself; autovacuum workers already force all three of these to 0.
      - -c
      - statement_timeout=300s
      # In 4.4 days of log_lock_waits, 196 waits outlasted deadlock_timeout and none reached
      # 30s (worst 12.1s) — this host runs at load 30-60, so textbook 1-5s values would fire on
      # healthy traffic. This is the knob that protects the *waiters*: Prisma cannot roll back a
      # transaction whose statement is parked on a lock, so only the server can end that wait.
      - -c
      - lock_timeout=30s
      # 2.5x the longest transaction budget orbit declares (EVENTS_INGEST_TRANSACTION_TIMEOUT_MS,
      # 120s), because Prisma's own timer can itself be late when the event loop is starved.
      # Must never drop below 120s or it starts killing healthy event-batch writes. Sampled
      # idle-in-transaction gaps top out at 0.14s, three orders of magnitude below this.
      - -c
      - idle_in_transaction_session_timeout=300s
      # work_mem stays at its 4MB default on purpose. 40 of the 52GB of temp written in the 9.2
      # days before this change came from one application read spilling 4.4MB per call, and that
      # read was fixed where it lives (9cad03c7d) instead of raising this for every connection:
      # work_mem multiplies hardest (per connection, per sort/hash node) on a host that is
      # already out of swap.
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    expose:
      - "5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/pg-archive:/archive
      - ./scripts/pg-archive-wal.sh:/usr/local/bin/pg-archive-wal.sh:ro
      # Shared with pgbackup so base backups run over the unix socket, which pg_hba
      # already trusts — no replication password anywhere.
      - pg-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Periodic base backups + retention for the WAL archive above. Without a base backup
  # the archived WAL has nothing to replay onto, so the two ship together.
  pgbackup:
    image: postgres:16-alpine
    container_name: orbit-pgbackup
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-backup.sh"]
    environment:
      # The bootstrap superuser initdb created (POSTGRES_USER above); no `postgres`
      # role exists in this cluster.
      PGHOST: /var/run/postgresql
      PGUSER: orbit
      PGDATABASE: postgres
      # Seconds between base backups (default daily), how many to keep, and how much
      # free disk to leave: a backup that would eat into that headroom is skipped with
      # an error instead of filling the disk out from under Postgres.
      ORBIT_BASE_BACKUP_INTERVAL: "${ORBIT_BASE_BACKUP_INTERVAL:-86400}"
      ORBIT_BASE_BACKUP_KEEP: "${ORBIT_BASE_BACKUP_KEEP:-2}"
      ORBIT_BACKUP_MIN_FREE_MB: "${ORBIT_BACKUP_MIN_FREE_MB:-2048}"
      # Off-host mirror (unset = local backups only). The archive shares a disk with the
      # database, so this is the copy that survives losing it. Point it at a directory of
      # its own on the far side — the mirror deletes anything there it did not put there.
      ORBIT_BACKUP_SYNC_TARGET: "${ORBIT_BACKUP_SYNC_TARGET:-}"
      ORBIT_BACKUP_SYNC_SSH_PORT: "${ORBIT_BACKUP_SYNC_SSH_PORT:-22}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/pg-archive:/archive
      - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - pg-socket:/var/run/postgresql
      # Read-only: the key that reaches the mirror host, and the host keys to check it
      # against. Only read when ORBIT_BACKUP_SYNC_TARGET is set.
      - "${ORBIT_BACKUP_SSH_DIR:-/root/.ssh}:/ssh:ro"

  apiserver:
    image: orbit-apiserver:local
    build:
      context: .
      dockerfile: src/apiserver/Dockerfile
    container_name: orbit-apiserver
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: "postgresql://orbit:orbit@postgres:5432/orbit?schema=public"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET (generate: openssl rand -base64 32)}"
      # Optional independent signing key for 15-minute runner/session orchestration proofs.
      # Unset derives a domain-separated key from JWT_SECRET.
      RUNNER_ORCHESTRATION_JWT_SECRET: "${RUNNER_ORCHESTRATION_JWT_SECRET:-}"
      # Keep explicit CURRENT_WORK/NEXT_TURN writes disabled through a mixed API/runner rollout.
      # Enable only after every API replica and active runner advertises routing-v1.
      # Optional: access-token (JWT) lifetime (e.g. 1h, 24h, 7d). Clients auto-refresh via a
      # 30d refresh token, so this can be short; defaults to 7d. Shorten once clients ship refresh.
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-7d}"
      # Required: master key (AES-256-GCM) that encrypts control-plane model providers' API keys
      # (DeepSeek etc.) at rest. Must be set at startup. Generate: openssl rand -base64 32.
      PROVIDER_SECRET_KEY: "${PROVIDER_SECRET_KEY:?set PROVIDER_SECRET_KEY (generate: openssl rand -base64 32)}"
      # Optional: where the third-party vendor model lists (Kimi, DeepSeek, GLM, …) refresh from,
      # twice a day. Point at a mirror or a pinned copy where models.dev isn't reachable; a failed
      # fetch just leaves the pickers on the lists this build shipped.
      MODEL_CATALOG_URL: "${MODEL_CATALOG_URL:-https://models.dev/api.json}"
      # Optional: how far native Watch is switched on (docs/watch-rollout.md): on (default), canary (only the
      # accounts ORBIT_WATCHES_CANARY_OWNERS lists, comma-separated ids), drain (no new watches; the ones made
      # keep running) or off (drain, and this apiserver runs no Watch evaluation or delivery). Takes effect on
      # `docker compose up -d apiserver`; no migration and no runner release either way.
      # Set it on the host as ORBIT_WATCHES_MODE, not ORBIT_WATCHES: every agent session carries ORBIT_WATCHES (the
      # runner injects it for `orbit mcp`), and Compose prefers the shell's environment to .env, so a deploy run from a
      # session would take the session's value. The canary list keeps its name: no session carries it.
      # (src/apiserver/src/wiki/wiki-compose-env.spec.ts)
      ORBIT_WATCHES: "${ORBIT_WATCHES_MODE:-on}"
      ORBIT_WATCHES_CANARY_OWNERS: "${ORBIT_WATCHES_CANARY_OWNERS:-}"
      # Optional: how far the Orbit Wiki is switched on (src/apiserver/src/wiki/wiki-rollout.ts): on (default),
      # canary (only the accounts ORBIT_WIKI_CANARY_OWNERS lists, comma-separated ids) or off. An account without it
      # gets 404 WIKI_DISABLED on every wiki route, its sessions no wiki tools and no wiki context, and the web hides
      # the Wiki entry points. Takes effect on `docker compose up -d apiserver`; no migration and no runner release.
      # Set it on the host as ORBIT_WIKI_MODE, not ORBIT_WIKI, for the reason ORBIT_WATCHES_MODE gives above.
      ORBIT_WIKI: "${ORBIT_WIKI_MODE:-on}"
      ORBIT_WIKI_CANARY_OWNERS: "${ORBIT_WIKI_CANARY_OWNERS:-}"
      PORT: "3000"
      CORS_ORIGINS: "http://localhost:2086"
      # Where runners reach this deployment — the origin the web image bakes in below. A session on a
      # shared Codex pool is handed <origin>/api/gw/codex as its OpenAI endpoint (providers/shared-pool.ts).
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:2086}"
      # Optional: DeepSeek (OpenAI-compatible) for asynchronously improving prompt-derived
      # session titles and filing the session under a few semantic tags. Session creation and
      # worktree branch generation never wait on it.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      # Optional independent push channels. APNS_KEY is base64 of AuthKey_XXXX.p8.
      APNS_KEY: "${APNS_KEY:-}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_BUNDLE_ID: "${APNS_BUNDLE_ID:-io.orbitd.app}"
      # FCM HTTP v1 for GMS Android. PRIVATE_KEY is base64 of the service account PEM.
      FCM_PROJECT_ID: "${FCM_PROJECT_ID:-}"
      FCM_CLIENT_EMAIL: "${FCM_CLIENT_EMAIL:-}"
      FCM_PRIVATE_KEY: "${FCM_PRIVATE_KEY:-}"
      FCM_ANDROID_PACKAGE: "${FCM_ANDROID_PACKAGE:-io.orbitd.android}"
      # Optional: the runner link (docs/self-hosting.md, "Runner link"): the connection tokens a runner trades its runner
      # token for, to reach the link gateway. All three or none: unset, the link is off, its routes answer 404 and runners
      # work over HTTP as before. The signing key is base64 of an Ed25519 private key in PEM (generate: openssl genpkey
      # -algorithm ed25519 | base64 -w0); the gateway is given only its public key. The URL is the gateway's ws:// or
      # wss:// address. The gateway token is the secret the gateway presents to read revoked credentials (generate:
      # openssl rand -base64 32).
      RUNNER_LINK_SIGNING_KEY: "${RUNNER_LINK_SIGNING_KEY:-}"
      RUNNER_LINK_URL: "${RUNNER_LINK_URL:-}"
      RUNNER_LINK_GATEWAY_TOKEN: "${RUNNER_LINK_GATEWAY_TOKEN:-}"
      # The runner link's hints (src/apiserver/src/realtime/runner-hints.ts): each wake for a runner is also published
      # to the nats service below, which the link gateway relays to that runner. Only while the link above is
      # configured; otherwise nothing connects. With NATS unreachable a hint is dropped and counted in the log, and the
      # runner learns of its work at its next heartbeat.
      RUNNER_LINK_NATS_URL: "${RUNNER_LINK_NATS_URL:-nats://nats:4222}"
      # Optional: managed runners (docs/self-hosting.md, "Managed runners"): every account gets a runner of its own,
      # a container on this host's Docker, at sign-in. Off unless the host's .env says true. A fresh install
      # (scripts/install-server.sh) writes that line and an upgrade never does, so a deployment that predates managed
      # runners keeps them off. The profile read here, the Docker channel's token and its socket are the files in
      # ORBIT_MANAGED_RUNNERS_DIR, mounted below.
      ORBIT_MANAGED_RUNNERS_ENABLED: "${ORBIT_MANAGED_RUNNERS_ENABLED:-false}"
      ORBIT_MANAGED_RUNNERS_PROFILE: /var/lib/orbit-managed-runners/profile.json
    volumes:
      # Read-only. With ORBIT_MANAGED_RUNNERS_DIR unset, /dev/null stands in, so nothing is created on the host.
      - "${ORBIT_MANAGED_RUNNERS_DIR:-/dev/null}:/var/lib/orbit-managed-runners:ro"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      # Any HTTP response means Nest is up; only a refused connection fails.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  # The wiki's model calls, run on the server (docs/wiki-server-execution-design.md §4.1; the account owner added this
  # service on 2026-10-07): the apiserver's image and code with another entry point. It serves no port and applies no
  # migration — it starts once the apiserver, which applies them on boot, is healthy. The System model's address and
  # key are given to this service and no other: the apiserver reads the model's name and state from the row this one
  # writes (wiki_model_status). Until the wiki's executor is switched to the server, probing the model is all it does.
  wiki-worker:
    image: orbit-apiserver:local
    container_name: orbit-wiki-worker
    restart: unless-stopped
    logging: *logging
    command: node src/apiserver/dist/wiki-worker/main.js
    # Time to stop cleanly, not to drain: a deploy does not wait for a model request in flight (design §13, item 1).
    stop_grace_period: 30s
    environment:
      DATABASE_URL: "postgresql://orbit:orbit@postgres:5432/orbit?schema=public"
      # Optional: the System model — an endpoint speaking the Anthropic Messages API (vLLM's /v1/messages), its key, and
      # the model's name; all three, or the wiki has no System model. Give an address this container can reach: its own
      # 127.0.0.1 is itself, so a model on the host needs a LAN or tunnel address. These are not ANTHROPIC_* names, which
      # an agent session carries and Compose would prefer to .env (src/apiserver/src/wiki/wiki-compose-env.spec.ts).
      ORBIT_WIKI_MODEL_BASE_URL: "${ORBIT_WIKI_MODEL_BASE_URL:-}"
      ORBIT_WIKI_MODEL_API_KEY: "${ORBIT_WIKI_MODEL_API_KEY:-}"
      ORBIT_WIKI_MODEL: "${ORBIT_WIKI_MODEL:-}"
      # Model requests in flight at once, across every space.
      ORBIT_WIKI_MODEL_CONCURRENCY: "${ORBIT_WIKI_MODEL_CONCURRENCY:-4}"
    depends_on:
      apiserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
      args:
        # Public origin the install commands point at; baked into the bundle at build time.
        # Defaults to the local gateway — set PUBLIC_ORIGIN in .env when serving on a domain.
        PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:2086}"
        # Full commit embedded in every advertised runner capability revision. Empty is fine
        # from a Git checkout: the build reads the commit from the checkout's own .git/HEAD.
        ORBIT_SOURCE_SHA: "${ORBIT_SOURCE_SHA:-}"
    container_name: orbit-web
    restart: unless-stopped
    logging: *logging
    depends_on:
      apiserver:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  gateway:
    image: nginx:alpine
    container_name: orbit-gateway
    restart: unless-stopped
    logging: *logging
    depends_on:
      web:
        condition: service_healthy
      apiserver:
        condition: service_healthy
    ports:
      - "2086:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Managed runners on this host's Docker (docs/self-hosting.md, "Managed runners"): the restricted Docker channel
  # (deploy/managed-runner/docker-channel), the one process given the Docker socket. It makes each account's runner
  # container and data volume from its own template, and touches nothing without its instance's label. The apiserver
  # reaches it only through its unix socket in ORBIT_MANAGED_RUNNERS_DIR, and it needs no network of its own.
  # It runs only under the managed-runners-docker profile, which a fresh install switches on in .env
  # (scripts/install-server.sh) and an upgrade never does.
  docker-channel:
    profiles: [managed-runners-docker]
    build:
      context: .
      dockerfile: deploy/managed-runner/docker-channel/Dockerfile
    image: orbit-docker-channel:local
    container_name: orbit-docker-channel
    restart: unless-stopped
    logging: *logging
    network_mode: none
    # The disk the storage budget is measured on: an empty volume of the channel's own, read-only, which Docker keeps
    # beside every runner's data volume whatever filesystem its data root is on. This container sees neither the data
    # root nor what is in it.
    command: ["serve", "--config", "/var/lib/orbit-managed-runners/channel.json", "--disk-probe-path", "/var/lib/orbit-docker-volumes"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${ORBIT_MANAGED_RUNNERS_DIR:-/dev/null}:/var/lib/orbit-managed-runners"
      - type: volume
        target: /var/lib/orbit-docker-volumes
        read_only: true
    healthcheck:
      # Serving: its socket takes a connection. Every request on it still needs the token.
      test: ["CMD", "python3", "-c", "import socket; socket.socket(socket.AF_UNIX).connect('/var/lib/orbit-managed-runners/channel.sock')"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The managed runners' host firewall (docs/self-hosting.md, "Isolation and its limits"; deploy/managed-runner/firewall):
  # rules on this host's iptables that leave a managed runner the gateway's published port, DNS and public addresses, and
  # nothing else of this host or of the private networks behind it. It runs in the host's network namespace with
  # NET_ADMIN and NET_RAW, never with the Docker socket; it checks the rules every 10 s, repairs what changed, and leaves
  # them in place when it stops. The Docker channel starts no runner container while it does not report them in force.
  # It runs only under the managed-runner-firewall profile, which a fresh install switches on in .env beside the Docker
  # backend's (scripts/install-server.sh; --no-managed-runner-firewall leaves it off), and an upgrade never does.
  managed-runner-firewall:
    profiles: [managed-runner-firewall]
    build:
      context: .
      dockerfile: deploy/managed-runner/firewall/Dockerfile
    image: orbit-managed-runner-firewall:local
    container_name: orbit-managed-runner-firewall
    restart: unless-stopped
    logging: *logging
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      # Its configuration, and the status the Docker channel reads.
      - "${ORBIT_MANAGED_RUNNERS_DIR:-/dev/null}/firewall:/var/lib/orbit-managed-runner-firewall"
      # The legacy iptables backend's lock, which Docker's own iptables calls take too; the install names it only where
      # the host's iptables is legacy. Never made on the host: a directory there would break the host's iptables.
      - type: bind
        source: "${ORBIT_MANAGED_RUNNER_FIREWALL_XTABLES_LOCK:-/dev/null}"
        target: /run/xtables.lock
        bind:
          create_host_path: false
    healthcheck:
      # Healthy while its status says the rules are in force: what the Docker channel reads before it starts a runner.
      test: ["CMD", "python3", "-I", "/opt/orbit-managed-runner-firewall/firewall.py", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The runner link's gateway (docs/runner-link-design.md §6.1; docs/self-hosting.md, "Runner link"): the WebSocket
  # endpoint runners connect to, on a port of its own published straight from this host, never through the web gateway
  # above or a proxying CDN. It checks each connection token with the public half of the apiserver's signing key and
  # reads revoked runner credentials from the apiserver with the gateway secret; it holds no signing key and no database
  # connection. Until the link is switched over it keeps connections, answers heartbeats and compares what runners
  # mirror to it, and forwards nothing (src/link-gateway/README.md). It runs only under the runner-link profile, which no
  # install switches on, so a deployment whose .env does not name that profile runs exactly what it ran.
  link-gateway:
    profiles: [runner-link]
    build:
      context: src/link-gateway
      args:
        ORBIT_SOURCE_SHA: "${ORBIT_SOURCE_SHA:-}"
    image: orbit-link-gateway:local
    container_name: orbit-link-gateway
    restart: unless-stopped
    logging: *logging
    # Room to drain before Docker stops it: runners are told to reconnect within LINK_DRAIN_RECONNECT_MAX (30s) and given
    # LINK_DRAIN_GRACE (15s) more, and the drain gives up at LINK_DRAIN_TIMEOUT (80s).
    stop_grace_period: 90s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # The public half of RUNNER_LINK_SIGNING_KEY, base64 of its PEM (openssl pkey -in runner-link.pem -pubout | base64
      # -w0); two, comma-separated, while the signing key is replaced.
      LINK_PUBLIC_KEYS: "${RUNNER_LINK_PUBLIC_KEY:-}"
      LINK_GATEWAY_TOKEN: "${RUNNER_LINK_GATEWAY_TOKEN:-}"
      LINK_API_URL: http://apiserver:3000
      # Where the apiserver publishes runner hints; the gateway subscribes for the runners it holds connections of.
      LINK_NATS_URL: nats://nats:4222
      # Certificates: from files in RUNNER_LINK_GATEWAY_DIR/tls, reloaded when they change, unless
      # RUNNER_LINK_ACME_DOMAINS names the link's host, when the gateway obtains and renews them itself (TLS-ALPN-01,
      # which needs RUNNER_LINK_PORT=443) and keeps them in RUNNER_LINK_GATEWAY_DIR/acme.
      LINK_TLS_CERT_FILE: /var/lib/orbit-link-gateway/tls/fullchain.pem
      LINK_TLS_KEY_FILE: /var/lib/orbit-link-gateway/tls/privkey.pem
      LINK_ACME_DOMAINS: "${RUNNER_LINK_ACME_DOMAINS:-}"
      LINK_ACME_EMAIL: "${RUNNER_LINK_ACME_EMAIL:-}"
      LINK_ACME_CACHE_DIR: /var/lib/orbit-link-gateway/acme
    ports:
      # The runners' port, open to the internet. Metrics and the health check stay on this host's loopback.
      - "${RUNNER_LINK_PORT:-8443}:8443"
      - "127.0.0.1:${RUNNER_LINK_METRICS_PORT:-9464}:9464"
    volumes:
      - "${RUNNER_LINK_GATEWAY_DIR:-/dev/null}:/var/lib/orbit-link-gateway"
    depends_on:
      apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/link-gateway", "health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The runner link's message bus (docs/runner-link-design.md §6.3): NATS, its core publish and subscribe and nothing
  # else. It stores nothing: no JetStream, no volume. The apiserver publishes a hint for a runner on rnr.<runnerId> after
  # the commit it announces, and the link gateway holding that runner's connection relays it; a hint lost while NATS is
  # down costs that runner one heartbeat interval. Flags only, so the image's own configuration file, which opens a
  # cluster port with a well-known route password, is never read. It is reached inside this project's network and on no
  # port of the host, monitoring included, and runs only under the runner-link profile, beside the gateway.
  nats:
    profiles: [runner-link]
    image: nats:2.15-alpine
    container_name: orbit-nats
    restart: unless-stopped
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--http_port", "8222"]
    expose:
      - "4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  # Only the Postgres socket directory: the archive itself is a bind mount under ./data
  # so backups are visible (and copyable off the host) without docker.
  pg-socket:
