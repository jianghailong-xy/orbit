services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    # The image's entrypoint only fixes up PGDATA's ownership, so create and chown the
    # archive here — still as root — before it drops to the postgres user. Without this
    # archive_command cannot write into the bind mount and WAL archiving stalls.
    entrypoint:
      - /bin/sh
      - -c
      - 'mkdir -p /archive/wal /archive/base && chown postgres:postgres /archive /archive/wal /archive/base && exec docker-entrypoint.sh "$$@"'
      - --
    # Continuous WAL archiving: every finished segment is gzipped into ./data/pg-archive
    # (scripts/pg-archive-wal.sh), and a written-to database closes a segment at least
    # every 5 minutes, so recovery lands within that of any moment. The pgbackup service
    # takes the base backups those segments are replayed onto.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - "archive_command=/usr/local/bin/pg-archive-wal.sh %p %f"
      - -c
      - archive_timeout=300
      - -c
      - wal_compression=on
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    expose:
      - "5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/pg-archive:/archive
      - ./scripts/pg-archive-wal.sh:/usr/local/bin/pg-archive-wal.sh:ro
      # Shared with pgbackup so base backups run over the unix socket, which pg_hba
      # already trusts — no replication password anywhere.
      - pg-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Periodic base backups + retention for the WAL archive above. Without a base backup
  # the archived WAL has nothing to replay onto, so the two ship together.
  pgbackup:
    image: postgres:16-alpine
    container_name: orbit-pgbackup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-backup.sh"]
    environment:
      # The bootstrap superuser initdb created (POSTGRES_USER above); no `postgres`
      # role exists in this cluster.
      PGHOST: /var/run/postgresql
      PGUSER: orbit
      PGDATABASE: postgres
      # Seconds between base backups (default daily), how many to keep, and how much
      # free disk to leave: a backup that would eat into that headroom is skipped with
      # an error instead of filling the disk out from under Postgres.
      ORBIT_BASE_BACKUP_INTERVAL: "${ORBIT_BASE_BACKUP_INTERVAL:-86400}"
      ORBIT_BASE_BACKUP_KEEP: "${ORBIT_BASE_BACKUP_KEEP:-2}"
      ORBIT_BACKUP_MIN_FREE_MB: "${ORBIT_BACKUP_MIN_FREE_MB:-2048}"
      # Off-host mirror (unset = local backups only). The archive shares a disk with the
      # database, so this is the copy that survives losing it. Point it at a directory of
      # its own on the far side — the mirror deletes anything there it did not put there.
      ORBIT_BACKUP_SYNC_TARGET: "${ORBIT_BACKUP_SYNC_TARGET:-}"
      ORBIT_BACKUP_SYNC_SSH_PORT: "${ORBIT_BACKUP_SYNC_SSH_PORT:-22}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/pg-archive:/archive
      - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - pg-socket:/var/run/postgresql
      # Read-only: the key that reaches the mirror host, and the host keys to check it
      # against. Only read when ORBIT_BACKUP_SYNC_TARGET is set.
      - "${ORBIT_BACKUP_SSH_DIR:-/root/.ssh}:/ssh:ro"

  apiserver:
    image: orbit-apiserver:local
    build:
      context: .
      dockerfile: src/apiserver/Dockerfile
    container_name: orbit-apiserver
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://orbit:orbit@postgres:5432/orbit?schema=public"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET (generate: openssl rand -base64 32)}"
      # Optional independent signing key for 15-minute runner/session orchestration proofs.
      # Unset derives a domain-separated key from JWT_SECRET.
      RUNNER_ORCHESTRATION_JWT_SECRET: "${RUNNER_ORCHESTRATION_JWT_SECRET:-}"
      # Keep explicit CURRENT_WORK/NEXT_TURN writes disabled through a mixed API/runner rollout.
      # Enable only after every API replica and active runner advertises routing-v1.
      # Optional: access-token (JWT) lifetime (e.g. 1h, 24h, 7d). Clients auto-refresh via a
      # 30d refresh token, so this can be short; defaults to 7d. Shorten once clients ship refresh.
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-7d}"
      # Required: master key (AES-256-GCM) that encrypts control-plane model providers' API keys
      # (DeepSeek etc.) at rest. Must be set at startup. Generate: openssl rand -base64 32.
      PROVIDER_SECRET_KEY: "${PROVIDER_SECRET_KEY:?set PROVIDER_SECRET_KEY (generate: openssl rand -base64 32)}"
      # Optional: where the third-party vendor model lists (Kimi, DeepSeek, GLM, …) refresh from,
      # twice a day. Point at a mirror or a pinned copy where models.dev isn't reachable; a failed
      # fetch just leaves the pickers on the lists this build shipped.
      MODEL_CATALOG_URL: "${MODEL_CATALOG_URL:-https://models.dev/api.json}"
      PORT: "3000"
      CORS_ORIGINS: "http://localhost:2086"
      # Optional: DeepSeek (OpenAI-compatible) for asynchronously improving prompt-derived
      # session titles and filing the session under a few semantic tags. Session creation and
      # worktree branch generation never wait on it.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      # Optional: APNs push for the iOS client ("needs your reply" alerts). Unset → PushService is
      # a no-op (no pushes). APNS_KEY is the base64 of the AuthKey_XXXX.p8 auth key.
      APNS_KEY: "${APNS_KEY:-}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_BUNDLE_ID: "${APNS_BUNDLE_ID:-io.orbitd.app}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      # Any HTTP response means Nest is up; only a refused connection fails.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
      args:
        # Public origin the install commands point at; baked into the bundle at build time.
        # Defaults to the local gateway — set PUBLIC_ORIGIN in .env when serving on a domain.
        PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:2086}"
        # Full commit embedded in every advertised runner capability revision. Empty is fine
        # from a Git checkout: the build reads the commit from the checkout's own .git/HEAD.
        ORBIT_SOURCE_SHA: "${ORBIT_SOURCE_SHA:-}"
    container_name: orbit-web
    restart: unless-stopped
    depends_on:
      apiserver:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  gateway:
    image: nginx:alpine
    container_name: orbit-gateway
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      apiserver:
        condition: service_healthy
    ports:
      - "2086:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  # Only the Postgres socket directory: the archive itself is a bind mount under ./data
  # so backups are visible (and copyable off the host) without docker.
  pg-socket:
