# Docker's json-file driver keeps a container's output forever unless told otherwise: the
# gateway's access log reached 1GB in six days. Rotate at 100MB and keep five files, the older
# ones gzipped — a few days of gateway history, which reading real client traffic out of the
# access log depends on. Takes effect when a container is next recreated.
x-logging: &logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"
    compress: "true"

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    logging: *logging
    # The image's entrypoint only fixes up PGDATA's ownership, so create and chown the
    # archive here — still as root — before it drops to the postgres user. Without this
    # archive_command cannot write into the bind mount and WAL archiving stalls.
    entrypoint:
      - /bin/sh
      - -c
      - 'mkdir -p /archive/wal /archive/base && chown postgres:postgres /archive /archive/wal /archive/base && exec docker-entrypoint.sh "$$@"'
      - --
    # Continuous WAL archiving: every finished segment is gzipped into ./data/pg-archive
    # (scripts/pg-archive-wal.sh), and a written-to database closes a segment at least
    # every 5 minutes, so recovery lands within that of any moment. The pgbackup service
    # takes the base backups those segments are replayed onto.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - "archive_command=/usr/local/bin/pg-archive-wal.sh %p %f"
      - -c
      - archive_timeout=300
      - -c
      - wal_compression=on
      # SQL-level observability. pg_stat_statements has to be preloaded, so it belongs on
      # this command line: ALTER SYSTEM writes postgresql.auto.conf, which neither survives
      # a container rebuild from this file nor runs inside a transaction block. track=top
      # keeps the totals addable — a statement's time already includes the triggers and
      # functions it fires, so tracking nested ones too would double-count them.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=top
      # Name the queries behind pg_stat_database's temp_bytes. 1MB passes over trivial
      # spills but still catches a query that writes many small files, which a threshold
      # set at work_mem would hide.
      - -c
      - log_temp_files=1024
      # Bound what a runaway statement or an abandoned transaction can hold. All three were 0
      # — unlimited — which is how one updateMany held the owner row lock for five minutes on
      # 2026-09-14, and how a 13-minute fan-out left nine UPDATEs queued behind it on 2026-09-19
      # until the pool ran dry. Each number is measured, not a rule of thumb;
      # docs/postgres-runtime-settings.md carries the evidence per setting.
      #
      # statement_timeout is sized by migrations, not by queries. Across 9.2 days / 62.8M calls
      # the one application statement that ever ran past it is the once-a-minute dispatch sweep
      # (655s worst), a read-only backstop whose next tick redoes whatever this one dropped.
      # Migrations apply at apiserver boot and a failed one is a crash loop, so this leaves 5.8x
      # over the longest we have run (52s). The nightly pg_basebackup takes 7-10 minutes and is
      # not subject to it: BASE_BACKUP runs in a walsender, which never arms the timer.
      # A migration or a manual VACUUM/REINDEX needing more sets `SET statement_timeout = 0`
      # itself; autovacuum workers already force all three of these to 0.
      - -c
      - statement_timeout=300s
      # In 4.4 days of log_lock_waits, 196 waits outlasted deadlock_timeout and none reached
      # 30s (worst 12.1s) — this host runs at load 30-60, so textbook 1-5s values would fire on
      # healthy traffic. This is the knob that protects the *waiters*: Prisma cannot roll back a
      # transaction whose statement is parked on a lock, so only the server can end that wait.
      - -c
      - lock_timeout=30s
      # 2.5x the longest transaction budget orbit declares (EVENTS_INGEST_TRANSACTION_TIMEOUT_MS,
      # 120s), because Prisma's own timer can itself be late when the event loop is starved.
      # Must never drop below 120s or it starts killing healthy event-batch writes. Sampled
      # idle-in-transaction gaps top out at 0.14s, three orders of magnitude below this.
      - -c
      - idle_in_transaction_session_timeout=300s
      # work_mem stays at its 4MB default on purpose. 40 of the 52GB of temp written in the 9.2
      # days before this change came from one application read spilling 4.4MB per call, and that
      # read was fixed where it lives (9cad03c7d) instead of raising this for every connection:
      # work_mem multiplies hardest (per connection, per sort/hash node) on a host that is
      # already out of swap.
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    expose:
      - "5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/pg-archive:/archive
      - ./scripts/pg-archive-wal.sh:/usr/local/bin/pg-archive-wal.sh:ro
      # Shared with pgbackup so base backups run over the unix socket, which pg_hba
      # already trusts — no replication password anywhere.
      - pg-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Periodic base backups + retention for the WAL archive above. Without a base backup
  # the archived WAL has nothing to replay onto, so the two ship together.
  pgbackup:
    image: postgres:16-alpine
    container_name: orbit-pgbackup
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-backup.sh"]
    environment:
      # The bootstrap superuser initdb created (POSTGRES_USER above); no `postgres`
      # role exists in this cluster.
      PGHOST: /var/run/postgresql
      PGUSER: orbit
      PGDATABASE: postgres
      # Seconds between base backups (default daily), how many to keep, and how much
      # free disk to leave: a backup that would eat into that headroom is skipped with
      # an error instead of filling the disk out from under Postgres.
      ORBIT_BASE_BACKUP_INTERVAL: "${ORBIT_BASE_BACKUP_INTERVAL:-86400}"
      ORBIT_BASE_BACKUP_KEEP: "${ORBIT_BASE_BACKUP_KEEP:-2}"
      ORBIT_BACKUP_MIN_FREE_MB: "${ORBIT_BACKUP_MIN_FREE_MB:-2048}"
      # Off-host mirror (unset = local backups only). The archive shares a disk with the
      # database, so this is the copy that survives losing it. Point it at a directory of
      # its own on the far side — the mirror deletes anything there it did not put there.
      ORBIT_BACKUP_SYNC_TARGET: "${ORBIT_BACKUP_SYNC_TARGET:-}"
      ORBIT_BACKUP_SYNC_SSH_PORT: "${ORBIT_BACKUP_SYNC_SSH_PORT:-22}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/pg-archive:/archive
      - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - pg-socket:/var/run/postgresql
      # Read-only: the key that reaches the mirror host, and the host keys to check it
      # against. Only read when ORBIT_BACKUP_SYNC_TARGET is set.
      - "${ORBIT_BACKUP_SSH_DIR:-/root/.ssh}:/ssh:ro"

  apiserver:
    image: orbit-apiserver:local
    build:
      context: .
      dockerfile: src/apiserver/Dockerfile
    container_name: orbit-apiserver
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: "postgresql://orbit:orbit@postgres:5432/orbit?schema=public"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET (generate: openssl rand -base64 32)}"
      # Optional independent signing key for 15-minute runner/session orchestration proofs.
      # Unset derives a domain-separated key from JWT_SECRET.
      RUNNER_ORCHESTRATION_JWT_SECRET: "${RUNNER_ORCHESTRATION_JWT_SECRET:-}"
      # Keep explicit CURRENT_WORK/NEXT_TURN writes disabled through a mixed API/runner rollout.
      # Enable only after every API replica and active runner advertises routing-v1.
      # Optional: access-token (JWT) lifetime (e.g. 1h, 24h, 7d). Clients auto-refresh via a
      # 30d refresh token, so this can be short; defaults to 7d. Shorten once clients ship refresh.
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-7d}"
      # Required: master key (AES-256-GCM) that encrypts control-plane model providers' API keys
      # (DeepSeek etc.) at rest. Must be set at startup. Generate: openssl rand -base64 32.
      PROVIDER_SECRET_KEY: "${PROVIDER_SECRET_KEY:?set PROVIDER_SECRET_KEY (generate: openssl rand -base64 32)}"
      # Optional: where the third-party vendor model lists (Kimi, DeepSeek, GLM, …) refresh from,
      # twice a day. Point at a mirror or a pinned copy where models.dev isn't reachable; a failed
      # fetch just leaves the pickers on the lists this build shipped.
      MODEL_CATALOG_URL: "${MODEL_CATALOG_URL:-https://models.dev/api.json}"
      # Optional: how far native Watch is switched on (docs/watch-rollout.md): on (default), canary (only the
      # accounts ORBIT_WATCHES_CANARY_OWNERS lists, comma-separated ids), drain (no new watches; the ones made
      # keep running) or off (drain, and this apiserver runs no Watch evaluation or delivery). Takes effect on
      # `docker compose up -d apiserver`; no migration and no runner release either way.
      # Set it on the host as ORBIT_WATCHES_MODE, not ORBIT_WATCHES: every agent session carries ORBIT_WATCHES (the
      # runner injects it for `orbit mcp`), and Compose prefers the shell's environment to .env, so a deploy run from a
      # session would take the session's value. The canary list keeps its name: no session carries it.
      # (src/apiserver/src/wiki/wiki-compose-env.spec.ts)
      ORBIT_WATCHES: "${ORBIT_WATCHES_MODE:-on}"
      ORBIT_WATCHES_CANARY_OWNERS: "${ORBIT_WATCHES_CANARY_OWNERS:-}"
      # Optional: how far the Orbit Wiki is switched on (src/apiserver/src/wiki/wiki-rollout.ts): on (default),
      # canary (only the accounts ORBIT_WIKI_CANARY_OWNERS lists, comma-separated ids) or off. An account without it
      # gets 404 WIKI_DISABLED on every wiki route, its sessions no wiki tools and no wiki context, and the web hides
      # the Wiki entry points. Takes effect on `docker compose up -d apiserver`; no migration and no runner release.
      # Set it on the host as ORBIT_WIKI_MODE, not ORBIT_WIKI, for the reason ORBIT_WATCHES_MODE gives above.
      ORBIT_WIKI: "${ORBIT_WIKI_MODE:-on}"
      ORBIT_WIKI_CANARY_OWNERS: "${ORBIT_WIKI_CANARY_OWNERS:-}"
      PORT: "3000"
      CORS_ORIGINS: "http://localhost:2086"
      # Where runners reach this deployment — the origin the web image bakes in below. A session on a
      # shared Codex pool is handed <origin>/api/gw/codex as its OpenAI endpoint (providers/shared-pool.ts).
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:2086}"
      # Optional: DeepSeek (OpenAI-compatible) for asynchronously improving prompt-derived
      # session titles and filing the session under a few semantic tags. Session creation and
      # worktree branch generation never wait on it.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      # Optional independent push channels. APNS_KEY is base64 of AuthKey_XXXX.p8.
      APNS_KEY: "${APNS_KEY:-}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_BUNDLE_ID: "${APNS_BUNDLE_ID:-io.orbitd.app}"
      # FCM HTTP v1 for GMS Android. PRIVATE_KEY is base64 of the service account PEM.
      FCM_PROJECT_ID: "${FCM_PROJECT_ID:-}"
      FCM_CLIENT_EMAIL: "${FCM_CLIENT_EMAIL:-}"
      FCM_PRIVATE_KEY: "${FCM_PRIVATE_KEY:-}"
      FCM_ANDROID_PACKAGE: "${FCM_ANDROID_PACKAGE:-io.orbitd.android}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      # Any HTTP response means Nest is up; only a refused connection fails.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
      args:
        # Public origin the install commands point at; baked into the bundle at build time.
        # Defaults to the local gateway — set PUBLIC_ORIGIN in .env when serving on a domain.
        PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:2086}"
        # Full commit embedded in every advertised runner capability revision. Empty is fine
        # from a Git checkout: the build reads the commit from the checkout's own .git/HEAD.
        ORBIT_SOURCE_SHA: "${ORBIT_SOURCE_SHA:-}"
    container_name: orbit-web
    restart: unless-stopped
    logging: *logging
    depends_on:
      apiserver:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  gateway:
    image: nginx:alpine
    container_name: orbit-gateway
    restart: unless-stopped
    logging: *logging
    depends_on:
      web:
        condition: service_healthy
      apiserver:
        condition: service_healthy
    ports:
      - "2086:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  # Only the Postgres socket directory: the archive itself is a bind mount under ./data
  # so backups are visible (and copyable off the host) without docker.
  pg-socket:
