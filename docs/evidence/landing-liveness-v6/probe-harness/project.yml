# TEMPORARY evidence probe (see ../README.md). The iOS app's own shared sources and shell, with
# this probe's entry point in place of OrbitiOSApp. Built and driven on a GitHub macOS runner; the
# screenshots land under docs/evidence/landing-liveness-v6/ios/ and are never merged from here.
name: LandingLivenessProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
packages:
  OrbitKit:
    path: ../src/macos/OrbitKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LandingLivenessProbe:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: ProbeArgs.swift
      - path: ../src/ios/Support/Assets.xcassets
      - path: ../src/ios/Sources
        name: Shell
        excludes:
          - "OrbitiOSApp.swift"
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
          - "HotKeyManager.swift"
          - "UpdaterModel.swift"
          - "RunnerControl.swift"
          - "Views/RunnerControlPane.swift"
          - "Views/MenuBarContent.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.landinglivenessprobe
        PRODUCT_NAME: LandingLivenessProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  LandingLivenessProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LandingLivenessProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.landinglivenessprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LandingLivenessProbe:
    build:
      targets:
        LandingLivenessProbe: all
        LandingLivenessProbeUITests: [test]
    test:
      targets:
        - LandingLivenessProbeUITests
