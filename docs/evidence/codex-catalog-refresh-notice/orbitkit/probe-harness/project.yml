# TEMPORARY evidence probe (see ../README.md). The iOS app's and the Mac app's own shared sources and
# shells, with this probe's entry points in place of OrbitiOSApp / OrbitApp.
name: LandingProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  OrbitKit:
    path: ../src/macos/OrbitKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LandingProbe:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: ProbeArgs.swift
      - path: ../src/ios/Support/Assets.xcassets
      - path: ../src/ios/Sources
        name: Shell
        excludes:
          - "OrbitiOSApp.swift"
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
          - "HotKeyManager.swift"
          - "UpdaterModel.swift"
          - "RunnerControl.swift"
          - "Views/RunnerControlPane.swift"
          - "Views/MenuBarContent.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.landingprobe
        PRODUCT_NAME: LandingProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  LandingProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LandingProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.landingprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
  LandingMacProbe:
    type: application
    platform: macOS
    sources:
      - path: mac
      - path: ProbeArgs.swift
      - path: ../src/macos/Assets.xcassets
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.landingmacprobe
        PRODUCT_NAME: LandingMacProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
  LandingMacProbeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: LandingMacProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.landingmacprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  LandingProbe:
    build:
      targets:
        LandingProbe: all
        LandingProbeUITests: [test]
    test:
      targets:
        - LandingProbeUITests
  LandingMacProbe:
    build:
      targets:
        LandingMacProbe: all
        LandingMacProbeUITests: [test]
    test:
      targets:
        - LandingMacProbeUITests
