# TEMPORARY evidence probe (see README.md). The iOS app's and the Mac app's own shared sources and
# shells, with this probe's entry points in place of OrbitiOSApp / OrbitApp — the session-recap
# probe's arrangement (docs/evidence/session-recap-native), renamed for the recap's chat page and
# project entries.
name: RecapEntriesProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  OrbitKit:
    path: ../src/macos/OrbitKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  RecapEntriesProbe:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: ProbeArgs.swift
      - path: ../src/ios/Support/Assets.xcassets
      - path: ../src/ios/Sources
        name: Shell
        excludes:
          - "OrbitiOSApp.swift"
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
          - "HotKeyManager.swift"
          - "UpdaterModel.swift"
          - "RunnerControl.swift"
          - "Views/RunnerControlPane.swift"
          - "Views/MenuBarContent.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.recapentriesprobe
        PRODUCT_NAME: RecapEntriesProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  RecapEntriesProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: RecapEntriesProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.recapentriesprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
  RecapEntriesMacProbe:
    type: application
    platform: macOS
    sources:
      - path: mac
      - path: ProbeArgs.swift
      - path: ../src/macos/Assets.xcassets
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.recapentriesmacprobe
        PRODUCT_NAME: RecapEntriesMacProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
  RecapEntriesMacProbeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: RecapEntriesMacProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.recapentriesmacprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  RecapEntriesProbe:
    build:
      targets:
        RecapEntriesProbe: all
        RecapEntriesProbeUITests: [test]
    test:
      targets:
        - RecapEntriesProbeUITests
  RecapEntriesMacProbe:
    build:
      targets:
        RecapEntriesMacProbe: all
        RecapEntriesMacProbeUITests: [test]
    test:
      targets:
        - RecapEntriesMacProbeUITests
