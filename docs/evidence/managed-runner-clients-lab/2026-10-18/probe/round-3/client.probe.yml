# TEMPORARY (probe branch, never merged). Replays the Orbit test server's recorded answers (task T07) to the real
# iPhone and Mac apps (.t07-probe/run.sh). The report job
# pushes the pictures, notes, replay logs, verdicts and build log tails to probe/t07-managed-runner-replay-landing-results.
# The landing round: only the replay, of the scenes where each app lands by itself (the compile gates ran with the
# main round on the same tree).
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/t07-managed-runner-replay-landing"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, mac]
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers && python3 --version
      - name: Build, replay and capture
        id: capture
        continue-on-error: true
        env:
          PLATFORMS: ${{ matrix.platform }}
          PROBE_ONLY: ${{ vars.T07_PROBE_ONLY }}
        run: |
          bash .t07-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          P=".t07-probe"
          mkdir -p "$P/shots"
          cp run-output.log "$P/shots/run-output-${{ matrix.platform }}.log" 2>/dev/null || true
          for log in "$P"/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD|XCTAssert|failed" "$log" | head -400 > "$P/shots/summary-$base.txt" || true
            tail -300 "$log" > "$P/shots/tail-$base.txt" || true
          done
          find "$P/shots" -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          rm -rf "$P/shots/ios/attachments" "$P/shots/mac/attachments"
          echo "capture=${{ steps.capture.outcome }}" > "$P/shots/outcomes-${{ matrix.platform }}.txt"
          mkdir -p out/shots
          cp -R "$P/shots/." out/shots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-${{ matrix.platform }}
          path: out

  report:
    name: Push the results where a clone can read them
    needs: [replay]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/t07-managed-runner-replay-landing-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "replay: ${{ needs.replay.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/t07-managed-runner-replay-landing-results
