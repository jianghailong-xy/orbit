# TEMPORARY (probe branch, never merged). Photographs the two kinds of interrupt in the iPhone and Mac
# consoles against .irows-probe/stub.py — on the tree before the change (base, 930f488f7: both rows read
# "Interrupted") and on the change (this commit: the runner restart's row says the runner restarted) —
# runs client.yml's two compile gates on the change, and runs the Android verification with
# InterruptRowsTest's picture kept. The report job pushes the pictures, notes, request logs and log
# tails to probe/interrupt-rows-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/interrupt-rows"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 930f488f7ccbbc88af614aca117d307d84a7261c

jobs:
  # client.yml's macOS gate, its two steps kept apart so a red test can't hide whether OrbitApp builds.
  macos:
    name: macOS (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test OrbitKit (macOS)
        id: kit
        continue-on-error: true
        working-directory: src/macos/OrbitKit
        run: |
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/orbitkit-test.log"
          exit "${PIPESTATUS[0]}"
      - name: Build OrbitApp
        id: build
        continue-on-error: true
        working-directory: src/macos/OrbitApp
        run: |
          swift build 2>&1 | tee "$GITHUB_WORKSPACE/orbitapp-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/macos
          grep -E "error:|Executed [0-9]+ tests|with [0-9]+ failures|failed \(" orbitkit-test.log | head -300 > out/macos/orbitkit-test-summary.txt || true
          tail -60 orbitkit-test.log > out/macos/orbitkit-test-tail.txt || true
          grep -E "error:" orbitapp-build.log | head -300 > out/macos/orbitapp-build-errors.txt || true
          tail -80 orbitapp-build.log > out/macos/orbitapp-build-tail.txt || true
          echo "kit=${{ steps.kit.outcome }} build=${{ steps.build.outcome }}" > out/macos/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-out
          path: out
      - name: Fail as the gate would
        if: steps.kit.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1

  # client.yml's iOS gate, as it stands.
  ios:
    name: iOS (generate + build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version
      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        id: build
        continue-on-error: true
        working-directory: src/ios
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/ios
          grep -E "error:|\*\* BUILD" ios-build.log | head -300 > out/ios/ios-build-summary.txt || true
          tail -60 ios-build.log > out/ios/ios-build-tail.txt || true
          echo "build=${{ steps.build.outcome }}" > out/ios/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-out
          path: out
      - name: Fail as the gate would
        if: steps.build.outcome != 'success'
        run: exit 1

  shots:
    name: Interrupt rows (iPhone + Mac, ${{ matrix.tree }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tree: [base, fix]
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      # The fix is this commit's tree (the probe's files change no app source); the base is the commit
      # the fix was made on, with the same probe copied in.
      - name: The tree under test
        run: |
          if [ "${{ matrix.tree }}" = base ]; then
            git fetch --depth=1 origin "$BASE_SHA"
            git worktree add "$RUNNER_TEMP/tree" FETCH_HEAD
            cp -R .irows-probe "$RUNNER_TEMP/tree/"
            echo "TREE=$RUNNER_TEMP/tree" >> "$GITHUB_ENV"
          else
            echo "TREE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Which interrupt row is under test
        run: |
          grep -n -A3 "case .interrupt" "$TREE/src/macos/OrbitApp/Sources/OrbitApp/Views/Console/ConsoleView.swift" | head -8
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash "$TREE/.irows-probe/run.sh" 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          P="$TREE/.irows-probe"
          mkdir -p "$P/shots"
          cp run-output.log "$P/shots/run-output.log" 2>/dev/null || true
          for log in "$P"/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD|XCTAssert|failed" "$log" | head -400 > "$P/shots/summary-$base.txt" || true
            tail -300 "$log" > "$P/shots/tail-$base.txt" || true
          done
          find "$P/shots" -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          rm -rf "$P/shots/ios/attachments" "$P/shots/mac/attachments"
          echo "tree=${{ matrix.tree }} capture=${{ steps.capture.outcome }}" > "$P/shots/outcomes.txt"
          mkdir -p "out/${{ matrix.tree }}"
          cp -R "$P/shots/." "out/${{ matrix.tree }}/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.tree }}
          path: out

  # The Android half: the full verification (every unit test, lint, the debug APK) as android.yml runs
  # it, with InterruptRowsTest's picture of the production session page kept beside its result.
  android:
    name: Android (verify + interrupt rows shot)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.9+10.0.LTS'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmdline-tools;22.0'
          "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Verify Android
        id: verify
        continue-on-error: true
        run: bash src/android/scripts/verify.sh "$RUNNER_TEMP/android-verification"
      - name: Keep the picture and the results
        if: always()
        run: |
          mkdir -p out/android
          cp -R src/android/build/evidence/interrupt-rows-android/. out/android/ 2>/dev/null || true
          V="$RUNNER_TEMP/android-verification"
          cp "$V/exit-code.txt" "$V/test-summary.txt" out/android/ 2>/dev/null || true
          find "$V" -name 'TEST-io.orbitd.android.reader.InterruptRowsTest.xml' -exec cp {} out/android/ \; 2>/dev/null || true
          grep -E "FAILED|BUILD|tests completed" "$V/verification.log" | tail -60 > out/android/verification-summary.txt 2>/dev/null || true
          tail -80 "$V/verification.log" > out/android/verification-tail.txt 2>/dev/null || true
          echo "verify=${{ steps.verify.outcome }}" > out/android/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-out
          path: out
      - name: Fail as the gate would
        if: steps.verify.outcome != 'success'
        run: exit 1

  report:
    name: Push the results where a clone can read them
    needs: [macos, ios, shots, android]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/interrupt-rows-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "macos: ${{ needs.macos.result }}"
            echo "ios: ${{ needs.ios.result }}"
            echo "shots: ${{ needs.shots.result }}"
            echo "android: ${{ needs.android.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/interrupt-rows-results
