# A one-request iOS app whose only job is to say what URLSession did, built with the SAME
# Info.plist the iPhone app ships (INFOPLIST_FILE points at src/ios/Support/Info.plist, and the
# control arm of the A/B swaps in InfoControl.plist — the same keys with no ATS dictionary).
# run.sh builds and drives both arms on a simulator; docs/evidence/ios-http-ip/README.md says what
# the answer means.
name: ATSProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  ATSProbe:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.atsprobe
        PRODUCT_NAME: ATSProbe
        # The shipped plist itself, not a copy: a copy can be right while the file that ships is
        # wrong, and the whole question is what the shipped file does.
        INFOPLIST_FILE: ../../../../src/ios/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  ATSProbe:
    build:
      targets:
        ATSProbe: all
