# TEMPORARY evidence probe (see README.md). The iOS app's and the Mac app's own shared sources and
# shells, with this probe's entry points in place of OrbitiOSApp / OrbitApp.
name: MainBranchProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  OrbitKit:
    path: ../src/macos/OrbitKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MainBranchProbe:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: ProbeArgs.swift
      - path: ../src/ios/Support/Assets.xcassets
      - path: ../src/ios/Sources
        name: Shell
        excludes:
          - "OrbitiOSApp.swift"
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
          - "HotKeyManager.swift"
          - "UpdaterModel.swift"
          - "RunnerControl.swift"
          - "Views/RunnerControlPane.swift"
          - "Views/MenuBarContent.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.mainbranchprobe
        PRODUCT_NAME: MainBranchProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  MainBranchProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MainBranchProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.mainbranchprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
  MainBranchMacProbe:
    type: application
    platform: macOS
    sources:
      - path: mac
      - path: ProbeArgs.swift
      - path: ../src/macos/Assets.xcassets
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.mainbranchmacprobe
        PRODUCT_NAME: MainBranchMacProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
  MainBranchMacProbeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: MainBranchMacProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.mainbranchmacprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  MainBranchProbe:
    build:
      targets:
        MainBranchProbe: all
        MainBranchProbeUITests: [test]
    test:
      targets:
        - MainBranchProbeUITests
  MainBranchMacProbe:
    build:
      targets:
        MainBranchMacProbe: all
        MainBranchMacProbeUITests: [test]
    test:
      targets:
        - MainBranchMacProbeUITests
