# TEMPORARY (probe branch probe/schedchat-mac-shots, never merged). Task 354CXjOML0uOFkSP36f4M. The commit under test is
# the task branch's tip (this commit's parent) plus this file, which replaces .github/workflows/client.yml on the probe
# branch only. client.yml's own gates run unchanged on the parent itself (dispatched on probe/schedchat-gates); this
# file only takes the Mac pictures, which need a logged-in screen that the Mac mini workspace does not have.
name: Scheduled chat probe (Mac)

on:
  push:
    branches: ["probe/schedchat-mac-shots"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Scheduled chat probe (Mac)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers && system_profiler SPDisplaysDataType | grep -i resolution || true
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        working-directory: docs/evidence/scheduled-chat-apple/probe-harness
        run: |
          PASSES=mac bash run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: The window at 1010 and 1460 points, rendered by the app
        id: widths
        continue-on-error: true
        working-directory: docs/evidence/scheduled-chat-apple/probe-harness
        run: bash mac-shots.sh 2>&1 | tee mac-widths-output.log; exit "${PIPESTATUS[0]}"
      - name: Keep logs beside the shots
        if: always()
        working-directory: docs/evidence/scheduled-chat-apple/probe-harness
        run: |
          mkdir -p shots
          cp run-output.log mac-widths-output.log shots/ 2>/dev/null || true
          { swift --version 2>&1 | head -2; xcodebuild -version; sw_vers; } > shots/toolchain.txt
          find shots -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          python3 - shots <<'PY'
          import os, re, sys
          for root, dirs, files in os.walk(sys.argv[1], topdown=False):
              for name in files + dirs:
                  safe = re.sub(r'[\"\\:<>|*?\r\n]', '_', name)
                  if safe != name:
                      os.rename(os.path.join(root, name), os.path.join(root, safe))
          PY
          echo "capture=${{ steps.capture.outcome }} widths=${{ steps.widths.outcome }}" > shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedchat-mac-shots
          path: docs/evidence/scheduled-chat-apple/probe-harness/shots
      - name: Fail as the capture did
        if: steps.capture.outcome != 'success' || steps.widths.outcome != 'success'
        run: exit 1
