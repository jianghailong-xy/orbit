# TEMPORARY evidence probe (never merged): the owner exception card ("Who fixes it?") drawn by the
# real shared sources on iPhone and Mac. Compiles the iOS app's shell and the Mac app's shared
# sources exactly as docs/evidence/source-refused-native/probe-harness/project.yml does, with this
# probe's entry points in place of OrbitiOSApp / OrbitApp. Run from a copy at the repository root
# (the `../src` paths are relative to it).
name: WhoFixesProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  OrbitKit:
    path: ../src/macos/OrbitKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  WhoFixesProbe:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: ProbeCard.swift
      - path: ../src/ios/Support/Assets.xcassets
      - path: ../src/ios/Sources
        name: Shell
        excludes:
          - "OrbitiOSApp.swift"
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
          - "MenuBarIcon.swift"
          - "HotKeyManager.swift"
          - "UpdaterModel.swift"
          - "RunnerControl.swift"
          - "Views/RunnerControlPane.swift"
          - "Views/MenuBarContent.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.whofixesprobe
        PRODUCT_NAME: WhoFixesProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  WhoFixesMacProbe:
    type: application
    platform: macOS
    sources:
      - path: mac
      - path: ProbeCard.swift
      - path: ../src/macos/Assets.xcassets
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.whofixesmacprobe
        PRODUCT_NAME: WhoFixesMacProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  WhoFixesProbe:
    build:
      targets:
        WhoFixesProbe: all
  WhoFixesMacProbe:
    build:
      targets:
        WhoFixesMacProbe: all
