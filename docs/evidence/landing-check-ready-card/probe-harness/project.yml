# TEMPORARY evidence probe (see README.md). The iOS and Mac apps' own shared sources and shells,
# with this probe's entry points in place of OrbitiOSApp / OrbitApp. Built and driven on GitHub
# macOS runners; the screenshots land under docs/evidence/landing-check-ready-card/{ios,mac}/.
name: LandingSessionProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  OrbitKit:
    path: ../src/macos/OrbitKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LandingSessionProbe:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: ProbeArgs.swift
      - path: ../src/ios/Support/Assets.xcassets
      - path: ../src/ios/Sources
        name: Shell
        excludes:
          - "OrbitiOSApp.swift"
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
          - "HotKeyManager.swift"
          - "UpdaterModel.swift"
          - "RunnerControl.swift"
          - "Views/RunnerControlPane.swift"
          - "Views/MenuBarContent.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.landingsessionprobe
        PRODUCT_NAME: LandingSessionProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  LandingSessionProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LandingSessionProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.landingsessionprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
  LandingSessionMacProbe:
    type: application
    platform: macOS
    sources:
      - path: mac
      - path: ProbeArgs.swift
      - path: ../src/macos/Assets.xcassets
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.landingsessionmacprobe
        PRODUCT_NAME: LandingSessionMacProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
  LandingSessionMacProbeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: LandingSessionMacProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.landingsessionmacprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  LandingSessionProbe:
    build:
      targets:
        LandingSessionProbe: all
        LandingSessionProbeUITests: [test]
    test:
      targets:
        - LandingSessionProbeUITests
  LandingSessionMacProbe:
    build:
      targets:
        LandingSessionMacProbe: all
        LandingSessionMacProbeUITests: [test]
    test:
      targets:
        - LandingSessionMacProbeUITests
