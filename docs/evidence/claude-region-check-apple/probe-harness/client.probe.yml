# TEMPORARY (probe branch, never merged). Photographs the Claude region check on the iPhone client against
# .rgn-probe/stub.py (task 34pVMqwUhJE0RGvrL0ziL, docs/claude-region-check-contract.md, board 03 of
# docs/mocks/claude-region-check). A push runs .rgn-probe/run.sh on macOS 26 — the one macOS job: the app compile
# gates run separately, from the unchanged client.yml dispatched on probe/region-check-apple-gates at the feature
# commit. The report job pushes the pictures, notes, request logs and build summaries to
# probe/region-check-apple-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/region-check-apple"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Claude region check probe (iPhone)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash .rgn-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .rgn-probe/shots
          cp run-output.log .rgn-probe/shots/run-output.log 2>/dev/null || true
          for log in .rgn-probe/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 > ".rgn-probe/shots/summary-$base.txt" || true
            tail -300 "$log" > ".rgn-probe/shots/tail-$base.txt" || true
          done
          find .rgn-probe/shots -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          # XCTest names its own failure attachments with quotes, and upload-artifact refuses such a path.
          python3 - .rgn-probe/shots <<'PY'
          import os, re, sys
          for root, dirs, files in os.walk(sys.argv[1], topdown=False):
              for name in files + dirs:
                  safe = re.sub(r'[\"\\:<>|*?\r\n]', '_', name)
                  if safe != name:
                      os.rename(os.path.join(root, name), os.path.join(root, safe))
                      print("renamed", name, "->", safe)
          PY
          echo "capture=${{ steps.capture.outcome }}" > .rgn-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgn-shots
          path: .rgn-probe/shots
      - name: Fail as the probe would
        if: steps.capture.outcome != 'success'
        run: exit 1

  report:
    name: Push the results where a clone can read them
    needs: [shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/region-check-apple-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/region-check-apple-results
