<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/var/tmp/agy-e2e/fonts</dir>
  <cachedir>/var/tmp/x1-disable-e2e/fccache</cachedir>
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>PingFang SC</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family><family>Noto Sans SC</family></prefer></alias>
</fontconfig>
