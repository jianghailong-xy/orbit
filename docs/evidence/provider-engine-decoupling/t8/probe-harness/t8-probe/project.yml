# TEMPORARY evidence probe (see README.md). The iOS app's own shell and shared sources, with this probe's
# entry point in place of OrbitiOSApp.
name: T8Probe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
packages:
  OrbitKit:
    path: ../src/macos/OrbitKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  T8Probe:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: ProbeArgs.swift
      - path: ../src/ios/Support/Assets.xcassets
      - path: ../src/ios/Sources
        name: Shell
        excludes:
          - "OrbitiOSApp.swift"
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
          - "HotKeyManager.swift"
          - "UpdaterModel.swift"
          - "RunnerControl.swift"
          - "Views/RunnerControlPane.swift"
          - "Views/MenuBarContent.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.t8probe
        PRODUCT_NAME: T8Probe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  T8ProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: T8Probe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.t8probe.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  T8Probe:
    build:
      targets:
        T8Probe: all
        T8ProbeUITests: [test]
    test:
      targets:
        - T8ProbeUITests
