# TEMPORARY (probe branch probe/owner-card-ios-text, never merged). Task 34yrjHbz0YEakLPGHqDJZ. The commit under
# test is the task branch (this commit's parent) plus .ocit-probe/ and this file, which replaces
# .github/workflows/client.yml on this branch only. Adapted from
# docs/evidence/coordinator-delivery-line/probe-harness/client.probe.yml.
#
#   • The gates are main's own client.yml and ci.yml, dispatched on probe/owner-card-ios-text-gates at the task
#     commit itself; this file holds only the pictures.
#   • shots — .ocit-probe/run.sh on macos-26: the iPhone probe app driven by XCUITest against .ocit-probe/stub.py.
#   • report — pushes every job's result, summaries, logs and pictures to probe/owner-card-ios-text-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/owner-card-ios-text"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Owner card text probe (iPhone)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash .ocit-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .ocit-probe/shots
          cp run-output.log .ocit-probe/shots/run-output.log 2>/dev/null || true
          { swift --version 2>&1 | head -2; xcodebuild -version; xcodegen --version; sw_vers; } > .ocit-probe/shots/toolchain.txt
          for log in .ocit-probe/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 > ".ocit-probe/shots/summary-$base.txt" || true
            tail -300 "$log" > ".ocit-probe/shots/tail-$base.txt" || true
          done
          find .ocit-probe/shots -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          # XCTest names its own failure attachments with quotes ("Debug description for "…" Button"), and
          # upload-artifact refuses such a path: round 1 lost every picture to one of them.
          python3 - .ocit-probe/shots <<'PY'
          import os, re, sys
          for root, dirs, files in os.walk(sys.argv[1], topdown=False):
              for name in files + dirs:
                  safe = re.sub(r'[\"\\:<>|*?\r\n]', '_', name)
                  if safe != name:
                      os.rename(os.path.join(root, name), os.path.join(root, safe))
                      print("renamed", name, "->", safe)
          PY
          echo "capture=${{ steps.capture.outcome }}" > .ocit-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocit-shots
          path: .ocit-probe/shots
      - name: Fail as the capture did
        if: steps.capture.outcome != 'success'
        run: exit 1

  report:
    name: Push the results where a clone can read them
    needs: [shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/owner-card-ios-text-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/owner-card-ios-text-results
