// Evidence kit for task 34jpFWQkUfxoS2HX9X7N1: compiles src/RemovedDefaultShotsTest.kt (kept in this directory) into the androidTest
// APK, so nothing under src/android/app/src/androidTest changes. Pass it as a second -I beside the build-dir init script, with
// `gradlew -p src/android`: the path is taken from the Android project's root.
allprojects { p ->
    p.plugins.withId('com.android.application') {
        p.android.sourceSets.androidTest.java.srcDir(new File(p.rootProject.projectDir, '../../docs/evidence/default-account-removal/android/kit/src').canonicalFile)
    }
}
