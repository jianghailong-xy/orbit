# TEMPORARY (probe branch probe/main-checkout-native, never merged). Task 34vZvzdK0NZaSo0JNQ2ES. The commit under
# test is the task branch plus .mc-probe/ and this file, which replaces .github/workflows/client.yml on this branch
# only. Adapted from docs/evidence/coordinator-delivery-line/probe-harness/client.probe.yml.
#   • font-tokens, nav-push, macos, ios — client.yml's own gate jobs on that commit (OrbitKit swift test on macOS,
#     OrbitApp swift build, the iOS app's xcodebuild), with their logs kept.
#   • shots — .mc-probe/run.sh on macos-26: the iPhone and Mac probe apps driven by XCUITest against .mc-probe/stub.py.
#   • report — pushes every job's result, summaries, logs and pictures to probe/main-checkout-native-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/main-checkout-native"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  font-tokens:
    name: Font tokens (bare system(size:) audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit bare system(size:) outside Typography.swift
        run: |
          hits=$(grep -rn "system(size" src/macos/OrbitApp/Sources src/ios/Sources --include='*.swift' \
                 | grep -v "Views/Typography.swift" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            count=$(echo "$hits" | wc -l)
            echo "::error::$count bare system(size:) call site(s) outside Views/Typography.swift — use the Font.orbit* tokens (see the Typography.swift header)"
            exit 1
          else
            echo "No bare system(size:) call sites outside Typography.swift."
          fi

  nav-push:
    name: Navigation (one push mechanism per stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate a second push mechanism
        run: bash scripts/ci/nav-push-gate.sh

  macos:
    name: macOS (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version && sw_vers
      - name: Test OrbitKit (macOS)
        id: kit
        continue-on-error: true
        working-directory: src/macos/OrbitKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/orbitkit-macos.log"
      - name: Build OrbitApp
        id: app
        if: always()
        working-directory: src/macos/OrbitApp
        run: |
          set -o pipefail
          swift build 2>&1 | tee "$RUNNER_TEMP/orbitapp-macos.log"
      - name: What the build compiled, for the files this task changed
        if: always()
        working-directory: src/macos/OrbitApp
        run: |
          for f in MainCheckoutViews WorktreeBar ConsoleView AgentsView; do
            echo "== $f.swift"
            grep -n "$f\.swift" "$RUNNER_TEMP/orbitapp-macos.log" | head -5 || true
            find .build -path '*OrbitApp.build/*' -name "$f.swift.o" -exec ls -la {} \; || true
          done 2>&1 | tee "$RUNNER_TEMP/compiled-macos.txt"
      - name: Keep what each step said
        if: always()
        run: |
          mkdir -p macos-out
          { swift --version 2>&1 | head -2; xcodebuild -version; sw_vers; } > macos-out/toolchain.txt
          echo "test-orbitkit: ${{ steps.kit.outcome }}" > macos-out/outcomes.txt
          echo "build-orbitapp: ${{ steps.app.outcome }}" >> macos-out/outcomes.txt
          cp "$RUNNER_TEMP/compiled-macos.txt" macos-out/compiled-macos.txt || true
          grep -E "error:|failed \(|Executed [0-9]+ tests|Test Suite 'MainCheckout" "$RUNNER_TEMP/orbitkit-macos.log" | tail -300 > macos-out/orbitkit-summary.txt || true
          grep -E "Test Case '-\[OrbitKitTests\.(MainCheckoutTests|TranscriptStoreTests)" "$RUNNER_TEMP/orbitkit-macos.log" > macos-out/orbitkit-main-checkout-suites.txt || true
          grep -E "error:|warning:.*(MainCheckout|WorktreeBar|ConsoleView|AgentsView)|Build complete|Compiling" "$RUNNER_TEMP/orbitapp-macos.log" | tail -400 > macos-out/orbitapp-summary.txt || true
          tail -80 "$RUNNER_TEMP/orbitapp-macos.log" > macos-out/orbitapp-tail.txt || true
          gzip -9c "$RUNNER_TEMP/orbitapp-macos.log" > macos-out/orbitapp-macos.log.gz || true
          gzip -9c "$RUNNER_TEMP/orbitkit-macos.log" > macos-out/orbitkit-macos.log.gz || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-out
          path: macos-out
      - name: Fail as the steps did
        if: steps.kit.outcome != 'success' || steps.app.outcome != 'success'
        run: exit 1

  ios:
    name: iOS (generate + build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        id: build
        working-directory: src/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: What the build compiled, for the files this task changed
        if: always()
        run: |
          for f in MainCheckoutViews WorktreeBar ConsoleView AgentsView; do
            echo "== $f.swift"
            grep -E "SwiftCompile .*/$f\.swift" "$RUNNER_TEMP/ios-build.log" | head -5 || true
            find ~/Library/Developer/Xcode/DerivedData -path '*Orbit.build/*' -name "$f.o" -exec ls -la {} \; 2>/dev/null || true
          done 2>&1 | tee "$RUNNER_TEMP/compiled-ios.txt"
      - name: Keep what the build said
        if: always()
        run: |
          mkdir -p ios-out
          { swift --version 2>&1 | head -2; xcodebuild -version; xcodegen --version; sw_vers; } > ios-out/toolchain.txt
          echo "build-ios: ${{ steps.build.outcome }}" > ios-out/outcomes.txt
          cp "$RUNNER_TEMP/compiled-ios.txt" ios-out/compiled-ios.txt || true
          grep -E "error:|warning:.*(MainCheckout|WorktreeBar|ConsoleView|AgentsView)|\*\* BUILD" "$RUNNER_TEMP/ios-build.log" | tail -300 > ios-out/ios-build-summary.txt || true
          tail -60 "$RUNNER_TEMP/ios-build.log" > ios-out/ios-build-tail.txt || true
          gzip -9c "$RUNNER_TEMP/ios-build.log" > ios-out/ios-build.log.gz || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-out
          path: ios-out

  shots:
    name: Main checkout probe (iPhone + Mac)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash .mc-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .mc-probe/shots
          cp run-output.log .mc-probe/shots/run-output.log 2>/dev/null || true
          { swift --version 2>&1 | head -2; xcodebuild -version; xcodegen --version; sw_vers; } > .mc-probe/shots/toolchain.txt
          for log in .mc-probe/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 > ".mc-probe/shots/summary-$base.txt" || true
            tail -300 "$log" > ".mc-probe/shots/tail-$base.txt" || true
          done
          find .mc-probe/shots -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          # XCTest names its own failure attachments with quotes ("Debug description for "…" Button"), and
          # upload-artifact refuses such a path: round 1 lost every picture to one of them.
          python3 - .mc-probe/shots <<'PY'
          import os, re, sys
          for root, dirs, files in os.walk(sys.argv[1], topdown=False):
              for name in files + dirs:
                  safe = re.sub(r'[\"\\:<>|*?\r\n]', '_', name)
                  if safe != name:
                      os.rename(os.path.join(root, name), os.path.join(root, safe))
                      print("renamed", name, "->", safe)
          PY
          echo "capture=${{ steps.capture.outcome }}" > .mc-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-shots
          path: .mc-probe/shots
      - name: Fail as the capture did
        if: steps.capture.outcome != 'success'
        run: exit 1

  report:
    name: Push the results where a clone can read them
    needs: [font-tokens, nav-push, macos, ios, shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/main-checkout-native-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "font-tokens: ${{ needs.font-tokens.result }}"
            echo "nav-push: ${{ needs.nav-push.result }}"
            echo "macos: ${{ needs.macos.result }}"
            echo "ios: ${{ needs.ios.result }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/main-checkout-native-results
