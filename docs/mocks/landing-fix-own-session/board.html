<style>

.rv-lede { max-width: 1300px; }

/* ① 路径 */

.rv-lane { display: flex; align-items: stretch; }
.rv-box { flex: 1; min-width: 0; background: #fff; border: 1.5px solid #c9c9d0; border-radius: 11px; padding: 9px 11px; font-size: 13px; line-height: 1.5; color: #3a3a42; }

.rv-box .who.agent { background: #e7e0ff; color: #4a2fa8; }

.rv-box.hot { border-color: #e0584d; background: #fff4f3; }
.rv-box.ok { border-color: #34a853; background: #f1fbf3; }

/* ② 任务会话里的那张卡 */
.rv-card { margin: 8px 14px; border-radius: 16px; background: var(--warm); box-shadow: inset 0 0 0 1px var(--warm-line); padding: 11px 13px 12px; display: flex; flex-direction: column; gap: 7px; }
.rv-card .eh { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--amber-ink); letter-spacing: .02em; }
.rv-card .eh .k { margin-left: auto; font-weight: 600; color: #7a5300; background: #fff; border-radius: 999px; padding: 0 8px; box-shadow: inset 0 0 0 1px var(--warm-line); }
.rv-card .tt { font-size: 15px; font-weight: 650; line-height: 1.35; }
.rv-card .p { font-size: 13.5px; line-height: 1.46; color: #2c2c33; }
.rv-card .p b { font-weight: 650; }
.rv-card .files { background: #fff; border-radius: 10px; padding: 7px 10px; font: 11.2px/1.6 "JetBrains Mono", monospace; color: #2c2c33; white-space: nowrap; overflow: hidden; }
.rv-card ol { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; color: #2c2c33; }

.rv-card .ft a { color: var(--tint); font-weight: 600; }
.rv-tx { position: absolute; top: 116px; left: 0; right: 0; bottom: 92px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.rv-quote { background: #fff; border-radius: 10px; padding: 7px 10px; font-size: 13px; line-height: 1.45; color: #2c2c33; box-shadow: inset 0 0 0 .5px rgba(60,60,67,.14); }
.rv-quote i { color: var(--l2); font-style: normal; display: block; font-size: 11.5px; margin-bottom: 2px; }
.sc4.rv-fix { background: #F6F3FF; box-shadow: inset 0 0 0 1px rgba(122,90,245,.28); }
.rv-in { padding: 0 14px 8px; }
.rv-in .ev { font-size: 13.5px; padding: 4px 0; }
.rv-new .tx2 { background: rgba(122,90,245,.09); border-radius: 10px; padding: 5px 9px; }

.rv-later { opacity: .62; }

.rv-panel { width: 1300px; }

<body>
<h1>落地失败先交给任务自己的会话（契约修订 42 草稿 · 2026-11-20）</h1>
<p class="lede rv-lede">今天一次任务落地冲突或检查失败，要经协调会话转一手，再开一条<b>新的</b>工作会话返工；写这份工作的会话不在这条路上。<br>
修订 42：<b>门不动</b>（排队、在组合树上跑检查、推送、进 main 的确认都还是 Orbit 做），只把「谁来修」换成<b>写这份工作的会话</b>；它修不了，才到协调会话。<br>
本图：① 一次冲突走的路，现在与改后；② iPhone 上看到什么；③ 待你定的四条。英文是上线文案，中文是说明；项目与任务名是示例数据。只画了 iPhone，web 与 Android 用同一组部件，方向定了再画。</p>
<div id="board"></div>
<script>
const WP = 'Android 客户端';
const WBR = 'project/34ZZn…CsCFp';
const WRUN = 'workstation-gpu';
const T = 'A10c · 通知冷启动后跳转丢失会话';
const WTASK = ic('task', 14, '#8e8e93', 2);
const AG = ic('person', 14, '#7a5af5', 2.2);
const rcap = (title, items) => `<b>${title}</b><ul class="rv-ul">${items.map((i) => `<li>${i}</li>`).join('')}</ul>`;
const rfig = (tag, label, ph, capHtml) => `<figure><span class="tag ${tag}">${label}</span>${ph}<figcaption>${capHtml}</figcaption></figure>`;
const navW = (title, sub) => `<div class="nav"><div class="circ">${ic('chevl', 21, '#000', 2.4)}</div><div class="ttl"><b>${title}</b><span>${sub}</span></div><div class="circ">${ic('dots', 25, '#000', 1.7)}</div></div>`;
const RFOOT = (who) => lfoot(`Orbit runs these landings — <b>nothing to type here.</b><br>Decisions: ${who}`);
const rbody = (inner, top, bottom = 84) => `<div class="lw-sc" style="position:absolute;left:0;right:0;top:${top}px;bottom:${bottom}px;overflow:hidden"><div class="rv-in">${inner}</div></div>`;
const FILES = `<div class="files">app/…/notify/ColdStartRouter.kt<br>app/…/session/SessionListStore.kt</div>`;

// ── ① 路径 ───────────────────────────────────────────────────────────────────────
const box = (who, cls, title, text) => `<div class="rv-box ${cls}"><span class="who ${who[0]}">${who[1]}</span><b>${title}</b>${text}</div>`;
const ORB = ['orbit', 'Orbit'], TS = ['agent', '任务自己的会话'], NS = ['agent', '新的工作会话'], CO = ['coord', '协调会话'];
const arr = '<div class="rv-arr">→</div>';
const FLOW_NOW = [
  box(ORB, 'hot', '落地冲突', '变基到项目分支时 2 个文件冲突；什么都没推'),
  box(ORB, '', '开一条待办', '投给协调会话'),
  box(CO, 'hot', '读待办，转述', '写评论说明冲突，再 <code>task_reopen</code>；它碰不到那棵树'),
  box(NS, 'hot', '从头接手', '新分支、没有上下文；把上一条会话的提交拣过来，解冲突'),
  box(CO, '', '重新裁决', '新证据 → 再确认 → 任务再次 DONE'),
  box(ORB, 'gate', '再排一次落地', '排队、检查、推送'),
].join(arr);
const FLOW_NEW = [
  box(ORB, 'hot', '落地冲突', '变基到项目分支时 2 个文件冲突；什么都没推'),
  box(ORB, '', '直接交给写它的会话', '待办照开，但先在任务会话手里；协调会话不被叫醒'),
  box(TS, 'ok', '在自己的分支上修', '把项目分支合进来、解冲突、跑通、提交、结束这一轮。任务保持 DONE'),
  box(ORB, 'gate', '按新提交再落一次', '排队、检查、推送；落上了，待办自己关'),
].join(arr);
const part1 = `<div class="rv-flows">
<div class="rv-flow now"><h3><span class="tag now" style="margin:0">现在</span>一次冲突：三个会话、两次裁决 <small>协调会话只是转述；真正动手的是一条冷启动的新会话</small></h3>
<div class="rv-lane">${FLOW_NOW}</div></div>
<div class="rv-flow new"><h3><span class="tag after" style="margin:0">改后</span>一次冲突：一个会话、不重新裁决 <small>蓝框是门，两边一样：排队、组合树上的检查、推送都还是 Orbit</small></h3>
<div class="rv-lane">${FLOW_NEW}</div>
<div class="rv-back"><b>修不了时</b><span class="pill">这一轮没有新提交</span><span class="pill">这一轮失败或被打断</span><span class="pill">会话已被人结束</span><span class="pill">已经修过 2 轮</span>
<span>→ 待办交回<b>协调会话</b>，从这一刻起照今天的路走（升级计时也从这一刻算）。</span></div></div>
</div>
<p class="rv-sum" style="max-width:1692px"><b>不交给任务会话的</b>：main 或项目分支本身就红（基线红）、检查超时、runner 或 git 出错，以及项目分支合入 main 的失败。这些不是这份工作的错，照旧归协调会话。</p>`;

// ── ② iPhone ────────────────────────────────────────────────────────────────────
// a · 现在：落地窗口里等决定的那张卡（main 上的样子）
const HEAD_FAIL = head4({ tone: 'fail', title: 'Landing', right: 'Not landed', detail: 'conflict · rebasing onto the project branch' });
const TL_G1 = rnd('Generation 1') + ev('10:01', WTASK, `Task marked done · queued to land on ${WBR}`)
  + ev('10:02', RING, `Claimed by runner ${WRUN} · claim 1`)
  + ev('10:02', X, '<b>Conflict</b> in 2 files · nothing was pushed<span class="sub">The project branch did not move.</span>');
const pA = phone(`${statusBar('10:20', 97)}${navW('Landings', `Run by Orbit · ${WP}`)}
<div style="position:absolute;top:116px;left:0;right:0">${sc4('fail', HEAD_FAIL + `<div class="lw-what" style="font-size:13px">${T}</div>`
  + `<div class="t13">Conflict in 2 files while rebasing onto ${WBR} · <b>nothing was pushed</b></div>`
  + scl(`${ic('person', 13, '#7a5af5', 2)}<b>Coordinator</b>&nbsp;has it · 18m`)
  + `<div class="acts">${cap4('Open Coordinator')}${cap4('Open Task', 'grey')}</div>`)}</div>
${rbody(TL_G1 + mkx(ev('10:02', ARR, 'Asked the coordinator to fix it'), 1, 'in', 'border-radius:10px'), 330)}
${RFOOT('the coordinator · <a>Open coordinator ›</a>')}`, 'page');

// b · 改后：任务自己的会话里
const CARD = `<div class="rv-card"><div class="eh">${triFill(13, 'var(--amber-ink)')}FROM ORBIT · LANDING<span class="k">Conflict</span></div>
<div class="tt">Orbit could not land your work on ${WBR}</div>
<div class="p">Conflict while rebasing onto the project branch at <code>41ac9e0</code>. <b>Nothing was pushed.</b></div>${FILES}
<ol><li>Merge the project branch into your branch and resolve what conflicts.</li><li>Run what failed until it passes.</li><li>Commit, then end your turn.</li></ol>
<div class="ft">Orbit lands the new commit and runs the checks again. Do not push the project branch. Not yours to fix? End your turn without committing and say why. · <a>Open landing ›</a></div></div>`;
const pB = phone(`${statusBar('10:09', 97)}${navW(`执行任务：${T}`, `Task done · landing`)}
<div class="rv-tx"><div class="stamp" style="margin-bottom:12px">10:02</div>${mkx(CARD, 1, 'in', 'border-radius:18px;margin:0 6px')}
${mkx(abub('Merged <code>project/34ZZn…CsCFp</code> into my branch. Both conflicts were with A13f’s store refactor: I kept its <code>SessionListStore</code> API and moved my wait-for-list onto it. <code>ColdStartRouteTest</code> passes. Committed <code>4be19c2</code>.'), 2, 'in', 'border-radius:12px;margin:0 8px')}
${mkx(sysLine(`${ic('ring', 13, 'var(--tint)', 2.4)}Landing <span class="sha">4be19c2</span> again <span class="go">Open landing ${ic('chevr', 10, 'var(--tint)', 3)}</span>`), 3, 'in', 'border-radius:999px;align-self:center;margin-bottom:8px')}</div>
<div class="composer">Message…</div>`);

// c · 改后：落地窗口，正在被它自己的会话修 → 修完再落
const HEAD_FIX = head4({ tone: 'run', title: 'Landing', right: 'Fixing', detail: 'conflict · its own session is on it' });
const pC = phone(`${statusBar('10:06', 97)}${navW('Landings', `Run by Orbit · ${WP}`)}
<div style="position:absolute;top:116px;left:0;right:0">${mkx(sc4('rv-fix', HEAD_FIX + `<div class="lw-what" style="font-size:13px">${T}</div>`
  + `<div class="t13">Conflict in 2 files while rebasing onto ${WBR} · <b>nothing was pushed</b></div>`
  + scl(`${AG}<b>The task’s session</b>&nbsp;is fixing it · 4m · round 1 of 2`)
  + `<div class="acts">${cap4('Open Session')}${cap4('Open Task', 'grey')}</div>`), 1, 'in', 'border-radius:18px;margin:0 6px')}</div>
${rbody(TL_G1 + mkx(ev('10:02', AG, '<b>Handed to the task’s session</b><span class="sub">It wrote this work · round 1 of 2</span>', 'rv-new')
  + ev('10:09', ic('up', 15, '#7a5af5', 2), 'Fixed in <code>4be19c2</code> · landing again', 'rv-new'), 2, 'in', 'border-radius:10px')
  + `<div class="rv-later"><div class="rv-then">10:09 之后：卡回到 checking，记录接着写</div>` + rnd('Generation 2') + ev('10:09', WTASK, `Queued again to land on ${WBR}`)
  + ev('10:14', OK, 'Landing check passed · 3m 48s <a>Log ›</a>') + ev('10:14', OK, `Landed on ${WBR} · <code>7d03b6e</code>`) + '</div>', 336)}
<div class="lfoot mk in" style="outline-offset:-5px;border-radius:0 0 40px 40px">Orbit runs these landings — <b>nothing to type here.</b><br>Decisions: the task’s own session first, then the coordinator${badge(3)}</div>`, 'page');

// d · 改后：它修不了，交回协调会话
const pD = phone(`${statusBar('10:31', 97)}${navW('Landings', `Run by Orbit · ${WP}`)}
<div style="position:absolute;top:116px;left:0;right:0">${sc4('fail', HEAD_FAIL + `<div class="lw-what" style="font-size:13px">${T}</div>`
  + mkx(`<div class="rv-quote"><i>The task’s session ended its turn without a new commit:</i>“The conflict is with A13f’s store refactor, which removes the list-ready signal my fix waits on. Which of the two designs stays is not mine to decide.”</div>`, 1, 'in', 'border-radius:12px')
  + scl(`${ic('person', 13, '#7a5af5', 2)}<b>Coordinator</b>&nbsp;has it · just now`)
  + `<div class="acts">${cap4('Open Coordinator')}${cap4('Open Session', 'grey')}${cap4('Open Task', 'grey')}</div>`)}</div>
${rbody(TL_G1 + ev('10:02', AG, 'Handed to the task’s session<span class="sub">round 1 of 2</span>')
  + mkx(ev('10:31', ARR, '<b>Returned to the coordinator</b> · no new commit'), 2, 'in', 'border-radius:10px'), 440)}
${RFOOT('the coordinator · <a>Open coordinator ›</a>')}`, 'page');

// ── ③ 待定 ──────────────────────────────────────────────────────────────────────
const part3 = `<div class="rv-panel">
<table class="rv-q"><tr><th>#</th><th>要你定的</th><th>默认（图上画的）</th><th>可以改成</th></tr>
<tr><td>Q30</td><td>哪些失败先交任务会话</td><td class="rec">任务落地的冲突，和这份工作自己弄红的检查。基线红、超时、runner 出错、项目分支合入 main 照旧归协调会话</td><td>只交冲突；检查失败照旧归协调会话</td></tr>
<tr><td>Q31</td><td>它修过之后，要不要重新裁决</td><td class="rec">不要。任务保持 DONE，判它的是组合树上重跑的任务验收和落地检查；修了哪几个提交记在落地窗口里（c ②）</td><td>每次修复都把任务重开一代，新证据、新裁决之后再落。慢，但防得住「把检查改弱了让它过」</td></tr>
<tr><td>Q32</td><td>最多修几轮</td><td class="rec">每个任务 2 轮，第三次失败归协调会话（c ① 的 round 1 of 2）</td><td>1 轮；或由协调者按项目定</td></tr>
<tr><td>Q33</td><td>没开 Automatic 的项目也先交任务会话吗</td><td class="rec">是。解自己的冲突不是授权；进 main 那一步仍然要你确认</td><td>只在 Automatic 的项目里交</td></tr>
</table>
<p style="color:#6a6a72;font-size:13.5px;margin-top:12px">条文在 <code>docs/project-integration-line-contract.md</code> §12（草稿，裁决前不改任何现行条款）。本图不含 web 与 Android；项目页的 Landing 卡与 Landings 行沿用今天的部件，只多一种状态词 <b>Fixing</b>，在任务会话手里的落地不计入 Needs you。</p>
</div>`;

document.getElementById('board').innerHTML = `
<section class="rv-part" id="part-1" data-png="01-path">
${band('① 一次冲突走的路', 'now', '同一次落地冲突，现在与改后')}
${part1}</section>

<section class="rv-part" id="part-2" data-png="02-iphone">
${band('② iPhone 上看到什么', 'after', '落地窗口与任务自己的会话')}
<div class="rv-row">
${rfig('now', 'a · 现在 · 落地窗口', pA, rcap('冲突交给协调会话', [
  `${n(1)}记录的最后一行是 <i>Asked the coordinator to fix it</i>。之后发生的事（协调会话写评论、重开任务、新会话返工、重新裁决）都不在这个窗口里，要去另外三个地方看。`]))}
${rfig('after', 'b · 改后 · 任务自己的会话', pB, rcap('失败直接到写这份工作的会话里', [
  `${n(1)}一张 Orbit 发来的卡：哪一步、哪些文件、什么都没推，以及它该做的三步。会话已随任务 DONE 结束时，这张卡把它续上。`,
  `${n(2)}它带着做这份工作时的全部上下文，在自己的分支上修。不推项目分支。`,
  `${n(3)}这一轮结束、分支上有新提交，Orbit 自己再排一次落地；会话里只多这一行。`]))}
${rfig('after', 'c · 改后 · 落地窗口', pC, rcap('同一个窗口里看得到谁在修、修成了什么', [
  `${n(1)}状态词 <b>Fixing</b>，卡上写在谁手里、第几轮；门是 Open Session（进 b）。这段时间它不算等你、也不算等协调会话。`,
  `${n(2)}记录多两种行：交给任务会话、它修出的提交。淡色的是 10:09 之后接着写下的：第二代的检查与落地。`,
  `${n(3)}底部那句改成先任务自己的会话、再协调会话。`]))}
${rfig('after', 'd · 改后 · 它修不了', pD, rcap('交回协调会话，带着它说的话', [
  `${n(1)}任务会话没有新提交就结束了这一轮：它最后说的话原样带给协调会话，协调会话收到时已经是一个要它判断的问题。`,
  `${n(2)}从这一行起和今天一样：协调会话的门、升级给你的计时，都从交回的时刻算。`]))}
</div></section>
