<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/mnt/tmp/nyj-mock/fonts</dir>
  <alias binding="strong"><family>-apple-system</family><prefer><family>Inter</family><family>Noto Sans SC</family></prefer></alias>
  <alias binding="strong"><family>BlinkMacSystemFont</family><prefer><family>Inter</family><family>Noto Sans SC</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family><family>Noto Sans SC</family></prefer></alias>
  <alias binding="strong"><family>PingFang SC</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family><family>Noto Sans SC</family></prefer></alias>
</fontconfig>
