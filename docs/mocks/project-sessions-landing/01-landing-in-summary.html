<!doctype html><html lang="zh"><meta charset="utf-8">
<style>
:root{--tint:#3E69F6;--label:#000;--l2:rgba(60,60,67,.6);--l3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);--green:#34C759;--orange:#FF9500}
*{box-sizing:border-box}
body{margin:0;padding:40px 40px 56px;background:#e4e4e9;color:#16161a;font:15px/1.55 "Inter","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;width:1856px}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 8px}
.lede{color:#55555e;max-width:1700px;margin:0 0 28px}
.row{display:flex;gap:36px;align-items:flex-start}
figure{margin:0;width:393px}
figcaption{margin-top:16px;font-size:13.5px;color:#4a4a52}
figcaption>b{color:#16161a;display:block;font-size:14.5px;margin-bottom:4px}
figcaption ul{margin:6px 0 0;padding-left:18px} figcaption li{margin:3px 0}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;margin-bottom:8px}
.tag.now{background:#ffd9d4;color:#8f1d13}.tag.after{background:#d6e4ff;color:#14428f}
.phone{width:393px;height:852px;background:#fff;overflow:hidden;position:relative;border-radius:44px;box-shadow:0 18px 44px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.08);color:var(--label)}
.status{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 44px;font-size:17px;font-weight:600}
.status .r{display:flex;gap:6px;align-items:center;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:11px}.bars i{width:3px;background:#000;border-radius:1px}
.batt{width:25px;height:12px;border:1.5px solid var(--l3);border-radius:4px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.nav{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative}
.circ{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.12),inset 0 0 0 .5px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center}
.nav .ttl{position:absolute;left:72px;right:72px;text-align:center;line-height:1.2}
.nav .ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ttl span{font-size:12px;color:var(--l2)}
.list{padding:0 16px}
.card{background:rgba(120,120,128,.1);border-radius:12px;margin:10px 0 4px;overflow:hidden}
.prog{display:flex;align-items:center;gap:10px;padding:12px}
.meter{width:66px;height:4px;border-radius:2px;background:rgba(120,120,128,.3);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meta{font-size:13px;color:var(--l2)}
.proj{margin-left:auto;color:var(--tint);font-size:13px;font-weight:600;display:flex;align-items:center;gap:3px}
.land{border-top:.5px solid var(--sep);padding:10px 12px 11px;display:block}
.land .l1,.land .l2{display:flex;align-items:center;gap:8px}
.land .l1 .w{font-size:14px;font-weight:600}
.land .l1 .s{margin-left:auto;font-size:13px;color:var(--l2)}
.land .what{font-size:14px;margin:4px 0 2px 21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.land .l2{font-size:13px;color:var(--l2);margin-top:3px;padding-left:21px}
.land .l2 .c{font-weight:600;font-variant-numeric:tabular-nums}
.land .l2 .u{margin-left:auto}
.land .chev{color:var(--l3);margin-left:6px}
.run .w,.run .c,.run svg{color:var(--tint)} .idle .w,.idle .c,.idle svg{color:rgba(60,60,67,.75)}
.sh{font-size:20px;font-weight:600;color:var(--l2);margin:22px 0 6px}
.r{padding:10px 0 11px;border-bottom:.5px solid var(--sep)}
.r .a{display:flex;align-items:center;gap:8px}
.r .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.r .tm{font-size:13px;color:var(--l2);flex:none}
.r .b{display:flex;gap:7px;align-items:center;margin-top:2px}
.r .sub{font-size:15px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;font-weight:600;background:rgba(120,120,128,.14);border-radius:5px;padding:1px 7px;flex:none}
.hl{outline:2.5px solid rgba(255,59,48,.85);outline-offset:3px;border-radius:12px}
.note{position:absolute;font-size:11.5px;font-weight:700;color:#fff;background:rgba(255,59,48,.9);border-radius:999px;padding:1px 8px}
</style>
<body>
<h1>Project sessions 页 · 显示合入状态</h1>
<p class="lede">项目页 Work overview 已经有一行合入状态（图 1：Merge to main · queued · Queued for 13m 27s）。项目的 sessions 页只有进度条，合入排队一个多小时也只写着“0 running”，看上去像停了。方案：在顶部摘要卡里加<b>同一行</b>合入状态，复用 <code>ProjectPage.landingLine</code> 和 <code>ProjectLandingRow</code> 的文案、颜色和转圈规则。没有合入时摘要卡和现在一样。</p>
<div class="row" id="phones"></div>
<script>
const ring=(c)=>`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg>`;
const chev=`<svg width="8" height="13" viewBox="0 0 8 13"><path d="M1.5 1.5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const head=`<div class="status"><span>11:24</span><span class="r"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>
<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.6a3.2 3.2 0 0 0-4.4 0zM3.4 6.4a6.8 6.8 0 0 1 9.2 0l1.5-1.7a9 9 0 0 0-12.2 0zM.4 3a11 11 0 0 1 15.2 0" fill="#000" stroke="#000" stroke-width=".4"/></svg><span class="batt">32</span></span></div>
<div class="nav"><div class="circ"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="ttl"><b>DeepSeek Harness 原生接入（P1–P5）</b><span>Project · 26 sessions</span></div>
<div class="circ"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="#000" stroke-width="2"/><circle cx="8" cy="13" r="1.6"/><circle cx="13" cy="13" r="1.6"/><circle cx="18" cy="13" r="1.6"/></svg></div></div>`;
const prog=(done,total,run)=>`<div class="prog"><span class="meter"><i style="width:${done/total*100}%;background:var(--green)"></i><i style="width:${run/total*100}%;background:var(--tint)"></i></span><span class="meta">${done}/${total} done · ${run} running</span><span class="proj">Project ${chev}</span></div>`;
const land=({run,word,state,what,label,clock,upd})=>`<div class="land ${run?'run':'idle'}"><div class="l1">${ring()}<span class="w">${word}</span><span class="s">${state}</span><span class="chev">${chev}</span></div>${what?`<div class="what">${what}</div>`:''}<div class="l2"><span>${label}</span><span class="c">${clock}</span><span class="u">${upd}</span></div></div>`;
const rows=(p5)=>`<div class="sh">Coordinator</div>
<div class="r"><div class="a"><span class="t">DeepSeek Harness 原生接入（P1–P5）</span><svg width="22" height="14" viewBox="0 0 22 14"><path d="M1 7s4-6 10-6 10 6 10 6-4 6-10 6S1 7 1 7z" fill="none" stroke="#666" stroke-width="1.6"/><circle cx="11" cy="7" r="2.6" fill="#666"/></svg><span class="tm">just now</span></div><div class="b"><span class="chip">Coordinator</span><span class="sub">Watching P5：接通 Web、macOS 和 iOS</span></div></div>
<div class="sh">Today</div>
<div class="r"><div class="a"><span class="t">执行任务：dsh：Orbit MCP 长等待超时</span><span class="tm">29m ago</span></div><div class="b"><span class="sub">The fix is done and the evidence is submitted. A re…</span></div></div>
<div class="r"><div class="a"><span class="t">执行任务：P5：接通 Web、macOS 和 iOS</span><span class="tm">55m ago</span></div><div class="b"><span class="sub">${p5}</span></div></div>
<div class="r"><div class="a"><span class="t">执行任务：P4：接入 Orbit MCP、工具调用</span><span class="tm">1h ago</span></div><div class="b"><span class="sub">P4 已完成并提交（30be99737），随后合入了最新 or…</span></div></div>
<div class="r"><div class="a"><span class="t">执行任务：P4：接入 Orbit MCP、工具调用</span><span class="tm">1h ago</span></div><div class="b"><span class="sub">Ended</span></div></div>
<div class="r"><div class="a"><span class="t">执行任务：P3b：完成 dsh 中断、消息排队</span><span class="tm">1h ago</span></div><div class="b"><span class="sub">P3b 已完成。我在合入最新 origin/main 之后的树上…</span></div></div>`;
const phone=(card,p5,extra='')=>`<div class="phone">${head}<div class="list"><div class="card ${extra}">${card}</div>${rows(p5)}</div></div>`;
const figs=[
 ['now','现在',phone(prog(12,15,0),'Queued','hl'),'<b>只有进度，看不到合入</b>合入在排队，卡片只写着“12/15 done · 0 running”，P5 那一行也只有一个 “Queued”。要知道在等什么，得进 Project 页往下翻。'],
 ['after','方案 · 排队中',phone(prog(12,15,0)+land({run:false,word:'Merge to main',state:'queued',label:'Queued for',clock:'13m 27s',upd:'Updated just now'}),'Queued'),'<b>排队：灰色，圈不转</b><ul><li>和项目页图 1 同一行：<b>Merge to main</b> · queued，时钟每秒走（<code>landingClock</code>，m+s）。</li><li>promotion / merge check 没有对应任务，所以只有两行。</li><li>点这一块 → 打开 Project 页，定位到 Work overview。</li></ul>'],
 ['after','方案 · 进行中',phone(prog(12,15,0)+land({run:true,word:'Landing',state:'checking',what:'P5：接通 Web、macOS 和 iOS 入口',label:'Elapsed',clock:'4m 12s',upd:'Updated just now'}),'Queued'),'<b>进行中：品牌蓝，圈在转</b><ul><li>LAND_TASK 时在中间加一行任务标题；同时有 2 个以上任务时写 “2 jobs”。</li><li>状态词取当前 phase：fetching / rebasing / checking / pushing…</li><li>开启“减少动态效果”时圈不转，状态靠文字表达。</li></ul>'],
 ['after','方案 · 读不到更新',phone(prog(12,15,0)+land({run:false,word:'Merge check',state:'Update unavailable',label:'Elapsed',clock:'6m 03s',upd:'Updated 3m ago'}),'Queued'),'<b>数据过期：变灰，时钟停住</b><ul><li>沿用 <code>landingLine</code> 现有规则：读取失败、超过 90s 没读到，或心跳超过 10 分钟，就显示 “Update unavailable”。</li><li>没有在途任务时（<code>inFlight == nil</code>）这一块直接去掉，卡片和现在一样。</li></ul>'],
];
document.getElementById('phones').innerHTML=figs.map(([k,t,p,c])=>`<figure><span class="tag ${k}">${t}</span>${p}<figcaption>${c}</figcaption></figure>`).join('');
</script>
