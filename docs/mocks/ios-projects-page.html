<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>iOS 项目页 — 列表 + 详情（效果图）</title>
<style>
  :root {
    --tint: #3E69F6;
    --tint-bg: rgba(62, 105, 246, .12);
    --amber: #FF9500;
    --amber-ink: #B35A00;
    --amber-bg: rgba(255, 149, 0, .14);
    --green: #34C759;
    --green-ink: #248A3D;
    --red: #FF3B30;
    --gray: #AEAEB2;
    --label: #000;
    --label-2: rgba(60, 60, 67, .6);
    --label-3: rgba(60, 60, 67, .3);
    --sep: rgba(60, 60, 67, .18);
    --surface: #fff;
    --grouped: #F2F2F7;
    --fill: rgba(0, 0, 0, .065);
    --glass: rgba(255, 255, 255, .62);
    --mark: rgba(255, 59, 48, .85);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 40px 56px; background: #e4e4e9; color: #16161a;
    font: 15px/1.55 "Nimbus Sans", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 8px; }
  .lede { color: #55555e; max-width: 1640px; margin: 0 0 28px; }
  .lede code, figcaption code { font: 12.5px "DejaVu Sans Mono", monospace; background: #d9d9e0; border-radius: 4px; padding: 1px 5px; }
  .row { display: flex; gap: 36px; align-items: flex-start; }
  figure { margin: 0; width: 393px; }
  figcaption { margin-top: 16px; font-size: 13.5px; line-height: 1.55; color: #4a4a52; }
  figcaption > b { color: #16161a; display: block; font-size: 14.5px; margin-bottom: 4px; }
  figcaption li b, figcaption br + b { color: #16161a; }
  figcaption ol { margin: 6px 0 0; padding-left: 18px; }
  figcaption li { margin: 3px 0; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; margin-bottom: 8px; }
  .tag.now { background: #ffd9d4; color: #8f1d13; }
  .tag.after { background: #d6e4ff; color: #14428f; }
  .num { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; background: var(--amber); color: #fff;
         font-size: 11px; font-weight: 700; align-items: center; justify-content: center; margin-right: 4px; vertical-align: 1px; }

  /* ── 手机外壳 ─────────────────────────────────────────── */
  .phone { width: 393px; height: 852px; background: var(--surface); overflow: hidden; position: relative;
           border-radius: 44px; box-shadow: 0 18px 44px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.08); color: var(--label); }
  .phone.grouped { background: var(--grouped); }
  .status { height: 59px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px 0 39px; font-size: 17px; font-weight: 600; }
  .status .r { display: flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 500; }
  .bars { display: flex; align-items: flex-end; gap: 1.5px; height: 11px; }
  .bars i { width: 3px; background: var(--label); border-radius: 1px; }
  .batt { display: flex; align-items: center; justify-content: center; width: 25px; height: 12px;
          border: 1.5px solid var(--label-3); border-radius: 4px; font-size: 9px; font-weight: 700; position: relative; }
  .batt::after { content: ""; position: absolute; right: -3.5px; width: 2px; height: 4px; background: var(--label-3); border-radius: 0 1px 1px 0; }
  .nav { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 8px; position: relative; }
  .nav .ttl { position: absolute; left: 70px; right: 70px; text-align: center; font-size: 17px; font-weight: 600;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .platter { display: flex; align-items: center; justify-content: center; height: 44px; background: var(--glass);
             border-radius: 999px; flex: none; box-shadow: 0 1px 4px rgba(0,0,0,.08), inset 0 0 0 .5px rgba(0,0,0,.05); }
  .platter.circle { width: 44px; }
  .ico { width: 20px; height: 20px; stroke: var(--label); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .searchWrap { height: 56px; padding-top: 6px; }
  .search { margin: 0 16px; height: 40px; border-radius: 20px; background: var(--fill); display: flex; align-items: center;
            gap: 7px; padding: 0 12px; font-size: 17px; color: var(--label-2); }
  .search .ico { width: 17px; height: 17px; stroke: var(--label-2); stroke-width: 2.2; }
  .mk { outline: 1.6px dashed var(--mark); outline-offset: 3px; border-radius: 6px; position: relative; }
  .mk > .badge { position: absolute; top: -12px; right: -12px; }
  .badge { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; background: var(--amber); color: #fff;
           font-size: 11.5px; font-weight: 700; align-items: center; justify-content: center; z-index: 3; }

  /* ── 列表 ─────────────────────────────────────────────── */
  .sec { display: flex; align-items: baseline; gap: 7px; padding: 14px 16px 6px; }
  .sec b { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .sec .n { font-size: 13px; color: var(--label-2); font-weight: 600; }
  .sec .fold { margin-left: auto; font-size: 15px; color: var(--tint); }
  .prow { padding: 9px 16px 10px; border-bottom: .5px solid var(--sep); margin-left: 0; }
  .prow .l1 { display: flex; align-items: baseline; gap: 10px; }
  .prow .t { flex: 1; min-width: 0; font-size: 16.5px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .when { flex: none; font-size: 13px; color: var(--label-2); }
  .chip { display: inline-block; font-size: 12.5px; font-weight: 600; border-radius: 7px; padding: 1.5px 7px; margin-top: 5px;
          max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.warn { background: var(--amber-bg); color: var(--amber-ink); }
  .chip.brand { background: var(--tint-bg); color: var(--tint); }
  .l3 { display: flex; align-items: center; gap: 10px; margin-top: 7px; }
  .meter { flex: 0 0 104px; display: flex; gap: 1.5px; height: 5px; border-radius: 3px; overflow: hidden; background: var(--fill); }
  .meter i { display: block; height: 100%; }
  .counts { display: flex; gap: 9px; font-size: 12.5px; color: var(--label-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .counts span { display: inline-flex; align-items: center; gap: 3px; }
  .g { display: inline-block; flex: none; }
  .g.disc { width: 7px; height: 7px; border-radius: 50%; background: var(--tint); }
  .g.tri { width: 0; height: 0; border-left: 4.5px solid transparent; border-right: 4.5px solid transparent; border-bottom: 8px solid var(--amber); }
  .g.sq { width: 7.5px; height: 7.5px; border: 1.5px solid #8e8e93; border-radius: 1.5px; }
  .g.chk { color: var(--green); font-weight: 700; font-size: 12px; line-height: 1; }
  .g.x { color: var(--red); font-weight: 700; font-size: 12px; line-height: 1; }
  .line { margin-left: auto; font-size: 12.5px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }

  /* ── 详情（inset grouped） ──────────────────────────────── */
  .scroll { position: absolute; top: 103px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .head { padding: 8px 20px 14px; }
  .head h2 { font-size: 24px; line-height: 1.25; letter-spacing: -.02em; margin: 0 0 9px; font-weight: 700; }
  .head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14px; color: var(--label-2); }
  .pill { font-size: 12.5px; font-weight: 600; border-radius: 7px; padding: 1.5px 8px; }
  .pill.open { background: var(--tint-bg); color: var(--tint); }
  .branch { display: inline-flex; align-items: center; gap: 4px; }
  .card { background: var(--surface); margin: 0 16px 14px; border-radius: 20px; overflow: hidden; position: relative; }
  .card.mk { overflow: visible; }
  .ch { display: flex; align-items: baseline; gap: 8px; padding: 13px 16px 4px; }
  .ch b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .ch .sub { font-size: 13px; color: var(--label-2); }
  .ch .right { margin-left: auto; font-size: 13px; color: var(--label-2); }
  .grp { padding: 10px 16px 2px; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--label-2); text-transform: uppercase; }
  .item { display: flex; gap: 10px; padding: 10px 16px 11px; border-top: .5px solid var(--sep); align-items: flex-start; }
  .item:first-of-type { border-top: none; }
  .item .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
  .item .body { flex: 1; min-width: 0; }
  .item .it { font-size: 15.5px; font-weight: 600; line-height: 1.35; }
  .item .id { font-size: 13px; color: var(--label-2); line-height: 1.4; margin-top: 2px; }
  .item .who { font-size: 12.5px; color: var(--label-2); margin-top: 4px; }
  .btn { flex: none; align-self: center; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 6px 13px; }
  .btn.primary { background: var(--tint); color: #fff; }
  .btn.plain { background: var(--fill); color: var(--tint); }
  .btn.wide { display: block; text-align: center; padding: 11px; font-size: 16px; border-radius: 14px; margin: 10px 16px 4px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 4px 8px 6px; }
  .cell { padding: 8px 8px 8px; }
  .cell .k { font-size: 12.5px; color: var(--label-2); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .cell .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .cell .f { font-size: 11.5px; color: var(--label-3); line-height: 1.3; }
  .bigmeter { display: flex; gap: 2px; height: 7px; border-radius: 4px; overflow: hidden; margin: 2px 16px 14px; background: var(--fill); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 16px; border-top: .5px solid var(--sep); font-size: 15px; }
  .kv span:first-child { color: var(--label-2); }
  .kv span:last-child { text-align: right; }
  .toggle { width: 51px; height: 31px; border-radius: 16px; background: var(--green); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .toggle.off { background: #e9e9eb; }
  .toggle.off::after { right: auto; left: 2px; }
  .auto { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 2px; border-top: .5px solid var(--sep); font-size: 16px; }
  .note { font-size: 13px; color: var(--label-2); padding: 2px 16px 13px; line-height: 1.45; }
  .goal { font-size: 15px; line-height: 1.5; padding: 4px 16px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .more { font-size: 15px; color: var(--tint); padding: 4px 16px 13px; }
  .crit { display: flex; gap: 11px; padding: 10px 16px 11px; border-top: .5px solid var(--sep); }
  .crit .o { flex: none; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .crit .o.met { background: var(--green); color: #fff; }
  .crit .o.not { background: var(--fill); color: var(--label-2); }
  .crit .tx { font-size: 15px; line-height: 1.42; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .crit .st { font-size: 13px; margin-top: 3px; }
  .crit .st .ok { color: var(--green-ink); font-weight: 600; }
  .crit .st .wait { color: var(--amber-ink); font-weight: 600; }
  .trow { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: .5px solid var(--sep); }
  .trow .tt { flex: 1; min-width: 0; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .ts { flex: none; font-size: 12.5px; font-weight: 600; border-radius: 7px; padding: 1.5px 7px; }
  .ts.run { background: var(--tint-bg); color: var(--tint); }
  .ts.ready { background: var(--amber-bg); color: var(--amber-ink); }
  .ts.wait { background: var(--fill); color: var(--label-2); }
  .ts.main { background: rgba(52,199,89,.16); color: var(--green-ink); }
  .ts.fail { background: rgba(255,59,48,.12); color: #C9261B; }
  .chev { width: 13px; height: 13px; stroke: var(--label-3); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .tg { padding: 10px 16px 0; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--label-2); text-transform: uppercase; }
  .tg + .trow { border-top: none; }

  /* ── 抽屉 ─────────────────────────────────────────────── */
  .drawer { position: absolute; top: 0; bottom: 0; left: 0; width: 299px; background: var(--grouped); }
  .peek { position: absolute; top: 0; bottom: 0; left: 299px; width: 393px; background: #fff; border-radius: 40px 0 0 40px;
          box-shadow: -10px 0 30px rgba(0,0,0,.13); z-index: 2; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.22); }
  .dh { padding: 70px 20px 10px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .drow { display: flex; align-items: center; gap: 14px; padding: 11px 20px; font-size: 17px; }
  .drow .ico { width: 22px; height: 22px; stroke: var(--tint); }
  .drow .cnt { margin-left: auto; font-size: 15px; color: var(--label-2); }
  .drow.sel { background: var(--fill); border-radius: 12px; margin: 0 10px; padding: 11px 10px; }
</style>

<h1>iOS 项目页 — 效果图</h1>
<p class="lede">
  抽屉里加一项 <b>Projects</b>。列表的分区、排序、标签文案与 web <code>projectAttention.ts</code> 同一套规则（搬进 OrbitKit，两端文案做 parity 测试）；
  详情页按手机阅读顺序排：先「要你做的」，再进度、协调会话、判据、任务。数据全部来自已有接口（<code>GET /projects</code>、<code>/projects/:id</code>、<code>/panorama</code>、<code>/open-items</code>、<code>/tasks/page</code>、<code>/coordinator/status</code>），服务端不用改。
  图中项目标题取自线上真实项目，状态为示意。
</p>
