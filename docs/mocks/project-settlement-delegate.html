<h1>未结算卡：已结算那一半在问一个它自己已经回答的问题，以及「交给 coordinator」这个按钮</h1>
<p class="lede">
  左边是今天线上跑的样子（照 <code>ProjectSettlementCard.tsx</code> + <code>index.css</code> 逐字重画，判据文字用了真实的项目数据形状）；右边是改后。
  虚线框 = 改动处。第三块是「不用按钮」的那条备选路，画出来是为了让你比。
</p>

  <figure>
    <span class="tag now">今天 · 已结算</span>
    <div class="panel">
      <div class="approval-card project-settlement">
        <div class="approval-head project-settlement-head">
          <span class="project-settlement-heading mark">Why is this project not done?</span>
          <span class="criteria-provenance">FROM ORBIT</span>
        </div>
        <div class="approval-body is-questions project-settlement-body">
          <div class="project-settlement-meta">Claude 账号池：按订阅配额均衡派发 · every stated criterion is met by work that has landed, under the set you confirmed</div>
          <p class="project-settlement-settled"><b>Orbit recorded this project done.</b> Every stated criterion is met by work that has landed and counts, under a criteria set you have confirmed — so nothing here was left to ask.</p>
          <p class="project-settlement-settled-provenance">Recorded by the derivation, not by a press. Nothing on this card was pressed, and there is nothing here to press.</p>
        </div>
      </div>
    </div>
    <figcaption>
      <b>问题就是这个标题。</b>它是卡的固定抬头（<code>SETTLEMENT_HEADING</code>），结算之后不换，于是标题问「为什么没做完」，正文回答「已经记成做完了」。
      你在这张卡上停住，是因为它自相矛盾 —— 不是因为没有按钮。
      <br>另外：<code>settled</code> 只在被投放过的那次挂载里成立（<code>delivered</code> 是 <code>useState</code>），离开会话再回来这张卡就没了。所以它既不是稳定的回执，也不是一个在等你的东西。
    </figcaption>
  </figure>

        <div class="approval-body is-questions project-settlement-body">
          <div class="project-settlement-meta">Claude 账号池：按订阅配额均衡派发 · every stated criterion is met by work that has landed, under the set you confirmed</div>
          <p class="project-settlement-settled mark">Every stated criterion is met by work that has landed and counts, under a criteria set you have confirmed — so nothing here was left to ask.</p>
          <p class="project-settlement-settled-provenance">Recorded by the derivation, not by a press. Nothing on this card was pressed, and there is nothing here to press.</p>

      <b>换掉抬头，不新增元素。</b>用的就是卡里现成的那句 <code>SETTLEMENT_SETTLED_TITLE</code>（<code>Orbit recorded this project done.</code>），从正文搬上标题位，正文里那句加粗重复随之去掉 —— 一句话只说一次。

    </figcaption>

      <b>换掉原位那个词，不并列第三个。</b><code>Chat about this</code> 和它做的是同一件事 —— 都把卡面事实交给协调会话，区别只是要不要先打字。两个标签说同一件事，就要教一条「什么时候用哪个」；所以这个词直接从原位置换掉：<b>按钮数不变（还是两个）、位置不变、⌘+Enter 跟着这个按钮走</b>。
      <ul>
        <li><b>能力没丢：</b>想自己补两句，输入框一直在下面；卡片只是不再提供「先放进输入框、等你打字」那半步。事实件也不再改口径 —— 用的就是现成的 <code>projectSettlementContext()</code>。</li>
        <li><b>行为：</b>把那段当一条消息发进这个会话（走现成的 <code>send.mutate</code>，<code>WorkspaceView.tsx:4047</code>）。这张卡只画在项目的协调会话里（会话的 <code>projectId</code> 只对 <code>Project.coordinatorSessionId</code> 那一条非空），所以发进这个会话就是发给 coordinator。<b>纯前端改动，不动服务端。</b></li>
        <li><b>权重：</b>先按它替换掉的那格（<code>secondary</code>），不新增规则。若你想让它在「纯活字句」（没有 <code>STANDARD_SET_UNCONFIRMED</code>）时升为 <code>primary</code>，那是异常项卡上现成的惯例（「a card leads with the next step for its kind」），不是我新定的。</li>
        <li><b>顺带修一处布局（可以不要）：</b>这一行今天只挂了 <code>approval-actions</code>（没有 <code>display:flex</code>），hint 那句说明是跟按钮<b>挤在同一行</b>往后流的 —— 而它自己写着 <code>flex-basis:100%</code>，作者本意就是要它独占一行。左边「今天」那栏画的正是现在这个挤法；要修就加 <code>display:flex; flex-wrap:wrap; gap:10px</code>（<code>.card-actions</code> 上本来就有这三条）。</li>
        <li><b>新造的词（要你拍板）：</b><code>Ask the coordinator to handle it</code>。备选：<code>Ask the coordinator</code>（最短，和升级卡上的 <code>Ask the coordinator again</code> 同族）、<code>Hand this to the coordinator</code>。</li>
        <li><b>协调性：</b>项目页那边已经有「谁在做」这套词 —— <code>With the coordinator</code>、<code>Coordinator · waiting 12m · goes to you in 48m</code>。这个按钮是同一套话在会话里的入口。</li>
      </ul>
    </figcaption>
