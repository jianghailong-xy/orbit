<h1>③ Web：项目会话页顶上那张结束卡</h1>
<p class="lede" style="width:760px">这是 <b>Web 现成的收尾卡</b>（<code>ProjectWhyNotDoneCard</code> 的 <code>is-settled</code> 分支）真实渲染出来的样子——Web 页面上画的就是它，一字不差；两枚徽标各对应「平台记的」和「你记的」。<br>
和 iOS / Android 的绿卡<b>不是一套皮肤</b>：Web 这边是蓝底 + 琥珀色徽标（它今天在 Web 的协调会话里也长这样）。要不要把 Web 也统一成绿的，等你定。</p>
<img src="03-web-card.png" alt="Web 收尾卡的两种徽标" style="display:block;width:361px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12)">
<p class="lede" style="width:760px;margin-top:14px">（同一张卡的 iOS 样子见前两张图：绿底、绿对勾方块、等宽字徽标——那是它本来的画法。）</p>
