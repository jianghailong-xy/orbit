<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Exception card on iPhone — the row that says “Waiting for approval” with nothing to press</title>
<style>
  :root {
    --orange: #FF9500;
    --blue: #007AFF;
    --red: #FF3B30;
    --label: #000;
    --label-2: rgba(60, 60, 67, .6);
    --label-3: rgba(60, 60, 67, .3);
    --sep: rgba(60, 60, 67, .16);
    --surface: #fff;
    --fill: rgba(120, 120, 128, .12);
    --fill-2: rgba(120, 120, 128, .08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 28px 64px; background: #ececef; color: #16161a;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 24px; letter-spacing: -.02em; margin: 0 0 6px; }
  .lede { color: #55555e; max-width: 1180px; margin: 0 0 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start; }
  figure { margin: 0; width: 393px; }
  figcaption { margin-top: 14px; font-size: 13.5px; line-height: 1.5; color: #55555e; }
  figcaption > b:first-child { display: block; font-size: 14.5px; color: #16161a; margin-bottom: 3px; }
  code { font: 12.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(0,0,0,.05);
         padding: 1px 4px; border-radius: 4px; }

  /* ── phone ─────────────────────────────────────────────────── */
  .phone {
    width: 393px; height: 852px; border-radius: 48px; overflow: hidden; background: var(--surface);
    color: var(--label); display: flex; flex-direction: column; position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,.18); border: 1px solid rgba(0,0,0,.08);
  }
  .status { height: 54px; display: flex; align-items: flex-end; justify-content: space-between;
            padding: 0 26px 6px; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .status .right { display: flex; gap: 5px; align-items: center; color: #000; }
  .nav { padding: 2px 16px 10px; display: flex; align-items: center; gap: 10px;
         border-bottom: 1px solid var(--sep); }
  .nav .back { width: 30px; height: 30px; border-radius: 50%; background: var(--fill);
               display: grid; place-items: center; font-size: 15px; color: #000; }
  .nav .titles { flex: 1; text-align: center; line-height: 1.15; }
  .nav .t { font-size: 15px; font-weight: 600; }
  .nav .s { font-size: 11.5px; color: var(--label-2); }
  .nav .badge { background: var(--fill); border-radius: 6px; padding: 2px 6px; font-size: 11px;
                color: var(--label-2); margin-left: 4px; vertical-align: 1px; }
  .nav .share { width: 30px; height: 30px; border-radius: 50%; background: var(--fill);
                display: grid; place-items: center; font-size: 14px; }

  /* The transcript is scrolled to its tail, so the newest row — the card — sits at the bottom. */
  .thread { flex: 1; padding: 12px 14px 0; overflow: hidden; display: flex; flex-direction: column; }
  .thread .spacer { flex: 1 1 auto; }
  .ask { font-size: 13px; color: var(--label-2); padding-bottom: 10px; margin-bottom: 10px;
         border-bottom: 1px solid var(--sep); }
  .ask b { color: var(--label); font-weight: 600; }
  .prose { font-size: 13.5px; line-height: 1.5; margin-bottom: 10px; }
  .tool { display: flex; align-items: center; gap: 7px; margin: 0 0 12px; font-size: 13px; }
  .tool .chip { width: 22px; height: 22px; border-radius: 6px; background: var(--fill-2);
                display: grid; place-items: center; font-size: 11px; color: var(--label-2); }
  .tool .ok { margin-left: 2px; color: #34C759; font-size: 12px; }

  /* ── the card (native language: toned wash + hairline) ────── */
  .card { padding: 14px; border-radius: 14px; background: rgba(255, 149, 0, .07);
          border: 1px solid rgba(255, 149, 0, .28); }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .head .icon { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
                font-size: 12px; background: rgba(255,149,0,.16); color: #b26a00; flex: none; }
  .head .title { font-size: 15px; font-weight: 700; flex: 1; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
  .prov { font-size: 12px; color: var(--label-2); margin-bottom: 10px; }
  .why { font-size: 13.5px; font-weight: 600; line-height: 1.45; }
  .subject { font-size: 13.5px; line-height: 1.45; color: var(--label-2); margin-top: 3px; }
  .detail { font-size: 12px; line-height: 1.45; color: var(--label-2); margin-top: 6px; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .btn { min-height: 44px; border-radius: 24px; display: flex; align-items: center;
         justify-content: center; padding: 10px 12px; text-align: center; font-size: 16.5px; }
  .btn.primary { background: var(--blue); color: #fff; font-weight: 440; }
  .btn.tinted { background: var(--fill); color: var(--blue); }
  .btn.danger { background: var(--fill); color: var(--red); }
  .foot { font-size: 12px; color: var(--label-2); margin-top: 10px; }

  /* what each panel is comparing */
  .ghost { border: 1.5px dashed #b3261e; border-radius: 14px; min-height: 104px; display: grid;
           place-items: center; font-size: 12.5px; line-height: 1.4; color: #b3261e; text-align: center;
           background: rgba(255,59,48,.05); padding: 12px; }
  .cut { outline: 1.5px dashed #0b57d0; outline-offset: 4px; }

  .tail { padding: 10px 14px 0; }
  .composer { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
              border: 1px solid var(--sep); border-radius: 22px; color: var(--label-3); font-size: 15px; }
  .composer .send { margin-left: auto; width: 30px; height: 30px; border-radius: 50%;
                    background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 13px; }
  /* The reply bar the composer grows when a card hands it a sentence (ComposerView): the card's
     own words on the left, the ✕ to let go on the right. */
  .replybar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              font-size: 12.5px; color: var(--blue); }
  .replybar .x { margin-left: auto; width: 18px; height: 18px; border-radius: 50%;
                 background: var(--fill); color: var(--label-2); display: grid; place-items: center;
                 font-size: 11px; }
  .composer.focused { border-color: rgba(0,122,255,.55); }
  .caret { color: var(--label-2); }
  .footbar { display: flex; align-items: center; gap: 14px; padding: 10px 18px 26px;
             font-size: 13px; color: var(--label-2); }
  .footbar .on { color: var(--label); font-weight: 600; }
  .footbar .ctx { margin-left: auto; }
</style>

<h1>异常卡：说“Waiting for approval”却点不进任何东西的那一格</h1>
<p class="lede">Wikids 狼人杀项目的协调会话：一个任务连挂三次后被升级成 owner 的（服务器把这条 open item 记在协调会话上，
会话列表、标题栏、“Escalated to you”横幅因此都亮）。web 在同一处画出了这张卡（<code>ProjectExceptionCards</code>），
原生两端一直没画 —— 所以点进会话是空的。②③是这次要做的样子：一颗主写 + <code>Chat about this</code> 接进输入框；④是同一族的 fuse 暂停。</p>

<div class="row">

  <!-- ── 1. today ────────────────────────────────────────────── -->
  <figure>
    <div class="phone">
      <div class="status"><span>10:26</span><span class="right">▮▮▮ 5G ▰</span></div>
      <div class="nav">
        <div class="back">‹</div>
        <div class="titles"><div class="t">Wikids AI 游戏模…<span class="badge">Coordinator</span></div>
          <div class="s">Waiting for approval · Open · 15h ago</div></div>
        <div class="share">⇧</div>
      </div>
      <div class="thread">
        <div class="ask"><b>↑ Your question</b>　check status</div>
        <div class="prose">我先读取最新任务图，按 Orbit 的 dependencyState 和运行状态筛选真正可启动的任务，不凭阶段顺序猜测。</div>
        <div class="tool"><span class="chip">◫</span><code>orbit · project_get</code><span class="ok">✓</span></div>
        <div class="tool"><span class="chip">◫</span><code>orbit · task_list</code><span class="ok">✓</span></div>
        <div class="prose">目前没有现有任务处于 OPEN + READY，所以没有可直接启动的任务。阻塞链是：P5.1 失败 → P5.2 BLOCKED_FAILED → P6 → P7。</div>
        <div class="prose">可选动作：推荐：批准创建 P5.1R 替代任务……</div>
        <div class="spacer"></div>
        <div class="ghost">这里本来应该有一张卡<br>（今天：什么都没有，按不下去）</div>
      </div>
      <div class="tail"><div class="composer">＋ Message…<span class="send">↥</span></div></div>
      <div class="footbar"><span class="on">Auto</span><span>GPT-5.6-Sol</span><span>Ultra</span>
        <span class="ctx">0%　71%</span></div>
    </div>
    <figcaption><b>① 现状（你截图那张）</b>
      行与标题栏说“Waiting for approval”，横幅说“Escalated to you · Wikids AI 游戏模…”，三处都在指同一个事实：
      项目里有一条 open item 是你的（<code>project_open_item</code>：<code>TASK_FAILED</code>，
      <code>assignee=OWNER</code>，<code>assignee_reason=ESCALATED</code>，09-19 21:02 升级）。会话里却没有任何可答的东西 ——
      原生端只画了四种 owner 卡里的两种（协调者的问题、合并确认），升级给你的异常与 fuse 暂停这两类一张都没画。</figcaption>
  </figure>

  <!-- ── 2. the card, in the house's action style ────────────── -->
  <figure>
    <div class="phone">
      <div class="status"><span>10:26</span><span class="right">▮▮▮ 5G ▰</span></div>
      <div class="nav">
        <div class="back">‹</div>
        <div class="titles"><div class="t">Wikids AI 游戏模…<span class="badge">Coordinator</span></div>
          <div class="s">Waiting for approval · Open · 15h ago</div></div>
        <div class="share">⇧</div>
      </div>
      <div class="thread">
        <div class="spacer"></div>
        <div class="card cut">
          <div class="head">
            <div class="icon">⚠</div>
            <div class="title">Escalated to you</div>
          </div>
          <div class="prov">FROM ORBIT</div>
          <div class="why">Now yours — no one acted on this for 2h</div>
          <div class="subject">Task failed: P5.1 实现游戏 Route Handlers、鉴权与玩家视图协议</div>
          <div class="detail">The acceptance command disagreed with what the task declared · exit 1,
            expected 0 · attempt 3 of 3 in this chain</div>
          <div class="actions">
            <div class="btn primary">Ask the coordinator again</div>
            <div class="btn tinted">Chat about this</div>
          </div>
          <div class="foot">Owner: you · waiting 1d 7h</div>
        </div>
      </div>
      <div class="tail"><div class="composer">＋ Message…<span class="send">↥</span></div></div>
      <div class="footbar"><span class="on">Auto</span><span>GPT-5.6-Sol</span><span>Ultra</span>
        <span class="ctx">0%　71%</span></div>
    </div>
    <figcaption><b>② 这张卡（和 web 同一份文案，按钮按原生那套）</b>
      标题 <code>Escalated to you</code> 就是横幅上那三个词；正文第一行是 web 的升级句（<code>escalationHeading</code>，
      五种来路各一句），第二行是出事的任务，第三行是服务器原句；底部 <code>Owner: you · waiting …</code> 与 web 的 <code>ownerLine</code> 逐字相同。
      <b>按钮只有两颗</b>，跟确认卡/问题卡/创建卡同一个规矩（composer-handoff 那张图里的原话是「不加第三颗按钮」）：
      <code>Ask the coordinator again</code> 是唯一的写操作（<code>POST …/return-to-coordinator</code>：条目交回协调会话、重新计时，不重跑任务），
      <code>Chat about this</code> 把主语交给输入框（下一格）。服务器没列出那个门时（项目没有活着的协调会话）主键不画，而不是画一个按下去必被拒的键。</figcaption>
  </figure>

  <!-- ── 3. Chat about this, as the composer receives it ─────── -->
  <figure>
    <div class="phone">
      <div class="status"><span>10:26</span><span class="right">▮▮▮ 5G ▰</span></div>
      <div class="nav">
        <div class="back">‹</div>
        <div class="titles"><div class="t">Wikids AI 游戏模…<span class="badge">Coordinator</span></div>
          <div class="s">Waiting for approval · Open · 15h ago</div></div>
        <div class="share">⇧</div>
      </div>
      <div class="thread">
        <div class="spacer"></div>
        <div class="card">
          <div class="head"><div class="icon">⚠</div><div class="title">Escalated to you</div></div>
          <div class="prov">FROM ORBIT</div>
          <div class="why">Now yours — no one acted on this for 2h</div>
          <div class="subject">Task failed: P5.1 实现游戏 Route Handlers、鉴权与玩家视图协议</div>
          <div class="actions">
            <div class="btn primary">Ask the coordinator again</div>
            <div class="btn tinted">Chat about this</div>
          </div>
        </div>
      </div>
      <div class="tail">
        <div class="replybar">💬 <span>About this exception: Task failed: P5.1 实现游戏 Route Handlers、鉴权与玩家视图协议</span><span class="x">✕</span></div>
        <div class="composer focused">＋ <span class="caret">Say what the coordinator should do…</span><span class="send">↥</span></div>
      </div>
      <div class="footbar"><span class="on">Auto</span><span>GPT-5.6-Sol</span><span>Ultra</span>
        <span class="ctx">0%　71%</span></div>
    </div>
    <figcaption><b>③ 按下 <code>Chat about this</code> 之后</b>
      和另外四张卡同一条路：输入框上方出现 <b>About this exception: &lt;条目标题&gt;</b>，
      占位符变成 <b>Say what the coordinator should do…</b>，光标自动落进去，卡片留在原地、主键仍然可按。
      这一发送是<b>普通一轮</b>（和“plan change”那条一样，不答任何门）—— 协调者收到的是「这个卡住的东西，你要怎么处理」，
      它自己有能力去文件替代任务或停掉它，这正是你在这条会话里真正想说的话。按 <b>✕</b> 退出。
      <b>这一格是这次新加的唯一文案</b>（前缀 + 占位符），别的一字未改。</figcaption>
  </figure>

  <!-- ── 4. the other half of the family ─────────────────────── -->
  <figure>
    <div class="phone">
      <div class="status"><span>10:26</span><span class="right">▮▮▮ 5G ▰</span></div>
      <div class="nav">
        <div class="back">‹</div>
        <div class="titles"><div class="t">Wikids AI 游戏模…<span class="badge">Coordinator</span></div>
          <div class="s">Waiting for approval · Open · 3m ago</div></div>
        <div class="share">⇧</div>
      </div>
      <div class="thread">
        <div class="spacer"></div>
        <div class="card">
          <div class="head"><div class="icon">❙❙</div><div class="title">Paused</div></div>
          <div class="prov">FROM ORBIT</div>
          <div class="why">The coordinator paused itself</div>
          <div class="detail">It spent 6 self-started turns today, past the 5 the project set.
            Spent today: 6 self-started turns · 2 sessions opened · 1 retry on one chain. Tasks keep
            running and landing; task results, merges and your answers still reach it. 3 actions are
            held. What it starts inside its own engine cannot be held: those turns are counted, not held.</div>
          <div class="actions">
            <div class="btn primary">Resume</div>
            <div class="btn tinted">Chat about this</div>
          </div>
          <div class="foot">Owner: you · waiting 3m</div>
        </div>
      </div>
      <div class="tail"><div class="composer">＋ Message…<span class="send">↥</span></div></div>
      <div class="footbar"><span class="on">Auto</span><span>GPT-5.6-Sol</span><span>Ultra</span>
        <span class="ctx">0%　71%</span></div>
    </div>
    <figcaption><b>④ 同一族的另一半：fuse 暂停</b>
      和升级卡同一个组件、同一套琥珀色（“你欠一个动作”），标题 <code>Paused</code> 同样是横幅上那个词；
      正文第一行是条目的 title（服务器写的 <code>The coordinator paused itself</code>），第二行是暂停自己的长句。
      主键 <code>Resume</code> 走 <code>POST /projects/:id/fuse/:episodeId/resume</code>，第二颗同样是 <code>Chat about this</code>
      （前缀换成 <code>About this pause: </code>）。不画这张的话，同一个坑会在协调者被暂停时再出现一次：列表亮着、会话里没得按。</figcaption>
  </figure>

</div>
</html>
