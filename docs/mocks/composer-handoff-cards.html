<!doctype html>
<html lang="zh">

<title>Composer handoff — mockup</title>
<style>
  :root { --blue:#0A84FF; --orange:#FF9F0A; --label:#fff; --label-2:rgba(235,235,245,.6);
          --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55); --surface:#000; --bar:#1c1c1e;
          --chip:#2c2c2e; --nav:#3a3128; }
  * { box-sizing: border-box; }
  body { margin:0; padding:44px 34px 70px; background:#ececef; color:#16161a;
         font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC",
         "Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  h1 { font-size:27px; letter-spacing:-.02em; margin:0 0 8px; }
  .lede { color:#55555e; max-width:1620px; margin:0 0 4px; } .lede b { color:#16161a; }
  .row { display:flex; gap:34px; align-items:flex-start; margin-top:34px; }
  figure { margin:0; width:393px; }
  figcaption { margin-top:15px; font-size:13.5px; line-height:1.55; color:#55555e; }
  figcaption b:first-child { display:block; font-size:14.5px; color:#16161a; margin-bottom:3px; }
  figcaption b { color:#16161a; }
  .tag { display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.04em;
         padding:2px 8px; border-radius:6px; margin-bottom:9px; }
  .tag.now { background:#e3e3e8; color:#55555e; }
  .tag.new { background:#d8ecff; color:#0a5ca8; }
  .phone { width:393px; height:852px; border-radius:44px; overflow:hidden; background:var(--surface);
           color:var(--label); display:flex; flex-direction:column; position:relative; font-size:15px;
           box-shadow:0 2px 4px rgba(0,0,0,.18), 0 16px 40px rgba(0,0,0,.22); }
  .status { height:54px; display:flex; align-items:flex-end; justify-content:space-between;
            padding:0 26px 6px; font-size:15.5px; font-weight:600; background:var(--nav); }
  .status .right { display:flex; gap:6px; align-items:center; font-size:13px; }
  .navbar { background:var(--nav); padding:6px 16px 12px; display:flex; align-items:center; gap:12px; }
  .navbtn { width:44px; height:44px; border-radius:22px; background:rgba(255,255,255,.14);
            display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .navtitle { flex:1; min-width:0; text-align:center; }
  .navtitle .t { font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .navtitle .s { font-size:12.5px; color:rgba(255,255,255,.62); white-space:nowrap; overflow:hidden;
                 text-overflow:ellipsis; margin-top:1px; }
  .openq { background:var(--nav); padding:10px 18px 14px; display:flex; align-items:center; gap:10px;
           font-size:16px; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:5px; background:var(--orange); flex:0 0 auto; }
  .scroll { flex:1; overflow:hidden; padding:12px 14px 0; display:flex; flex-direction:column;
            justify-content:flex-end; gap:10px; }
  .card { background:rgba(10,132,255,.12); border:1px solid rgba(10,132,255,.32); border-radius:14px;
          padding:14px; display:flex; flex-direction:column; gap:12px; }
  .card.orange { background:rgba(255,159,10,.11); border-color:rgba(255,159,10,.34); }
  .cardhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chip { width:26px; height:26px; border-radius:8px; background:rgba(255,159,10,.22);
          display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
  .ch-t { font-size:16px; font-weight:600; flex:1; min-width:0; }
  .badge { font-size:11px; color:var(--label-2); border:1px solid var(--sep); border-radius:6px;
           padding:1px 6px; }
  .prose { font-size:14.5px; line-height:1.5; }
  .detail { font-size:13px; color:var(--label-2); }
  .rows { font-size:13.5px; color:var(--label-2); line-height:1.6; }
  .box { background:rgba(255,255,255,.055); border-radius:10px; padding:10px 11px; }
  .box .h { font-size:11px; font-weight:700; letter-spacing:.07em; color:var(--label-2); margin-bottom:5px; }
  .box .b { font-size:14.5px; line-height:1.5; }
  .fade { position:relative; max-height:132px; overflow:hidden; }
  .fade:after { content:''; position:absolute; left:0; right:0; bottom:0; height:34px;
                background:linear-gradient(to bottom, rgba(14,14,16,0), rgba(19,25,33,.92)); }
  .showall { font-size:15px; margin-top:9px; display:flex; align-items:center; gap:5px; }
  .btn { min-height:50px; border-radius:12px; display:flex; align-items:center; justify-content:center;
         gap:8px; font-size:17px; font-weight:500; }
  .btn.primary { background:var(--blue); color:#fff; font-weight:600; }
  .card.orange .btn.primary { background:var(--orange); color:#3a2a00; }
  .btn.bordered { background:rgba(120,140,170,.16); color:var(--blue); }
  .card.orange .btn.bordered { color:#FFB340; }
  .btn.dead { background:rgba(120,140,170,.10); color:rgba(235,235,245,.28); }
  .actions { display:flex; flex-direction:column; gap:10px; }
  .reason { display:flex; flex-direction:column; gap:7px; }
  .reason .lbl { font-size:14px; color:var(--label-2); }
  .reason .field { height:104px; background:#000; border:1px solid var(--sep); border-radius:8px; }
  .reason .hint { font-size:13.5px; color:var(--label-2); line-height:1.45; }
  .composer { border-top:1px solid var(--sep); padding:10px 14px 0; display:flex; flex-direction:column;
              gap:7px; background:var(--surface); }
  .replybar { display:flex; align-items:center; gap:7px; background:rgba(10,132,255,.16);
              border-radius:999px; padding:7px 10px; }
  .replybar .t { font-size:13.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden;
                 text-overflow:ellipsis; }
  .cbox { display:flex; align-items:center; gap:10px; background:var(--bar); border-radius:26px;
          padding:10px 12px; min-height:52px; }
  .cbox.focused { border:1.5px solid var(--blue); box-shadow:0 0 0 3px rgba(10,132,255,.18);
                  padding:8.5px 10.5px; }
  .cbox .ph { flex:1; color:var(--label-3); font-size:17px; }
  .cbox .ph.caret:after { content:''; display:inline-block; width:2px; height:19px; background:var(--blue);
                          vertical-align:-3px; margin-left:1px; }
  .send { width:34px; height:34px; border-radius:17px; background:var(--chip); display:flex;
          align-items:center; justify-content:center; flex:0 0 auto; }
  .modelbar { display:flex; align-items:center; gap:16px; font-size:14px; color:var(--label-2);
              padding:2px 4px 0; }
  .modelbar .sp { flex:1; }
  .home { height:26px; display:flex; align-items:center; justify-content:center; }
  .home:after { content:''; width:140px; height:5px; border-radius:3px; background:rgba(255,255,255,.35); }
  svg { display:block; }
  .ic { width:18px; height:18px; flex:0 0 auto; }
  .mark { position:relative; }
  .mark:before { content:''; position:absolute; inset:-7px -6px; border:2px dashed var(--orange);
                 border-radius:14px; pointer-events:none; }
</style>
