# launchd on a real Mac answers for the time a runner's stop is held to: what it gives the plist `orbit register`
# writes, and whether it lets a job that takes as long as a Mac's stop can take leave by itself. macOS 26 changed
# this without a word (src/runner-go/service.go, launchdExitTimeOutSeconds), and only a Mac can say so. macOS
# runners bill at 10×, so this runs when the plist or the budgets change, or by hand.
name: Runner launchd window

on:
  push:
    branches: [main]
    paths:
      - "src/runner-go/service.go"
      - "src/runner-go/service_test.go"
      - "src/runner-go/service_launchd_darwin_test.go"
      - "src/runner-go/shutdown_drain.go"
      - "src/runner-go/shutdown_drain_test.go"
      - "src/runner-go/link_mode.go"
      - ".github/workflows/runner-launchd.yml"
  pull_request:
    paths:
      - "src/runner-go/service.go"
      - "src/runner-go/service_test.go"
      - "src/runner-go/service_launchd_darwin_test.go"
      - "src/runner-go/shutdown_drain.go"
      - "src/runner-go/shutdown_drain_test.go"
      - "src/runner-go/link_mode.go"
      - ".github/workflows/runner-launchd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launchd:
    name: launchd on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: src/runner-go/go.sum
      - name: Test the stop against launchd
        working-directory: src/runner-go
        run: go test -v -count=1 -timeout 10m -run '^(TestLaunchdGivesTheRunnerItsWholeStop|TestLaunchdPlistAllowsCompleteGracefulShutdown|TestTheStopFitsWhatEachServiceManagerAllows|TestTheStopRunsOnThisOperatingSystemsBudget)$' .
