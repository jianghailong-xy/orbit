# TEMPORARY probe wiring (scratch branch, never merged). This Mac has no GitHub token and no
# `gh`, so a push is the one trigger available: the runner's own GITHUB_TOKEN is allowed to
# dispatch client.yml (GitHub excepts workflow_dispatch from the no-recursion rule for that
# token). The target ref and inputs are read from .probe-dispatch-request.json so the same
# workflow can drive the gate against main and against a control branch.
name: Probe dispatch (client.yml macOS runtime gate)

on:
  push:
    branches: ["probe/runtime-gate-*"]
    paths:
      - ".github/workflows/probe-runtime-dispatch.yml"
      - ".probe-dispatch-request.json"

permissions:
  actions: write

jobs:
  dispatch:
    name: Dispatch client.yml with the runtime gate on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POST the dispatch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "request: $(cat .probe-dispatch-request.json)"
          curl -sS -o /tmp/answer -w 'HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/client.yml/dispatches" \
            -d @.probe-dispatch-request.json
          echo "answer: $(cat /tmp/answer)"
