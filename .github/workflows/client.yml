# PROBE BRANCH ONLY — not for main. The usual compile gates are replaced by one evidence job, and the
# push/pull_request triggers are gone so pushing probe iterations starts nothing (a push run on the
# same ref would cancel the dispatch through the concurrency group). Dispatch with:
#   gh workflow run client.yml --ref orbit/debug-it-pls-c3f959-probe [-f probe_runs="…"]
name: Client CI (macOS + iOS)

on:
  workflow_dispatch:
    inputs:
      probe_runs:
        description: "Space-separated scenario:mode:fix:seed entries; empty = run.sh's default set"
        type: string
        default: ""
      probe_runner:
        description: "Runner image (macos-26 = iOS 26 simulators)"
        type: string
        default: "macos-26"

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crash-probe:
    name: iOS crash probe (transcript List scrollTo, evidence only)
    runs-on: ${{ github.event.inputs.probe_runner || 'macos-26' }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Probe
        env:
          RUNS: ${{ github.event.inputs.probe_runs }}
        run: bash .crash-probe/run.sh
      - name: Upload traces, console logs and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-probe
          path: .crash-probe/out
