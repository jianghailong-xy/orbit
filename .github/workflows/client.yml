# TEMPORARY (probe branch, never merged). Task A1 (34bAKshYuCWyoAqoDR9m9): client.yml's own jobs on the
# commit under test — unchanged but for `on:` and the two `if:` gates, opened for this push, since this host
# can neither dispatch a workflow nor open a pull request (no gh, no token) — plus three probe-only jobs:
# OrbitApp's macOS build on its own (client.yml's macos job builds it only after OrbitKit's tests pass),
# the login-page shots (.a1-probe/run.sh), and a report that pushes every job's log and the shots to
# probe/a1-google-results, where a clone can read them.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/a1-google"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type-ramp guard: views must use the semantic tokens in Views/Typography.swift (the one file
  # allowed to hold fixed sizes) so iOS/macOS sizing stays platform-appropriate and Dynamic Type
  # keeps working. Hard fail — the sweep landed; add a token instead of a bare size.
  font-tokens:
    name: Font tokens (bare system(size:) audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit bare system(size:) outside Typography.swift
        run: |
          hits=$(grep -rn "system(size" src/macos/OrbitApp/Sources src/ios/Sources --include='*.swift' \
                 | grep -v "Views/Typography.swift" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            count=$(echo "$hits" | wc -l)
            echo "::error::$count bare system(size:) call site(s) outside Views/Typography.swift — use the Font.orbit* tokens (see the Typography.swift header)"
            exit 1
          else
            echo "No bare system(size:) call sites outside Typography.swift."
          fi

  # Navigation guard: pushes go onto the section's navigation stack (NavState/NavNode in OrbitKit)
  # and nowhere else — no boolean push beside it, no stored selection that can disagree with what
  # the stack shows, no flag telling the model which shell it is drawn in. Text scan only, so it
  # runs here rather than on the 10× Mac runners; the same rules are pinned in OrbitKitTests, which
  # a PR that cannot run `swift test` still gets held to by this job (see scripts/ci/nav-push-gate.sh
  # for why each rule exists and what to write instead).
  nav-push:
    name: Navigation (one push mechanism per stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate a second push mechanism
        run: bash scripts/ci/nav-push-gate.sh

  macos:
    name: macOS (build + test)
    # macOS runners bill at 10× — only on PRs or an explicit dispatch, not every branch push.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The SwiftUI app relies on newer-Swift MainActor-isolation inference; pin latest stable
      # Xcode so the runner's Swift compiles it (the default image's Swift rejects it).
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      # Compiles the macOS-only code in OrbitKit (Keychain token store, URLSession SSE transport)
      # that the Linux job's `#if` guards skip.
      - name: Test OrbitKit (macOS)
        working-directory: src/macos/OrbitKit
        run: swift test
      # First real compile of the SwiftUI layer (views, @Observable models, MenuBarExtra,
      # UNUserNotificationCenter, launchctl glue). If this surfaces SDK nits, that's its job.
      - name: Build OrbitApp
        working-directory: src/macos/OrbitApp
        run: swift build

  ios:
    name: iOS (generate + build)
    # macOS runners bill at 10× — only on PRs or an explicit dispatch, not every branch push.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version
      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate
      # First real compile of the iOS app: shared SwiftUI views + @Observable models + OrbitKit,
      # built for the simulator so no signing is needed. Surfaces any iOS-availability nits.
      - name: Build for iOS Simulator
        working-directory: src/ios
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

  macos-app-build:
    name: macOS OrbitApp build (probe-only)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build OrbitApp
        working-directory: src/macos/OrbitApp
        run: swift build

  shots:
    name: Login page probe (iPhone + Mac)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash .a1-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .a1-probe/shots
          cp run-output.log .a1-probe/shots/run-output.log 2>/dev/null || true
          for log in .a1-probe/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|warning: .*(GoogleSignIn|LoginView|AppModel)|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 > ".a1-probe/shots/summary-$base.txt" || true
            tail -300 "$log" > ".a1-probe/shots/tail-$base.txt" || true
          done
          find .a1-probe/shots -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          echo "capture=${{ steps.capture.outcome }}" > .a1-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-shots
          path: .a1-probe/shots
      - name: Fail as the capture did
        if: steps.capture.outcome != 'success'
        run: exit 1

  report:
    name: Push the results where a clone can read them
    needs: [font-tokens, nav-push, macos, ios, macos-app-build, shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Every job's steps and log
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/jobs
          curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=50" > out/jobs/jobs.json
          python3 - <<'PY'
          import json, os, re, subprocess
          jobs = json.load(open("out/jobs/jobs.json"))["jobs"]
          with open("out/jobs/summary.txt", "w") as f:
              for j in jobs:
                  f.write("%s: %s / %s (job %s, %s)\n" % (j["name"], j["status"], j["conclusion"], j["id"], j.get("runner_name")))
                  for s in j.get("steps") or []:
                      f.write("   %2d %s: %s\n" % (s["number"], s["name"], s["conclusion"]))
                  if j["status"] == "completed":
                      name = re.sub(r"[^A-Za-z0-9]+", "-", j["name"]).strip("-")
                      subprocess.run(["curl", "-fsSL", "-H", "Authorization: Bearer " + os.environ["TOKEN"],
                                      "-o", "out/jobs/%s.log" % name,
                                      "https://api.github.com/repos/${{ github.repository }}/actions/jobs/%s/logs" % j["id"]])
          PY
          cat out/jobs/summary.txt
      - name: Push to probe/a1-google-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "font-tokens: ${{ needs.font-tokens.result }}"
            echo "nav-push: ${{ needs.nav-push.result }}"
            echo "macos: ${{ needs.macos.result }}"
            echo "ios: ${{ needs.ios.result }}"
            echo "macos-app-build: ${{ needs.macos-app-build.result }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/a1-google-results
