# TEMPORARY (probe branch probe/translation-x3, never merged). Task 34vcF5ruSIhVT0TeMblMY (Translation X3). The commit under
# test is the project branch project/34vcDOhN0OCStfnVuTyPq at f55897697 plus .x3-probe/ and this file, which replaces
# .github/workflows/client.yml on this branch only. Adapted from task M's probe (probe/translation-m).
#   • shots — .x3-probe/run.sh on macos-26: the iPhone and Mac probe apps built from the commit's own shell and shared
#     sources, driven by XCUITest against .x3-probe/stub.py, which replays answers recorded from the real apiserver.
name: Translation X3 probe (iPhone + Mac)

on:
  push:
    branches: ["probe/translation-x3"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Translation X3 probe (iPhone + Mac)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash .x3-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .x3-probe/shots
          cp run-output.log .x3-probe/shots/run-output.log 2>/dev/null || true
          { swift --version 2>&1 | head -2; xcodebuild -version; xcodegen --version; sw_vers; } > .x3-probe/shots/toolchain.txt
          for log in .x3-probe/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 > ".x3-probe/shots/summary-$base.txt" || true
            tail -300 "$log" > ".x3-probe/shots/tail-$base.txt" || true
          done
          find .x3-probe/shots -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          # XCTest names its own failure attachments with quotes ("Debug description for "…" Button"), and
          # upload-artifact refuses such a path.
          python3 - .x3-probe/shots <<'PY'
          import os, re, sys
          for root, dirs, files in os.walk(sys.argv[1], topdown=False):
              for name in files + dirs:
                  safe = re.sub(r'[\"\\:<>|*?\r\n]', '_', name)
                  if safe != name:
                      os.rename(os.path.join(root, name), os.path.join(root, safe))
                      print("renamed", name, "->", safe)
          PY
          echo "capture=${{ steps.capture.outcome }}" > .x3-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x3-shots
          path: .x3-probe/shots
      - name: Fail as the capture did
        if: steps.capture.outcome != 'success'
        run: exit 1

