# TEMPORARY (probe branch, never merged). Photographs the engine page's account rows on the iPhone client
# against .acct-probe/stub.py, and builds OrbitApp for macOS, from a host that can neither dispatch a
# workflow nor read a run's logs (no gh, no token). A push runs .acct-probe/run.sh on macOS 26 and
# `swift build` of OrbitApp on macOS; the report job pushes the pictures, notes, request logs and build
# log tails to probe/account-swipe-shots-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/account-swipe-shots"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Account rows probe (iPhone)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash .acct-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .acct-probe/shots
          cp run-output.log .acct-probe/shots/run-output.log 2>/dev/null || true
          for log in .acct-probe/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 > ".acct-probe/shots/summary-$base.txt" || true
            tail -300 "$log" > ".acct-probe/shots/tail-$base.txt" || true
          done
          find .acct-probe/shots -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          echo "capture=${{ steps.capture.outcome }}" > .acct-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acct-shots
          path: .acct-probe/shots

  macos:
    name: macOS (build OrbitApp)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build OrbitApp
        id: build
        continue-on-error: true
        working-directory: src/macos/OrbitApp
        run: |
          swift build 2>&1 | tee "$GITHUB_WORKSPACE/orbitapp-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/macos
          grep -E "error:" orbitapp-build.log | head -300 > out/macos/orbitapp-build-errors.txt || true
          tail -80 orbitapp-build.log > out/macos/orbitapp-build-tail.txt || true
          echo "build=${{ steps.build.outcome }}" > out/macos/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-out
          path: out
      - name: Fail as the gate would
        if: steps.build.outcome != 'success'
        run: exit 1

  report:
    name: Push the results where a clone can read them
    needs: [shots, macos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/account-swipe-shots-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
            echo "macos: ${{ needs.macos.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/account-swipe-shots-results
