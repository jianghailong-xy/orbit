# TEMPORARY (probe branch, never merged). This branch photographs smart model selection on an iPhone
# simulator (docs/model-routing-design.md §9 — the task detail's Suggested row and Runs, the Why
# sheet, the Agent's Task runs switch, and a task run's composer chip) for commit 7e35c466d, from a
# host that can neither dispatch a workflow nor read a run's logs (no gh, no token). So a PUSH to it
# runs the probe app in .route-probe/ against its fixture API, and a last job pushes what came back
# (the shots, the notes, run.sh's output, the xcodebuild log's tail, requests.log) to
# `probe/p4-model-routing-shots-results`, which a clone reads without a token. The client compile
# gates are not run here: another probe (probe/p4-model-routing-clients) runs them.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/p4-model-routing-shots"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Smart model selection probe (iPhone)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, test and capture
        id: capture
        continue-on-error: true
        run: |
          bash .route-probe/ios/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .route-probe/ios/shots
          cp run-output.log .route-probe/ios/shots/run-output.log 2>/dev/null || true
          for log in .route-probe/ios/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 \
              > ".route-probe/ios/shots/summary-$base.txt" || true
            tail -300 "$log" > ".route-probe/ios/shots/tail-$base.txt" || true
          done
          # run.sh copies the whole xcodebuild log in; the tail above is what to read, so a large
          # one is compressed rather than pushed as is.
          for log in .route-probe/ios/shots/xcodebuild-*.log; do
            [ -f "$log" ] || continue
            if [ "$(wc -c < "$log")" -gt 20000000 ]; then gzip -9 "$log"; fi
          done
          echo "capture=${{ steps.capture.outcome }}" > .route-probe/ios/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-shots
          path: .route-probe/ios/shots

  report:
    name: Push the results where a clone can read them
    needs: [shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/p4-model-routing-shots-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/p4-model-routing-shots-results
