# TEMPORARY (probe branch, never merged). Photographs the iPhone composer band folded while reading
# back, on main before the Safari-style pill (base) and with it (fix), against .cfade-probe/stub.py.
# The report job pushes the pictures and notes to probe/composer-pill-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/composer-pill"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 80a24b3e5d87fc107ab5d5eeb06f05acd626d875

jobs:
  shots:
    name: Folded composer (iPhone, ${{ matrix.tree }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tree: [base, fix]
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      # The fix is this commit's tree (the probe's files change no app source); the base is main, the
      # commit the fix was made on, with the same probe copied in; diag is the fix with diag.py's logging.
      - name: The tree under test
        run: |
          if [ "${{ matrix.tree }}" = base ]; then
            git fetch --depth=1 origin "$BASE_SHA"
            git worktree add "$RUNNER_TEMP/tree" FETCH_HEAD
            cp -R .cfade-probe "$RUNNER_TEMP/tree/"
            echo "TREE=$RUNNER_TEMP/tree" >> "$GITHUB_ENV"
          else
            echo "TREE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Which fold is under test
        run: |
          git -C "$TREE" log --oneline -1
          grep -n "foldedBandPill\|foldedBandBar" "$TREE/src/macos/OrbitApp/Sources/OrbitApp/Views/Console/FoldedBandBar.swift" | head -3
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash "$TREE/.cfade-probe/run.sh" 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          P="$TREE/.cfade-probe"
          mkdir -p "$P/shots"
          cp run-output.log "$P/shots/run-output.log" 2>/dev/null || true
          for log in "$P"/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD|XCTAssert|failed" "$log" | head -400 > "$P/shots/summary-$base.txt" || true
            tail -300 "$log" > "$P/shots/tail-$base.txt" || true
          done
          find "$P/shots" -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          rm -rf "$P/shots/ios/attachments" "$P/shots/mac/attachments"
          echo "tree=${{ matrix.tree }} capture=${{ steps.capture.outcome }}" > "$P/shots/outcomes.txt"
          mkdir -p "out/${{ matrix.tree }}"
          cp -R "$P/shots/." "out/${{ matrix.tree }}/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.tree }}
          path: out

  report:
    name: Push the results where a clone can read them
    needs: [shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/composer-pill-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/composer-pill-results
