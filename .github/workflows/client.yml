# CI for both native client shells (src/macos + src/ios). They share OrbitKit and the OrbitApp
# SwiftUI sources (the iOS app reuses them in place — Structure B), so changes to either shell
# compile both platforms here:
#
#   • macos — macOS compile gate: `swift test`s OrbitKit on macOS (builds the `#if os(macOS)`
#     Keychain + URLSession-SSE paths) and `swift build`s OrbitApp (SwiftUI; can't build on Linux).
#   • ios — iOS compile gate: XcodeGen + `xcodebuild` for the Simulator (no signing). Surfaces
#     iOS-only SDK nits in the shared SwiftUI surface.
#
# OrbitKit's platform-agnostic Linux tests run for every pull request in ci.yml, where they can be
# a required check without path-filter deadlocks.
#
# Signed/distributable builds live in release.yml (tag-triggered). macOS runners bill at 10×, so the
# two Xcode jobs run only on pull_request or an explicit workflow_dispatch — never plain pushes. A
# PR touching the shared OrbitKit/OrbitApp exercises both compile gates (correct — the code is
# shared); a PR touching only one client's own dir still runs both, which is a small, safe overpay.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["**"]        # branches only — tags are handled by release.yml
    paths:
      - "src/macos/**"
      - "src/ios/**"
      - ".github/workflows/client.yml"
      # The nav guard's rules live outside this file, so it is listed on its own — otherwise a
      # broken edit to it would only be discovered by the next navigation change.
      - "scripts/ci/nav-push-gate.sh"
  pull_request:
    paths:
      - "src/macos/**"
      - "src/ios/**"
      - ".github/workflows/client.yml"
      - "scripts/ci/nav-push-gate.sh"
  # Manual trigger to compile a branch on the Mac runners without opening a throwaway PR, e.g.
  # `gh workflow run client.yml --ref <branch>`.
  #
  # `source_refused_probe` is the evidence probe's own switch (see the job below): off by default,
  # so an ordinary dispatch compiles a branch and takes no pictures.
  workflow_dispatch:
    inputs:
      source_refused_probe:
        description: "Also run the source-refused evidence probe (Mac window + iPhone shots)"
        type: boolean
        default: false
      ios_http_ip_probe:
        description: "Also run the iOS http://ip ATS probe (simulator, A/B against no ATS keys)"
        type: boolean
        default: false

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type-ramp guard: views must use the semantic tokens in Views/Typography.swift (the one file
  # allowed to hold fixed sizes) so iOS/macOS sizing stays platform-appropriate and Dynamic Type
  # keeps working. Hard fail — the sweep landed; add a token instead of a bare size.
  font-tokens:
    name: Font tokens (bare system(size:) audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit bare system(size:) outside Typography.swift
        run: |
          hits=$(grep -rn "system(size" src/macos/OrbitApp/Sources src/ios/Sources --include='*.swift' \
                 | grep -v "Views/Typography.swift" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            count=$(echo "$hits" | wc -l)
            echo "::error::$count bare system(size:) call site(s) outside Views/Typography.swift — use the Font.orbit* tokens (see the Typography.swift header)"
            exit 1
          else
            echo "No bare system(size:) call sites outside Typography.swift."
          fi

  # Navigation guard: pushes go onto the section's navigation stack (NavState/NavNode in OrbitKit)
  # and nowhere else — no boolean push beside it, no stored selection that can disagree with what
  # the stack shows, no flag telling the model which shell it is drawn in. Text scan only, so it
  # runs here rather than on the 10× Mac runners; the same rules are pinned in OrbitKitTests, which
  # a PR that cannot run `swift test` still gets held to by this job (see scripts/ci/nav-push-gate.sh
  # for why each rule exists and what to write instead).
  nav-push:
    name: Navigation (one push mechanism per stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate a second push mechanism
        run: bash scripts/ci/nav-push-gate.sh

  macos:
    name: macOS (build + test)
    # macOS runners bill at 10× — only on PRs or an explicit dispatch, not every branch push.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The SwiftUI app relies on newer-Swift MainActor-isolation inference; pin latest stable
      # Xcode so the runner's Swift compiles it (the default image's Swift rejects it).
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      # Compiles the macOS-only code in OrbitKit (Keychain token store, URLSession SSE transport)
      # that the Linux job's `#if` guards skip.
      - name: Test OrbitKit (macOS)
        working-directory: src/macos/OrbitKit
        run: swift test
      # First real compile of the SwiftUI layer (views, @Observable models, MenuBarExtra,
      # UNUserNotificationCenter, launchctl glue). If this surfaces SDK nits, that's its job.
      - name: Build OrbitApp
        working-directory: src/macos/OrbitApp
        run: swift build

  ios:
    name: iOS (generate + build)
    # macOS runners bill at 10× — only on PRs or an explicit dispatch, not every branch push.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version
      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate
      # First real compile of the iOS app: shared SwiftUI views + @Observable models + OrbitKit,
      # built for the simulator so no signing is needed. Surfaces any iOS-availability nits.
      - name: Build for iOS Simulator
        working-directory: src/ios
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

  # Whether the iPhone app can sign in to a self-hosted server at an address the operator types in
  # (http://<ip>) is not a question a compile can answer: the exceptions that decide it live in
  # src/ios/Support/Info.plist. This probe builds a one-request app carrying that very file and
  # reads URLSession's answer back from a simulator for six URLs — the same app with no ATS keys
  # and a named http host among them, and that named host must be refused with -1022, which is what
  # shows the run exercised ATS at all. Dispatch-only and off by default: it costs a Mac runner,
  # and only an edit to the ATS block can change its answer. Method and readings:
  # docs/evidence/ios-http-ip/README.md.
  ios-http-ip-probe:
    name: iOS http://ip ATS probe (simulator)
    if: github.event_name == 'workflow_dispatch' && inputs.ios_http_ip_probe
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Run the A/B probe
        id: probe
        continue-on-error: true
        run: |
          bash docs/evidence/ios-http-ip/probe-harness/run.sh 2>&1 | tee probe-output.log
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-http-ip-probe
          path: docs/evidence/ios-http-ip/probe-harness/results
      - name: Fail as the probe did
        if: steps.probe.outcome != 'success'
        run: exit 1

  # TEMPORARY (task 34bkMbJBijj8rD2HwWXqJ, the "this run never started" card's Mac pictures). The
  # branch's own Mac mini has no display and no automation grant, so the Mac window's pixels can
  # only be taken on a runner: this job builds the probe app from the real shared sources and lets
  # `RunStartShotTests` drive and photograph it, as the crossings probe did
  # (docs/evidence/project-crossings-native/README.md). Dispatch-only, and only when the dispatch
  # asks for it: it costs a 90-minute Mac runner and an ordinary dispatch should not.
  #
  # The pictures land in `source-refused-shots` (artifact) and, because artifacts cannot be
  # downloaded without a token, in `probe/source-refused-mac-shots-results` — the branch a clone
  # can read, which is what `docs/evidence/source-refused-native/README.md` names.
  source-refused-shots:
    name: Source-refused probe (Mac window + iPhone)
    if: github.event_name == 'workflow_dispatch' && inputs.source_refused_probe
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      # project.yml's `../src` paths are relative to the repository root, so the harness runs from
      # a copy of itself placed there (the crossings probe's `.xcross-probe/`).
      - name: Stage the harness at the repository root
        run: |
          mkdir -p .sr-probe
          cp -R docs/evidence/source-refused-native/probe-harness/. .sr-probe/
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash .sr-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .sr-probe/shots
          cp run-output.log .sr-probe/shots/run-output.log 2>/dev/null || true
          for log in .sr-probe/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 > ".sr-probe/shots/summary-$base.txt" || true
            tail -300 "$log" > ".sr-probe/shots/tail-$base.txt" || true
          done
          find .sr-probe/shots -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          echo "capture=${{ steps.capture.outcome }}" > .sr-probe/shots/outcomes.txt
          echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> .sr-probe/shots/outcomes.txt
          echo "sha=${{ github.sha }}" >> .sr-probe/shots/outcomes.txt
          # The screen the Mac window had to fit in: the window is sized against it, and the
          # console page lays itself out taller than it (see WindowFit in the probe app).
          { echo "== displays =="; system_profiler SPDisplaysDataType 2>/dev/null | head -40
            osascript -e 'tell application "Finder" to get bounds of window of desktop' 2>&1
          } >> .sr-probe/shots/outcomes.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-refused-shots
          path: .sr-probe/shots
          # `.done-probe` is the marker the probe's own evidence convention reads: hidden files are
          # excluded by default, and that one is the "it ran to the end" record.
          include-hidden-files: true
      - name: Fail as the capture did
        if: steps.capture.outcome != 'success'
        run: exit 1

  # Artifacts need a token to download and this repository's readers do not have one: the same job
  # the crossings probe used puts the pictures on a branch a plain `git clone` can read.
  source-refused-publish:
    name: Push the shots where a clone can read them
    needs: [source-refused-shots]
    # Guarded like the job it publishes: an ordinary dispatch must not rewrite the results branch.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.source_refused_probe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/source-refused-mac-shots-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.source-refused-shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "source-refused probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/source-refused-mac-shots-results
