# TEMPORARY (probe branch, never merged). Task 34al3VeHBWVR5DuIDNN4Y (macOS App: no runner in the DMG;
# enrollment downloads it from /dl and checks its sha256), from a host with no gh and no token. A PUSH
# to this branch runs what `gh workflow run client.yml` would — the two Linux audits, the macOS gate
# (OrbitKit `swift test`, then `swift build` of OrbitApp), the iOS compile gate — plus one more job:
# build-dmg.sh run as a local build runs it (ad-hoc signed, arm64, no notarization), then the built
# Orbit.app and the mounted DMG are listed to show no Contents/Resources/orbit is produced. A last job
# pushes every job's result and logs to probe/macos-app-dmg-runner-dl-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/macos-app-dmg-runner-dl"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  font-tokens:
    name: Font tokens (bare system(size:) audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit bare system(size:) outside Typography.swift
        run: |
          hits=$(grep -rn "system(size" src/macos/OrbitApp/Sources src/ios/Sources --include='*.swift' \
                 | grep -v "Views/Typography.swift" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

  nav-push:
    name: Navigation (one push mechanism per stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate a second push mechanism
        run: bash scripts/ci/nav-push-gate.sh

  macos:
    name: macOS (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test OrbitKit (macOS)
        id: test
        continue-on-error: true
        working-directory: src/macos/OrbitKit
        run: |
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/swift-test.log"
          exit "${PIPESTATUS[0]}"
      - name: Build OrbitApp
        id: build
        continue-on-error: true
        working-directory: src/macos/OrbitApp
        run: |
          swift build 2>&1 | tee "$GITHUB_WORKSPACE/orbitapp-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/macos
          { swift --version; xcodebuild -version; } > out/macos/toolchain.txt 2>&1 || true
          grep -E "error:|Executed [0-9]+ tests|Test Suite 'All tests'" swift-test.log > out/macos/swift-test-summary.txt || true
          grep -E "RunnerDownloadTests|Phase4LogicTests|FailureReasonTests" swift-test.log > out/macos/swift-test-runner-suites.txt || true
          grep -E "error:" orbitapp-build.log | head -300 > out/macos/orbitapp-build-errors.txt || true
          tail -80 orbitapp-build.log > out/macos/orbitapp-build-tail.txt || true
          echo "test=${{ steps.test.outcome }} build=${{ steps.build.outcome }}" > out/macos/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-out
          path: out
      - name: Fail as the gate would
        if: steps.test.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1

  ios:
    name: iOS (generate + build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version
      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        id: build
        continue-on-error: true
        working-directory: src/ios
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/ios
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" ios-build.log | head -300 > out/ios/ios-build-summary.txt || true
          echo "build=${{ steps.build.outcome }}" > out/ios/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-out
          path: out
      - name: Fail as the gate would
        if: steps.build.outcome != 'success'
        run: exit 1

  dmg:
    name: build-dmg.sh (ad-hoc) produces no Contents/Resources/orbit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install create-dmg
        run: brew install create-dmg
      - name: build-dmg.sh (ARCHS=arm64, SIGN_ID=-, no notarization)
        id: dmg
        continue-on-error: true
        run: |
          ARCHS=arm64 ./src/macos/scripts/build-dmg.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-dmg.log"
          exit "${PIPESTATUS[0]}"
      - name: Inspect the built app and the DMG
        id: inspect
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p out/dmg
          app=src/macos/build/Orbit.app
          dmg=$(ls src/macos/build/Orbit-v*-arm64.dmg 2>/dev/null | head -1)
          {
            echo "## build-dmg.sh: lines mentioning a runner build"
            grep -nE 'runner|go build|GOARCH|lipo|SKIP_RUNNER_BUNDLE|Resources/orbit' src/macos/scripts/build-dmg.sh || echo "(none)"
            echo "## build-dmg.sh steps that ran"
            grep -E '^(▶|✓)' build-dmg.log
            echo "## $app/Contents/Resources"
            ls -la "$app/Contents/Resources"
            echo "## files named orbit anywhere in the app"
            find "$app" -name orbit -print | sed 's/^/  /'; echo "  (end)"
            echo "## Mach-O files in the app"
            find "$app" -type f -exec file {} \; | grep -i 'mach-o'
            echo "## DMG $dmg"
            hdiutil attach -nobrowse -readonly -mountpoint /tmp/orbit-dmg "$dmg" > /dev/null
            ls -la /tmp/orbit-dmg /tmp/orbit-dmg/Orbit.app/Contents/Resources
            echo "## files named orbit anywhere in the DMG's app"
            find /tmp/orbit-dmg/Orbit.app -name orbit -print | sed 's/^/  /'; echo "  (end)"
            hdiutil detach /tmp/orbit-dmg > /dev/null
          } > out/dmg/inspect.txt 2>&1
          cat out/dmg/inspect.txt
          tail -60 build-dmg.log > out/dmg/build-dmg-tail.txt
          [ -d "$app" ] && [ -n "$dmg" ] && [ ! -e "$app/Contents/Resources/orbit" ] \
            && ! grep -q 'Orbit.app/Contents/Resources/orbit' out/dmg/inspect.txt
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/dmg
          echo "dmg=${{ steps.dmg.outcome }} inspect=${{ steps.inspect.outcome }}" > out/dmg/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-out
          path: out
      - name: Fail as a gate would
        if: steps.dmg.outcome != 'success' || steps.inspect.outcome != 'success'
        run: exit 1

  report:
    name: Push the results where a clone can read them
    needs: [font-tokens, nav-push, macos, ios, dmg]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/macos-app-dmg-runner-dl-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "font-tokens: ${{ needs.font-tokens.result }}"
            echo "nav-push: ${{ needs.nav-push.result }}"
            echo "macos: ${{ needs.macos.result }}"
            echo "ios: ${{ needs.ios.result }}"
            echo "dmg: ${{ needs.dmg.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/macos-app-dmg-runner-dl-results
