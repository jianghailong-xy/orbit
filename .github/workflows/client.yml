# TEMPORARY (probe branch, never merged). Times the iOS project sessions page's first second on an
# iPhone simulator for task 34bA3EICEFqVWZCMLV57z, before (b41c36fef, origin/main) and after
# (0ca92c610) the change that opens it on the sessions the app already holds — from a host that can
# neither dispatch a workflow nor read a run's logs (no gh, no token). Each job builds the probe app
# (`.open-probe/`, the iPhone CompactShell against stub.py, whose `?projectId=` reads take 8 s) from
# one tree's shared sources and runs ProjectPageOpenTimingTests; a last job pushes the shots, the
# test's timeline, the stub's request log and each job's result to
# `probe/project-page-open-timing-results`, which a clone reads without a token.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/project-page-open-timing"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timing:
    name: Project page first second (iPhone, ${{ matrix.variant }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: before
            tree: b41c36feff33eae0c7ca6c07142ac03df56cd13c
          - variant: after
            tree: 0ca92c610930cc07b369f8809637596ba90f6d44
    env:
      PROBE_DELAY: "8"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: The tree under test, with the probe beside its sources
        run: |
          git fetch --no-tags --depth=1 origin ${{ matrix.tree }}
          git worktree add --detach "$RUNNER_TEMP/tree" ${{ matrix.tree }}
          cp -R .open-probe "$RUNNER_TEMP/tree/.open-probe"
          git -C "$RUNNER_TEMP/tree" log --oneline -1
      - name: Build, open the project page and time it
        id: capture
        continue-on-error: true
        run: |
          bash "$RUNNER_TEMP/tree/.open-probe/run.sh" 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          S="$RUNNER_TEMP/tree/.open-probe/shots"
          mkdir -p "$S"
          cp run-output.log "$S/run-output.log" 2>/dev/null || true
          B="$RUNNER_TEMP/tree/.open-probe/build-ios.log"
          if [ -f "$B" ]; then
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD|XCTAssert|failed" "$B" | head -400 > "$S/summary-build-ios.txt" || true
            tail -300 "$B" > "$S/tail-build-ios.txt" || true
          fi
          echo "capture=${{ steps.capture.outcome }}" > "$S/outcomes.txt"
          mkdir -p shots-out
          cp -R "$S" "shots-out/${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-${{ matrix.variant }}
          path: shots-out

  report:
    name: Push the results where a clone can read them
    needs: [timing]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/project-page-open-timing-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "timing: ${{ needs.timing.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/project-page-open-timing-results
