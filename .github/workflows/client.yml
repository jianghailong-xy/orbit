# CI for both native client shells (src/macos + src/ios). They share OrbitKit and the OrbitApp
# SwiftUI sources (the iOS app reuses them in place — Structure B), so changes to either shell
# compile both platforms here:
#
#   • macos — macOS compile gate: `swift test`s OrbitKit on macOS (builds the `#if os(macOS)`
#     Keychain + URLSession-SSE paths) and `swift build`s OrbitApp (SwiftUI; can't build on Linux).
#   • ios — iOS compile gate: XcodeGen + `xcodebuild` for the Simulator (no signing). Surfaces
#     iOS-only SDK nits in the shared SwiftUI surface.
#
# OrbitKit's platform-agnostic Linux tests run for every pull request in ci.yml, where they can be
# a required check without path-filter deadlocks.
#
# Signed/distributable builds live in release.yml (tag-triggered). macOS runners bill at 10×, so the
# two Xcode jobs run only on pull_request or an explicit workflow_dispatch — never plain pushes. A
# PR touching the shared OrbitKit/OrbitApp exercises both compile gates (correct — the code is
# shared); a PR touching only one client's own dir still runs both, which is a small, safe overpay.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["**"]        # branches only — tags are handled by release.yml
    paths:
      - "src/macos/**"
      - "src/ios/**"
      - ".github/workflows/client.yml"
      # The nav guard's rules live outside this file, so it is listed on its own — otherwise a
      # broken edit to it would only be discovered by the next navigation change.
      - "scripts/ci/nav-push-gate.sh"
  pull_request:
    paths:
      - "src/macos/**"
      - "src/ios/**"
      - ".github/workflows/client.yml"
      - "scripts/ci/nav-push-gate.sh"
  # Manual trigger to compile a branch on the Mac runners without opening a throwaway PR, e.g.
  # `gh workflow run client.yml --ref <branch>`.
  workflow_dispatch:
    inputs:
      # Evidence only: runs the tail-pinning × reasoning-fold probe in the iOS simulator and uploads
      # the trace it writes. Not a gate — `continue-on-error` on the job — and off unless asked for,
      # so a plain dispatch still means "compile both clients".
      probe:
        description: "Run the iOS tail-pinning / reasoning-fold probe (trace, evidence only)"
        type: boolean
        default: false
      # Which Mac image the probe runs on. The owner's phone is on iOS 27, and the simulator
      # runtime is what the List's scroll behaviour belongs to, so the probe has to be able to run
      # there — `xcode-27` is the only image carrying an iOS 27 simulator.
      probe_runner:
        description: "Runner image for the probe (xcode-27 = iOS 27 simulators, macos-26 = iOS 26)"
        type: string
        default: "xcode-27"

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type-ramp guard: views must use the semantic tokens in Views/Typography.swift (the one file
  # allowed to hold fixed sizes) so iOS/macOS sizing stays platform-appropriate and Dynamic Type
  # keeps working. Hard fail — the sweep landed; add a token instead of a bare size.
  font-tokens:
    name: Font tokens (bare system(size:) audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit bare system(size:) outside Typography.swift
        run: |
          hits=$(grep -rn "system(size" src/macos/OrbitApp/Sources src/ios/Sources --include='*.swift' \
                 | grep -v "Views/Typography.swift" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            count=$(echo "$hits" | wc -l)
            echo "::error::$count bare system(size:) call site(s) outside Views/Typography.swift — use the Font.orbit* tokens (see the Typography.swift header)"
            exit 1
          else
            echo "No bare system(size:) call sites outside Typography.swift."
          fi

  # Navigation guard: pushes go onto the section's navigation stack (NavState/NavNode in OrbitKit)
  # and nowhere else — no boolean push beside it, no stored selection that can disagree with what
  # the stack shows, no flag telling the model which shell it is drawn in. Text scan only, so it
  # runs here rather than on the 10× Mac runners; the same rules are pinned in OrbitKitTests, which
  # a PR that cannot run `swift test` still gets held to by this job (see scripts/ci/nav-push-gate.sh
  # for why each rule exists and what to write instead).
  nav-push:
    name: Navigation (one push mechanism per stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate a second push mechanism
        run: bash scripts/ci/nav-push-gate.sh

  macos:
    name: macOS (build + test)
    # macOS runners bill at 10× — only on PRs or an explicit dispatch, not every branch push.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.probe != 'true')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The SwiftUI app relies on newer-Swift MainActor-isolation inference; pin latest stable
      # Xcode so the runner's Swift compiles it (the default image's Swift rejects it).
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      # Compiles the macOS-only code in OrbitKit (Keychain token store, URLSession SSE transport)
      # that the Linux job's `#if` guards skip.
      - name: Test OrbitKit (macOS)
        working-directory: src/macos/OrbitKit
        run: swift test
      # First real compile of the SwiftUI layer (views, @Observable models, MenuBarExtra,
      # UNUserNotificationCenter, launchctl glue). If this surfaces SDK nits, that's its job.
      - name: Build OrbitApp
        working-directory: src/macos/OrbitApp
        run: swift build

  ios:
    name: iOS (generate + build)
    # macOS runners bill at 10× — only on PRs or an explicit dispatch, not every branch push.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.probe != 'true')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version
      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate
      # First real compile of the iOS app: shared SwiftUI views + @Observable models + OrbitKit,
      # built for the simulator so no signing is needed. Surfaces any iOS-availability nits.
      - name: Build for iOS Simulator
        working-directory: src/ios
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

  # EVIDENCE ONLY — never a gate, never on a PR, and not part of the delivered branch. It builds the
  # probe app in `.ios-probe/` (the transcript's scroll tracker with a reasoning row that folds under
  # it), runs it on an iOS simulator, and uploads the trace: every phase change, every geometry
  # sample, and what the List's own UIScrollView reported at each one. Asked for with
  # `gh workflow run client.yml --ref <branch> -f probe=true`.
  #
  # The scroll machinery under test is the *platform's*, so the runtime is the experiment: the
  # owner's phone is on iOS 27 (Darwin 27.0.0) and the first two runs of this probe were on iOS 26.5
  # simulators. `probe_runner` selects the image; both print the runtime they ran on.
  ios-probe:
    name: iOS probe (tail pinning across a reasoning fold, evidence only)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.probe == 'true'
    runs-on: ${{ github.event.inputs.probe_runner || 'macos-26' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Probe
        run: bash .ios-probe/run.sh
      - name: Upload the trace, the screenshots and the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe
          path: .ios-probe/out
