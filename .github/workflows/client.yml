# TEMPORARY (probe branch, never merged). Task 34al3VgoPKAzcPqi207C9 (macOS App: at launch, rewrite
# the LaunchAgent an older app left with ORBIT_NO_SELFUPDATE so its runner updates itself), from a host
# with no gh and no token. A PUSH to this branch runs what `gh workflow run client.yml` would — the two
# Linux audits, the macOS gate (OrbitKit `swift test`, then `swift build` of OrbitApp) and the iOS
# compile gate. A last job pushes every job's result and logs to
# probe/macos-app-launchagent-migration-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/macos-app-launchagent-migration"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  font-tokens:
    name: Font tokens (bare system(size:) audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit bare system(size:) outside Typography.swift
        run: |
          hits=$(grep -rn "system(size" src/macos/OrbitApp/Sources src/ios/Sources --include='*.swift' \
                 | grep -v "Views/Typography.swift" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

  nav-push:
    name: Navigation (one push mechanism per stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate a second push mechanism
        run: bash scripts/ci/nav-push-gate.sh

  macos:
    name: macOS (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test OrbitKit (macOS)
        id: test
        continue-on-error: true
        working-directory: src/macos/OrbitKit
        run: |
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/swift-test.log"
          exit "${PIPESTATUS[0]}"
      - name: Build OrbitApp
        id: build
        continue-on-error: true
        working-directory: src/macos/OrbitApp
        run: |
          swift build 2>&1 | tee "$GITHUB_WORKSPACE/orbitapp-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/macos
          { swift --version; xcodebuild -version; } > out/macos/toolchain.txt 2>&1 || true
          grep -E "error:|Executed [0-9]+ tests|Test Suite 'All tests'" swift-test.log > out/macos/swift-test-summary.txt || true
          grep -E "LaunchdPlistMigrationTests|Phase4LogicTests" swift-test.log > out/macos/swift-test-runner-suites.txt || true
          grep -E "error:|warning:.*(RunnerControl|AppModel)\.swift" orbitapp-build.log | head -300 > out/macos/orbitapp-build-errors.txt || true
          tail -80 orbitapp-build.log > out/macos/orbitapp-build-tail.txt || true
          echo "test=${{ steps.test.outcome }} build=${{ steps.build.outcome }}" > out/macos/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-out
          path: out
      - name: Fail as the gate would
        if: steps.test.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1

  ios:
    name: iOS (generate + build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version
      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        id: build
        continue-on-error: true
        working-directory: src/ios
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/ios
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" ios-build.log | head -300 > out/ios/ios-build-summary.txt || true
          echo "build=${{ steps.build.outcome }}" > out/ios/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-out
          path: out
      - name: Fail as the gate would
        if: steps.build.outcome != 'success'
        run: exit 1

  report:
    name: Push the results where a clone can read them
    needs: [font-tokens, nav-push, macos, ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/macos-app-launchagent-migration-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "font-tokens: ${{ needs.font-tokens.result }}"
            echo "nav-push: ${{ needs.nav-push.result }}"
            echo "macos: ${{ needs.macos.result }}"
            echo "ios: ${{ needs.ios.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/macos-app-launchagent-migration-results
