# TEMPORARY (probe branch probe/i2-wiki-home-4, never merged). Only `shots` — the iPad app against .wiki-probe/stub.py, the Wiki's
# three columns photographed with Review in the detail pane (task I2) — and `report`, which pushes the shots, notes and
# logs to probe/i2-wiki-home-4-results. client.yml's own jobs ran on this tree's earlier probes (runs 37530700729, 37537164682).
name: Client probe (Wiki shots)

on:
  push:
    branches: ["probe/i2-wiki-home-4"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Wiki shots (iPhone, iPad) and the macOS build's log
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, read and photograph
        id: capture
        continue-on-error: true
        run: |
          bash .wiki-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Build OrbitApp for macOS, keeping its log
        id: macbuild
        continue-on-error: true
        working-directory: src/macos/OrbitApp
        run: |
          swift build > ../../../macos-build.log 2>&1
      - name: Keep the logs beside the shots
        if: always()
        run: |
          mkdir -p .wiki-probe/shots
          cp run-output.log .wiki-probe/shots/run-output.log 2>/dev/null || true
          for log in mac phone pad; do
            if [ -f .wiki-probe/build-$log.log ]; then
              grep -E "error:|warning: .*Wiki|Test Case|Executed|\*\* TEST|\*\* BUILD|XCTAssert|failed" .wiki-probe/build-$log.log | head -400 > .wiki-probe/shots/summary-build-$log.txt || true
              tail -300 .wiki-probe/build-$log.log > .wiki-probe/shots/tail-build-$log.txt || true
            fi
          done
          if [ -f macos-build.log ]; then
            grep -E "error:|warning: .*Wiki" macos-build.log | head -200 > .wiki-probe/shots/summary-build-macos.txt || true
            tail -120 macos-build.log > .wiki-probe/shots/tail-build-macos.txt || true
          fi
          {
            echo "capture=${{ steps.capture.outcome }}"
            echo "macbuild=${{ steps.macbuild.outcome }}"
          } > .wiki-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiki-shots
          path: .wiki-probe/shots

  report:
    name: Push the results where a clone can read them
    needs: [shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/i2-wiki-home-4-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/i2-wiki-home-4-results
