# TEMPORARY (probe branch, never merged). Task 34aQovSGcKyzF4cxzlDoN (the account's master switch for
# smart model selection on macOS/iOS), commit cacef92dd, checked from a host that can neither dispatch
# a workflow nor read a run's logs (no gh, no token). A PUSH to this branch runs the client gates — the
# two Linux audits, the macOS gate (OrbitKit `swift test`, then `swift build` of OrbitApp) and the iOS
# compile gate — and photographs the switch on an iPhone simulator (.route-probe/), and a last job
# pushes what came back to `probe/model-routing-switch-results`, which a clone reads without a token.
#
# Probe-only, under the commit being checked: a cherry-pick of 24791d138, the iOS
# type-check fix for ConsoleView.swift that main is still waiting on from the Antigravity branch —
# without it the iOS build times out in a file this task does not touch.
#
# The OrbitKit step passes when every failing case is one of the three already red on this task's
# base 82c7e92ff and on origin/main (copy-parity checks against web files this task does not touch):
# OrbitLinkCopyParityTests.testTheStalledLineIsTheProjectsOwnSentence,
# ProviderPoolsParityTests.testThePickersWordsAreTheWebs,
# SettingsCopyParityTests.testProvidersSayWhatTheWebPageSays. Any other failure fails it.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/model-routing-switch"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  font-tokens:
    name: Font tokens (bare system(size:) audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit bare system(size:) outside Typography.swift
        run: |
          hits=$(grep -rn "system(size" src/macos/OrbitApp/Sources src/ios/Sources --include='*.swift' \
                 | grep -v "Views/Typography.swift" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

  nav-push:
    name: Navigation (one push mechanism per stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate a second push mechanism
        run: bash scripts/ci/nav-push-gate.sh

  macos:
    name: macOS (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test OrbitKit (macOS)
        id: test
        continue-on-error: true
        working-directory: src/macos/OrbitKit
        run: |
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/swift-test.log"
          status="${PIPESTATUS[0]}"
          grep -qE "Executed [0-9]+ tests" "$GITHUB_WORKSPACE/swift-test.log" || { echo "no tests ran"; exit 1; }
          failed=$(grep -E "Test Case .* failed" "$GITHUB_WORKSPACE/swift-test.log" \
            | grep -vE "testTheStalledLineIsTheProjectsOwnSentence|testThePickersWordsAreTheWebs|testProvidersSayWhatTheWebPageSays" || true)
          if [ -n "$failed" ]; then echo "failures beyond the three known-red cases:"; echo "$failed"; exit 1; fi
          echo "swift test exit $status; every failure is one of the three known-red cases"
      - name: Build OrbitApp
        id: build
        continue-on-error: true
        working-directory: src/macos/OrbitApp
        run: |
          swift build 2>&1 | tee "$GITHUB_WORKSPACE/orbitapp-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/macos
          grep -E "error:|Test Case .* failed|Executed [0-9]+ tests|Test Suite 'All tests'" swift-test.log > out/macos/swift-test-summary.txt || true
          grep -E "Test Suite '(ModelRoutingLogicTests|PreferencesCodableTests|SettingsCopyParityTests|SettingsHomeTests|SettingsStackWiringTests|TaskDetailCopyParityTests|TaskDetailWiringTests)" swift-test.log > out/macos/swift-test-switch-suites.txt || true
          grep -E "error:" orbitapp-build.log | head -300 > out/macos/orbitapp-build-errors.txt || true
          grep -E "warning:.*(TasksView|SettingsSheet|SettingsAdminView|AgentsView|ComposerView)\.swift" orbitapp-build.log | head -100 > out/macos/orbitapp-switch-warnings.txt || true
          tail -80 orbitapp-build.log > out/macos/orbitapp-build-tail.txt || true
          echo "test=${{ steps.test.outcome }} build=${{ steps.build.outcome }}" > out/macos/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-out
          path: out
      - name: Fail as the gate would
        if: steps.test.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1

  ios:
    name: iOS (generate + build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version
      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        id: build
        continue-on-error: true
        working-directory: src/ios
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/ios
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" ios-build.log | head -300 > out/ios/ios-build-summary.txt || true
          grep -E "warning:.*(TasksView|SettingsSheet|SettingsAdminView|AgentsView|ComposerView)\.swift" ios-build.log | sort -u | head -100 > out/ios/ios-switch-warnings.txt || true
          echo "build=${{ steps.build.outcome }}" > out/ios/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-out
          path: out
      - name: Fail as the gate would
        if: steps.build.outcome != 'success'
        run: exit 1

  shots:
    name: Smart model selection switch probe (iPhone)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, test and capture
        id: capture
        continue-on-error: true
        run: |
          bash .route-probe/ios/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .route-probe/ios/shots
          cp run-output.log .route-probe/ios/shots/run-output.log 2>/dev/null || true
          for log in .route-probe/ios/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 \
              > ".route-probe/ios/shots/summary-$base.txt" || true
            tail -300 "$log" > ".route-probe/ios/shots/tail-$base.txt" || true
          done
          # run.sh copies the whole xcodebuild log in; the tail above is what to read, so a large
          # one is compressed rather than pushed as is.
          for log in .route-probe/ios/shots/xcodebuild-*.log; do
            [ -f "$log" ] || continue
            if [ "$(wc -c < "$log")" -gt 20000000 ]; then gzip -9 "$log"; fi
          done
          echo "capture=${{ steps.capture.outcome }}" > .route-probe/ios/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-shots
          path: .route-probe/ios/shots

  report:
    name: Push the results where a clone can read them
    needs: [font-tokens, nav-push, macos, ios, shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/model-routing-switch-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "font-tokens: ${{ needs.font-tokens.result }}"
            echo "nav-push: ${{ needs.nav-push.result }}"
            echo "macos: ${{ needs.macos.result }}"
            echo "ios: ${{ needs.ios.result }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/model-routing-switch-results
