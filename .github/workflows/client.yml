# TEMPORARY (probe branch, never merged). Photographs what a rightward swipe from a column's left edge
# does on an iPad, against .ipad-probe/stub.py. A push runs .ipad-probe/run.sh on macOS; the report job
# pushes the pictures, notes, request log and build log tails to <branch>-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/ipad-edge-swipe"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: iPad edge swipe probe
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, swipe and capture
        id: capture
        continue-on-error: true
        env:
          PROBE_ONLY: RowEdgeTests
        run: |
          bash .ipad-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .ipad-probe/shots
          cp run-output.log .ipad-probe/shots/run-output.log 2>/dev/null || true
          if [ -f .ipad-probe/build-ipad.log ]; then
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD|XCTAssert|failed" .ipad-probe/build-ipad.log | head -400 > .ipad-probe/shots/summary-build-ipad.txt || true
            tail -300 .ipad-probe/build-ipad.log > .ipad-probe/shots/tail-build-ipad.txt || true
          fi
          rm -rf .ipad-probe/shots/attachments
          echo "capture=${{ steps.capture.outcome }}" > .ipad-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-shots
          path: .ipad-probe/shots

  report:
    name: Push the results where a clone can read them
    needs: [shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to <branch>-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/${{ github.ref_name }}-results
