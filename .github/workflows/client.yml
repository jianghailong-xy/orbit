# TEMPORARY (probe branch, never merged). Photographs Settings → Infrastructure on the iPhone client
# (task P4, 34aixqRNMcUMNdzzgngyX) — against .p4-probe/stub.py, from a host that can neither dispatch a
# workflow nor read a run's logs (no gh, no token). A push runs .p4-probe/run.sh on macOS; the report job
# pushes the pictures, notes, request logs and build log tails to probe/p4-infrastructure-shots-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/p4-infrastructure-shots"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Infrastructure probe (iPhone)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash .p4-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .p4-probe/shots
          cp run-output.log .p4-probe/shots/run-output.log 2>/dev/null || true
          for log in .p4-probe/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 > ".p4-probe/shots/summary-$base.txt" || true
            tail -300 "$log" > ".p4-probe/shots/tail-$base.txt" || true
          done
          find .p4-probe/shots -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          echo "capture=${{ steps.capture.outcome }}" > .p4-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-shots
          path: .p4-probe/shots

  report:
    name: Push the results where a clone can read them
    needs: [shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/p4-infrastructure-shots-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/p4-infrastructure-shots-results
