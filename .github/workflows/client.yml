# TEMPORARY (probe branch, never merged). Task A1 (34bAKshYuCWyoAqoDR9m9): the Mac pass of .a1-probe/run.sh
# alone — the sign-in sheet's end-to-end run with the orbit scheme registered as the real app registers it,
# and the system log of AuthenticationServices around it. client.yml's own jobs for this commit ran on
# probe/a1-google (run 37542697680, results on probe/a1-google-results-run2).
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/a1-google-mac"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Login page probe (iPhone + Mac)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        env:
          PASSES: mac
        run: |
          bash .a1-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .a1-probe/shots
          cp run-output.log .a1-probe/shots/run-output.log 2>/dev/null || true
          for log in .a1-probe/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|warning: .*(GoogleSignIn|LoginView|AppModel)|Test Case|Executed|\*\* TEST|\*\* BUILD" "$log" | head -400 > ".a1-probe/shots/summary-$base.txt" || true
            tail -300 "$log" > ".a1-probe/shots/tail-$base.txt" || true
          done
          find .a1-probe/shots -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          echo "capture=${{ steps.capture.outcome }}" > .a1-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-shots
          path: .a1-probe/shots
      - name: Fail as the capture did
        if: steps.capture.outcome != 'success'
        run: exit 1

  report:
    name: Push the results where a clone can read them
    needs: [shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Every job's steps and log
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/jobs
          curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=50" > out/jobs/jobs.json
          python3 - <<'PY'
          import json, os, re, subprocess
          jobs = json.load(open("out/jobs/jobs.json"))["jobs"]
          with open("out/jobs/summary.txt", "w") as f:
              for j in jobs:
                  f.write("%s: %s / %s (job %s, %s)\n" % (j["name"], j["status"], j["conclusion"], j["id"], j.get("runner_name")))
                  for s in j.get("steps") or []:
                      f.write("   %2d %s: %s\n" % (s["number"], s["name"], s["conclusion"]))
                  if j["status"] == "completed":
                      name = re.sub(r"[^A-Za-z0-9]+", "-", j["name"]).strip("-")
                      subprocess.run(["curl", "-fsSL", "-H", "Authorization: Bearer " + os.environ["TOKEN"],
                                      "-o", "out/jobs/%s.log" % name,
                                      "https://api.github.com/repos/${{ github.repository }}/actions/jobs/%s/logs" % j["id"]])
          PY
          cat out/jobs/summary.txt
      - name: Push to probe/a1-google-mac-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/a1-google-mac-results
