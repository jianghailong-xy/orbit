# TEMPORARY (probe branch, never merged). The project sessions page on an iPhone simulator while
# .err-probe/stub.py answers its read with a Cloudflare 502 page, from a host that can neither
# dispatch a workflow nor read a run's logs. A push runs .err-probe/run.sh on macOS; the report job
# pushes the pictures, notes and build log tails to probe/project-sessions-502-shots2-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/project-sessions-502-shots2"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Project sessions 502 probe (iPhone, ${{ matrix.variant }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cjk
            title: "DeepSeek Harness 首版后续"
          - variant: en
            title: "Swipe probe project"
    env:
      PROBE_TITLE: ${{ matrix.title }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, fail the read and capture
        id: capture
        continue-on-error: true
        run: |
          bash .err-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .err-probe/shots
          cp run-output.log .err-probe/shots/run-output.log 2>/dev/null || true
          if [ -f .err-probe/build-ios.log ]; then
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD|XCTAssert|failed" .err-probe/build-ios.log | head -400 > .err-probe/shots/summary-build-ios.txt || true
            tail -300 .err-probe/build-ios.log > .err-probe/shots/tail-build-ios.txt || true
          fi
          echo "capture=${{ steps.capture.outcome }}" > .err-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: err-shots-${{ matrix.variant }}
          path: .err-probe/shots

  report:
    name: Push the results where a clone can read them
    needs: [shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/project-sessions-502-shots2-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/project-sessions-502-shots2-results
