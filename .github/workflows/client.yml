# TEMPORARY (probe branch, never merged). Photographs the iPhone app tapping a session-list project row
# whose line says a member is waiting on you (task 34xRdppTZ9izoSssMDNoc), on the tree before the change
# (base) and on the change (this commit's parent), against .wm-probe/stub.py. Beside it, client.yml's
# macOS gate with its two steps kept apart: main's OrbitKit parity reds (task 34xK7iEpYZgGgOftT3iS7)
# stop the real gate before it builds OrbitApp, so the build runs here on its own. The report job pushes the
# pictures, notes, request logs and build log tails to probe/wmember-shots-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/wmember-shots"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: dfd7ebfcf5f828ad2f15513b0712b12ec3911bfe

jobs:
  macos:
    name: macOS (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test OrbitKit (macOS)
        id: kit
        continue-on-error: true
        working-directory: src/macos/OrbitKit
        run: |
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/orbitkit-test.log"
          exit "${PIPESTATUS[0]}"
      - name: Build OrbitApp
        id: build
        working-directory: src/macos/OrbitApp
        run: |
          swift build 2>&1 | tee "$GITHUB_WORKSPACE/orbitapp-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/macos
          grep -E "error:|Executed [0-9]+ tests" orbitkit-test.log | head -300 > out/macos/orbitkit-test-summary.txt || true
          grep -E "Compiling OrbitApp (AppModel|ConsoleModel|AgentsView|ConsoleView|SessionFolderPage)|error:|Build complete" orbitapp-build.log | head -100 > out/macos/orbitapp-build-summary.txt || true
          tail -40 orbitapp-build.log > out/macos/orbitapp-build-tail.txt || true
          echo "kit=${{ steps.kit.outcome }} build=${{ steps.build.outcome }}" > out/macos/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-out
          path: out

  shots:
    name: Waiting project row (iPhone, ${{ matrix.tree }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tree: [base, fix]
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: The tree under test
        run: |
          if [ "${{ matrix.tree }}" = base ]; then
            git fetch --depth=1 origin "$BASE_SHA"
            git worktree add "$RUNNER_TEMP/tree" FETCH_HEAD
            cp -R .wm-probe "$RUNNER_TEMP/tree/"
            echo "TREE=$RUNNER_TEMP/tree" >> "$GITHUB_ENV"
          else
            echo "TREE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Which tap rule is under test
        run: grep -n "SessionProjectSheet.rowTap" "$TREE/src/macos/OrbitApp/Sources/OrbitApp/Views/AgentsView.swift"
      - name: Build, drive and capture
        id: capture
        continue-on-error: ${{ matrix.tree == 'base' }}
        run: |
          bash "$TREE/.wm-probe/run.sh" 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          P="$TREE/.wm-probe"
          mkdir -p "$P/shots"
          cp run-output.log "$P/shots/run-output.log" 2>/dev/null || true
          for log in "$P"/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD|XCTAssert|failed" "$log" | head -400 > "$P/shots/summary-$base.txt" || true
            tail -300 "$log" > "$P/shots/tail-$base.txt" || true
          done
          find "$P/shots" -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          rm -rf "$P/shots/ios/attachments"
          echo "tree=${{ matrix.tree }} capture=${{ steps.capture.outcome }}" > "$P/shots/outcomes.txt"
          mkdir -p "out/${{ matrix.tree }}"
          cp -R "$P/shots/." "out/${{ matrix.tree }}/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.tree }}
          path: out

  report:
    name: Push the results where a clone can read them
    needs: [macos, shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/wmember-shots-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "macos: ${{ needs.macos.result }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/wmember-shots-results
