# PROBE-BRANCH COPY of .github/workflows/client.yml (see ../probe-harness/README.md), never merged.
# Dropped on the throwaway branch `probe/session-recap-entries` as .github/workflows/client.yml, a
# push to that branch runs: the two real compile gates — `macos` (OrbitKit `swift test`, then
# OrbitApp `swift build`, each kept with its log even when the other fails) and `ios` (XcodeGen +
# the simulator build of the shipped app) — and `shots`, which builds both probe apps out of the real
# shared sources and lets RecapEntriesShotTests photograph them. `report` pushes everything to
# `probe/session-recap-entries-results`, the branch a clone can read without a token.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/session-recap-entries"]
  workflow_dispatch:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test OrbitKit (macOS)
        id: kit
        continue-on-error: true
        working-directory: src/macos/OrbitKit
        run: |
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/orbitkit-test.log"
          exit "${PIPESTATUS[0]}"
      - name: Build OrbitApp
        id: build
        continue-on-error: true
        working-directory: src/macos/OrbitApp
        run: |
          swift build 2>&1 | tee "$GITHUB_WORKSPACE/orbitapp-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/macos
          grep -E "error:|Executed [0-9]+ tests|with [0-9]+ failures|failed \(" orbitkit-test.log | head -300 > out/macos/orbitkit-test-summary.txt || true
          tail -60 orbitkit-test.log > out/macos/orbitkit-test-tail.txt || true
          grep -E "error:" orbitapp-build.log | head -300 > out/macos/orbitapp-build-errors.txt || true
          tail -80 orbitapp-build.log > out/macos/orbitapp-build-tail.txt || true
          echo "kit=${{ steps.kit.outcome }} build=${{ steps.build.outcome }}" > out/macos/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-out
          path: out
      - name: Fail as the gate would
        if: steps.kit.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1

  ios:
    name: iOS (generate + build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version
      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        id: build
        continue-on-error: true
        working-directory: src/ios
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Summaries
        if: always()
        run: |
          mkdir -p out/ios
          grep -E "error:|\*\* BUILD" ios-build.log | head -300 > out/ios/ios-build-summary.txt || true
          tail -60 ios-build.log > out/ios/ios-build-tail.txt || true
          echo "build=${{ steps.build.outcome }}" > out/ios/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-out
          path: out
      - name: Fail as the gate would
        if: steps.build.outcome != 'success'
        run: exit 1

  shots:
    name: Recap entries (iPhone + Mac)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      # project.yml's `../src` paths are relative to the repository root, so the harness runs from
      # a copy of itself placed there.
      - name: Stage the harness at the repository root
        run: |
          mkdir -p .recap-entries-probe
          cp -R docs/evidence/session-recap-entries-native/probe-harness/. .recap-entries-probe/
      - name: Build, drive and capture
        id: capture
        continue-on-error: true
        run: |
          bash .recap-entries-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          P=.recap-entries-probe
          mkdir -p "$P/shots"
          cp run-output.log "$P/shots/run-output.log" 2>/dev/null || true
          for log in "$P"/build-*.log; do
            [ -f "$log" ] || continue
            base=$(basename "$log" .log)
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD|XCTAssert|failed" "$log" | head -400 > "$P/shots/summary-$base.txt" || true
            tail -300 "$log" > "$P/shots/tail-$base.txt" || true
          done
          find "$P/shots" -name 'xcodebuild-*.log' -size +20M -exec gzip -9 {} \;
          rm -rf "$P"/shots/*/attachments-*
          echo "capture=${{ steps.capture.outcome }}" > "$P/shots/outcomes.txt"
          echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$P/shots/outcomes.txt"
          echo "sha=${{ github.sha }}" >> "$P/shots/outcomes.txt"
          # The screen the Mac window was drawn on, and this Mac's own clock and zone: the labels'
          # clock time and "today" are the device's, and the stub logs say the mode each pass served.
          { echo "== displays =="; system_profiler SPDisplaysDataType 2>/dev/null | head -40
            osascript -e 'tell application "Finder" to get bounds of window of desktop' 2>&1
            echo "== date =="; date -u +"utc %Y-%m-%dT%H:%M:%SZ"; date +"local %Y-%m-%dT%H:%M:%S %Z"
            echo "== stub logs (the mode each pass served) =="
            head -1 "$P"/shots/mac/requests-on.log "$P"/shots/mac/requests-off.log \
              "$P"/shots/ios/requests-on.log "$P"/shots/ios/requests-off.log 2>/dev/null || true
          } >> "$P/shots/outcomes.txt" || true
          mkdir -p out/shots
          cp -R "$P/shots/." out/shots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recap-entries-shots
          path: out
          # `.done-probe` is the "it ran to the end" record; hidden files are excluded by default.
          include-hidden-files: true
      - name: Fail as the capture did
        if: steps.capture.outcome != 'success'
        run: exit 1

  report:
    name: Push the results where a clone can read them
    needs: [macos, ios, shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/session-recap-entries-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "macos: ${{ needs.macos.result }}"
            echo "ios: ${{ needs.ios.result }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "recap-entries probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/session-recap-entries-results
