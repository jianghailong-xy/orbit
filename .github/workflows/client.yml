# TEMPORARY (probe branch, never merged). Swipes back on a project's sessions page in the iPhone
# app, against .swipe-probe/stub.py, from a host that can neither dispatch a workflow nor read a
# run's logs (no gh, no token). A push runs .swipe-probe/run.sh on macOS; the report job pushes the
# pictures, notes, request log and build log tails to probe/project-page-swipe-back-shots2-results.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["probe/project-page-swipe-back-shots2"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Project page swipe-back probe (iPhone)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version && sw_vers
      - name: Build, swipe and capture
        id: capture
        continue-on-error: true
        run: |
          bash .swipe-probe/run.sh 2>&1 | tee run-output.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the build's errors and the run's output beside the shots
        if: always()
        run: |
          mkdir -p .swipe-probe/shots
          cp run-output.log .swipe-probe/shots/run-output.log 2>/dev/null || true
          if [ -f .swipe-probe/build-ios.log ]; then
            grep -E "error:|Test Case|Executed|\*\* TEST|\*\* BUILD|XCTAssert|failed" .swipe-probe/build-ios.log | head -400 > .swipe-probe/shots/summary-build-ios.txt || true
            tail -300 .swipe-probe/build-ios.log > .swipe-probe/shots/tail-build-ios.txt || true
          fi
          echo "capture=${{ steps.capture.outcome }}" > .swipe-probe/shots/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swipe-shots
          path: .swipe-probe/shots

  report:
    name: Push the results where a clone can read them
    needs: [shots]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to probe/project-page-swipe-back-shots2-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "shots: ${{ needs.shots.result }}"
          } > RESULTS.txt
          cat RESULTS.txt
          git init -q
          git config user.name "orbit-probe"
          git config user.email "probe@orbit.invalid"
          git checkout -q -b results
          git add -A
          git commit -q -m "probe results for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            results:refs/heads/probe/project-page-swipe-back-shots2-results
