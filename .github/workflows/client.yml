# CI for both native client shells (src/macos + src/ios). They share OrbitKit and the OrbitApp
# SwiftUI sources (the iOS app reuses them in place — Structure B), so changes to either shell
# compile both platforms here:
#
#   • macos — macOS compile gate: `swift test`s OrbitKit on macOS (builds the `#if os(macOS)`
#     Keychain + URLSession-SSE paths) and `swift build`s OrbitApp (SwiftUI; can't build on Linux).
#   • ios — iOS compile gate: XcodeGen + `xcodebuild` for the Simulator (no signing). Surfaces
#     iOS-only SDK nits in the shared SwiftUI surface.
#
# OrbitKit's platform-agnostic Linux tests run for every pull request in ci.yml, where they can be
# a required check without path-filter deadlocks.
#
# Signed/distributable builds live in release.yml (tag-triggered). macOS runners bill at 10×, so the
# two Xcode jobs run only on pull_request or an explicit workflow_dispatch — never plain pushes. A
# PR touching the shared OrbitKit/OrbitApp exercises both compile gates (correct — the code is
# shared); a PR touching only one client's own dir still runs both, which is a small, safe overpay.
name: Client CI (macOS + iOS)

on:
  push:
    branches: ["**"]        # branches only — tags are handled by release.yml
    paths:
      - "src/macos/**"
      - "src/ios/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "src/macos/**"
      - "src/ios/**"
      - ".github/workflows/client.yml"
  # Manual trigger to compile a branch on the Mac runners without opening a throwaway PR, e.g.
  # `gh workflow run client.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type-ramp guard: views must use the semantic tokens in Views/Typography.swift (the one file
  # allowed to hold fixed sizes) so iOS/macOS sizing stays platform-appropriate and Dynamic Type
  # keeps working. Hard fail — the sweep landed; add a token instead of a bare size.
  font-tokens:
    name: Font tokens (bare system(size:) audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit bare system(size:) outside Typography.swift
        run: |
          hits=$(grep -rn "system(size" src/macos/OrbitApp/Sources src/ios/Sources --include='*.swift' \
                 | grep -v "Views/Typography.swift" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            count=$(echo "$hits" | wc -l)
            echo "::error::$count bare system(size:) call site(s) outside Views/Typography.swift — use the Font.orbit* tokens (see the Typography.swift header)"
            exit 1
          else
            echo "No bare system(size:) call sites outside Typography.swift."
          fi

  macos:
    name: macOS (build + test)
    # macOS runners bill at 10× — only on PRs or an explicit dispatch, not every branch push.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The SwiftUI app relies on newer-Swift MainActor-isolation inference; pin latest stable
      # Xcode so the runner's Swift compiles it (the default image's Swift rejects it).
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      # Compiles the macOS-only code in OrbitKit (Keychain token store, URLSession SSE transport)
      # that the Linux job's `#if` guards skip.
      - name: Test OrbitKit (macOS)
        working-directory: src/macos/OrbitKit
        run: swift test
      # First real compile of the SwiftUI layer (views, @Observable models, MenuBarExtra,
      # UNUserNotificationCenter, launchctl glue). If this surfaces SDK nits, that's its job.
      - name: Build OrbitApp
        working-directory: src/macos/OrbitApp
        run: swift build

  ios:
    name: iOS (generate + build)
    # macOS runners bill at 10× — only on PRs or an explicit dispatch, not every branch push.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: swift --version && xcodebuild -version && xcodegen --version
      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate
      # First real compile of the iOS app: shared SwiftUI views + @Observable models + OrbitKit,
      # built for the simulator so no signing is needed. Surfaces any iOS-availability nits.
      - name: Build for iOS Simulator
        working-directory: src/ios
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

  # SwiftUI draws on a Mac and nowhere else, so "here is what the card looks like" has no source
  # but a Mac runner: a Linux session can compile-check the syntax and read the CSS it is porting,
  # and still cannot see whether the layout holds. This renders the transcript's cards straight out
  # of the app's own view sources with ImageRenderer, light and dark, and uploads them.
  #
  # Dispatch-only like the two gates above (10× billing), and a gate for nothing — it asserts
  # nothing and no required check reads its conclusion. `continue-on-error` keeps a broken harness
  # from colouring a run whose compile jobs passed.
  snapshot:
    name: Card snapshots (light + dark)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Render the cards
        run: |
          set -euo pipefail
          app="$PWD/src/macos/OrbitApp/Sources/OrbitApp"
          work="$RUNNER_TEMP/card-snapshots"
          mkdir -p "$work/Sources/CardSnapshots" "$RUNNER_TEMP/out"
          # The views are compiled out of the app in place — a snapshot of a copy would only ever
          # show what the copy said.
          cp "$app/Views/Typography.swift" "$app/Views/BackgroundWakeCardView.swift" \
             "$work/Sources/CardSnapshots/"
          cat > "$work/Package.swift" <<'SPM'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "CardSnapshots",
              platforms: [.macOS(.v14)],
              dependencies: [.package(path: "ORBITKIT")],
              targets: [.executableTarget(name: "CardSnapshots",
                                          dependencies: [.product(name: "OrbitKit", package: "OrbitKit")])]
          )
          SPM
          sed -i '' -e "s#ORBITKIT#$PWD/src/macos/OrbitKit#" "$work/Package.swift"
          cat > "$work/Sources/CardSnapshots/Snap.swift" <<'SWIFT'
          import AppKit
          import OrbitKit
          import SwiftUI

          // Four cards, in the two schemes: a job that finished, a wake carrying several of which one
          // failed, a scheduled wakeup, and one still queued behind the running turn. The first and
          // third are production blocks copied verbatim out of this deployment's `run_event` rows (the
          // Chinese wording that shipped until 2026-09-15) — the parser has to keep reading them, so the
          // picture may as well prove it.
          let jobDone = """
          <background-job-wake>
            你用 bg_run 起的后台作业有了你在等的消息，控制面为此给你开了这一轮：
              bgj_cc4b4ef84b39｜watch｜gh run watch 34970575848 --exit-status >/dev/null 2>&1; echo "CI 34970575848 (rerun of Test web, bb4a144ff) exit: $?"｜watch main CI rerun 34970575848
                已结束｜completed｜退出码 0
                输出 /root/.orbit/runs/01a0992f-f058-7605-be10-6a02467ac860/bgj_cc4b4ef84b39.output｜这次说到的是第 0–54 字节
                输出末尾：
                  CI 34970575848 (rerun of Test web, bb4a144ff) exit: 1
            这是控制面替你记下的，不是用户说的。完整输出用 mcp__orbit__bg_output 按 id 读，sinceOffset 填上面的起点就只读新的部分。
          </background-job-wake>
          """

          let jobsMixed = """
          <background-job-wake>
            A background job you started with bg_run has news you were waiting for; the control plane opened this turn for it:
              bgj_2955bec0e9fc｜watch｜gh run watch 34997433169 --exit-status｜watch main CI 34997433169 on tip 9ebda07ef
                ended｜failed｜exit code 1
                output /root/.orbit/runs/01a0992f/bgj_2955bec0e9fc.output｜this covers bytes 0–350612
                output tail:
                  ✓ Run every pg spec against a real PostgreSQL
                  - Keep the failing specs' output
                  ✓ Complete job

                  ANNOTATIONS
                  X Process completed with exit code 1.
                  JavaScript: .github#3532
                  X Process completed with exit code 1.
                  Error: Process completed with exit code 1.
              bgj_987dbb363d36｜job｜bash scripts/run-pg-spec.sh src/apiserver/src/tasks/dependency-landed.pg.spec.ts｜Red run: new pg spec on the unchanged tree
                ended｜completed｜exit code 0
                output /root/.orbit/runs/01a0992f/bgj_987dbb363d36.output｜this covers bytes 0–9612
                output tail:
                  not ok 3 - a dependency that landed is read off origin/main
            The control plane recorded this for you; the user did not say it. Read the full output with mcp__orbit__bg_output by id; pass sinceOffset to read only what is new.
          </background-job-wake>
          """

          let scheduled = """
          <scheduled-wakeup>
            你用 schedule_wakeup 约的唤醒到点了，控制面为此给你开了这一轮：
              2026-09-15T11:29:14.912Z 约在 3600 秒后，2026-09-15T12:29:14.911Z 到点
              理由：复跑负载闸门 12:16Z 超时必开跑，12:26Z 检查时应有部分结果；防 waiter 被 drain 杀
              你留给这一轮的话：
                兜底检查：入口 400 复跑 unit rerun-400-104631 现在状态如何？负载闸门 deadline 12:16Z 已过，应已开跑或已完成。
            这是控制面替你记下的，不是用户说的。还要再等，就再调一次 mcp__orbit__schedule_wakeup。
          </scheduled-wakeup>
          """

          @main
          @MainActor
          struct Snap {
              static func main() throws {
                  let out = URL(fileURLWithPath: CommandLine.arguments[1])
                  for (name, scheme) in [("light", ColorScheme.light), ("dark", ColorScheme.dark)] {
                      try write(gallery.environment(\.colorScheme, scheme)
                                       .background(scheme == .dark ? Color.black : Color.white),
                                to: out.appendingPathComponent("bgwake-native-\(name).png"))
                  }
              }

              @ViewBuilder
              static var gallery: some View {
                  VStack(alignment: .leading, spacing: 18) {
                      card("① One job, finished — the brand tone", jobDone, ts: "2026-09-15T23:40:00Z")
                      card("② Several jobs, one failed — the warning tone, with the output tail",
                           jobsMixed, ts: "2026-09-15T23:37:00Z")
                      card("③ A scheduled wakeup coming due", scheduled, ts: "2026-09-15T23:20:00Z")
                      card("④ Still queued behind the running turn", jobDone, ts: nil, queued: true)
                  }
                  .padding(20)
                  .frame(width: 620)
              }

              @ViewBuilder
              static func card(_ caption: String, _ note: String, ts: String?,
                               queued: Bool = false) -> some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Text(caption).font(.orbitMeta).foregroundStyle(.secondary)
                      if let wake = BackgroundWakeText.parse(note) {
                          BackgroundWakeCardView(wake: wake, ts: ts,
                                                 onCancelQueued: queued ? {} : nil)
                      } else {
                          Text("PARSE FAILED").foregroundStyle(.red)
                      }
                  }
              }

              static func write(_ view: some View, to url: URL) throws {
                  let renderer = ImageRenderer(content: view)
                  renderer.scale = 2
                  guard let image = renderer.nsImage, let tiff = image.tiffRepresentation,
                        let rep = NSBitmapImageRep(data: tiff),
                        let png = rep.representation(using: .png, properties: [:]) else {
                      FileHandle.standardError.write(Data("render produced no image\n".utf8))
                      exit(1)
                  }
                  try png.write(to: url)
                  print("wrote \(url.path)")
              }
          }
          SWIFT
          swift run --package-path "$work" CardSnapshots "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: card-snapshots
          path: ${{ runner.temp }}/out/*.png
