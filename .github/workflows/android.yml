name: Android CI

on:
  # Keep the required check present even on PRs outside src/android.
  pull_request:
  push:
    branches: ["**"]
    paths:
      - "src/android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/release.yml"
      - "scripts/ci/release-workflows.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (test + lint + debug APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release trigger isolation
        run: node --test scripts/ci/release-workflows.test.mjs
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.9+10.0.LTS'
      # ubuntu-24.04 supplies sdkmanager and accepted SDK licenses. Install the
      # pinned tools explicitly; a missing SDK package is a failure, never a skip.
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmdline-tools;22.0'
          "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      # A fresh runner, no Gradle cache restore, and clean outputs witness a real
      # build. Debug signing is generated locally and requires no release secrets.
      - name: Verify Android
        run: bash src/android/scripts/verify.sh "$RUNNER_TEMP/android-verification"
      - name: Keep verification evidence and installable debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-debug-${{ github.sha }}
          path: ${{ runner.temp }}/android-verification
          if-no-files-found: error
          retention-days: 14
