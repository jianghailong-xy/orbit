# Release workflow for all three Orbit clients — one `vX.Y.Z` tag ships them from a single push:
#   • identity        → refuses a tag whose version is not the root package.json version or that has no
#                       human-written release-notes/<version>.md; every build job waits for it.
#   • dmg             → macOS: signed + notarized + stapled DMG, its Sparkle payload and the appcast.
#                       Builds on a tag push and on workflow_dispatch; publishes nothing itself.
#   • testflight      → iOS: signed .ipa archived and uploaded to TestFlight.
#   • android-build   → Android: signed release APK, built and verified with the android-internal environment.
#   • supply-chain    → downloads every build, builds the runner binaries and both service images from the
#                       tag, writes SHA256SUMS, a CycloneDX SBOM, an in-toto/SLSA provenance statement and the
#                       release manifest, re-verifies them, and attests the bundle. Publishing waits for it:
#                       an artifact that disagrees with the version, its checksum, the SBOM or the provenance
#                       stops the release here.
#   • publish         → creates the GitHub Release (body = release-notes/<version>.md) with the DMG, Sparkle
#                       payload, runner reference binaries, checksums, SBOM, provenance and manifest, and
#                       publishes the Sparkle appcast to GitHub Pages. The only job that creates a Release.
#   • android-publish → attaches the APK, its .sha256 and android-update.json (what installed apps
#                       read to update themselves) to the Release publish created.
#
# Trigger: pushing a `v*` tag runs ALL of them. `workflow_dispatch` builds macOS and/or iOS only, with a
# `platform` choice (both / macos / ios) so a single Apple client can be rebuilt without a tag (a dispatch
# with no tag uses each build's default version); it publishes nothing. Android runs on tag pushes alone.
# The build/test CI gates live in client.yml and android.yml.
#
# The tag drives the version. The tag is `v` + the root package.json version (identity checks it), macOS uses
# it verbatim (vX.Y.Z → stable channel; vX.Y.Z-beta.N → Sparkle beta channel), the GitHub Release body is the
# human-written release-notes/<version>.md. iOS strips any -beta.N to a numeric marketing version
# (CFBundleShortVersionString must be numeric); its build number is the commit count. Android uses the
# tag without v as versionName and the same commit count as versionCode, which must exceed every
# published Android versionCode; a second tag on an already published commit skips Android quietly.
#
# Supply-chain trust root: the checksums, SBOM and provenance are generated and verified by
# scripts/supply-chain.mjs and documented in docs/supply-chain.md. `actions/attest-build-provenance`
# additionally signs a GitHub artifact attestation for every bundle file, which anyone can verify with
# `gh attestation verify`. Every action below is pinned to a full commit SHA.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   macOS: DEVID_CERT_P12_BASE64, DEVID_CERT_PASSWORD, KEYCHAIN_PASSWORD, APPLE_ID, APPLE_TEAM_ID,
#          APPLE_APP_PASSWORD, SPARKLE_ED_PRIVATE_KEY
#   iOS:   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, APPLE_TEAM_ID
#   (iOS one-time setup — App Store Connect app + API key — is in src/ios/README.md → Release.)
# Android signing is not a repo secret: environment android-internal (v* tags only) holds secrets
#   ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and variables
#   ANDROID_APPLICATION_ID, ANDROID_CERT_SHA256 (optional ORBIT_ANDROID_FIREBASE_{APP_ID,API_KEY,PROJECT_ID,
#   SENDER_ID,ANDROID_PACKAGE}: public Firebase client values, all or none). Only android-build sees them.
#   (See src/android/docs/release.md.)
name: Release (macOS DMG + iOS TestFlight + Android APK)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which client(s) to build
        type: choice
        default: both
        options: [both, macos, ios]
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: only `publish` and `android-publish` write, and only `supply-chain` may
# mint an attestation.
permissions:
  contents: read

jobs:
  # ---- The one version ---------------------------------------------------------------------------
  # The tag must name the root package.json version and carry human-written notes for that version;
  # nothing is built or published otherwise (docs/release-process.md, "One version of record").
  identity:
    name: Release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # the commit count every artifact's build number uses
          persist-credentials: false
      - name: Check the tag, package version and release notes name one release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: node scripts/release-identity.mjs check-tag "$GITHUB_REF_NAME"

  # ---- macOS: signed + notarized DMG ----------------------------------------------------------
  dmg:
    name: macOS · signed + notarized DMG
    needs: [identity]
    # A tag push builds both; a manual run honours the platform choice.
    if: (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'macos'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # full history so build-dmg.sh's commit-count CFBundleVersion is monotonic
          persist-credentials: false

      # The app relies on newer-Swift MainActor-isolation inference (SwiftUI View + @Observable),
      # so pin the latest stable Xcode to match the toolchain it compiles under locally.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Install create-dmg
        run: brew install create-dmg

      # Rebuild the Developer ID identity into a throwaway keychain so codesign can find it.
      - name: Import Developer ID certificate
        env:
          DEVID_CERT_P12_BASE64: ${{ secrets.DEVID_CERT_P12_BASE64 }}
          DEVID_CERT_PASSWORD:   ${{ secrets.DEVID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVID_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Make the temp keychain default + searchable so codesign and notarytool find it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      # Store the notary credentials under the profile name build-dmg.sh expects.
      - name: Store notarization profile
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials orbit-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Build signed + notarized DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # On a v* tag the tag drives the DMG version; manual runs keep the script default.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          SIGN_ID="Developer ID Application: Wikova HQ ($APPLE_TEAM_ID)" \
          NOTARIZE_PROFILE=orbit-notary \
          ARCHS=arm64 \
          ./src/macos/scripts/build-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Orbit-dmg
          path: src/macos/build/Orbit-v*
          if-no-files-found: error

      # The appcast is generated here, where the Sparkle key and the zip are, and published by the
      # `publish` job only after the supply chain has verified the artifacts.
      - name: Generate Sparkle appcast
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Prerelease tags (vX.Y.Z-…) publish to the beta channel; stable tags reach everyone.
          channel=""; case "$GITHUB_REF_NAME" in *-*) channel="--channel beta";; esac
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          mkdir -p "$RUNNER_TEMP/sparkle"; tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          work="$RUNNER_TEMP/updates"; mkdir -p "$work/out"
          cp "src/macos/build/Orbit-v$ver-arm64.zip" "$work/"
          # Seed with the currently-published appcast so prior versions are preserved.
          curl -fsSL -o "$work/appcast.xml" https://jianghailong-xy.github.io/orbit/appcast.xml || true
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" "$work" \
            --ed-key-file - $channel \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            --maximum-versions 10
          cp "$work/appcast.xml" "$work/out/appcast.xml"

      - name: Upload the Sparkle appcast
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparkle-appcast
          path: ${{ runner.temp }}/updates/out/appcast.xml
          if-no-files-found: error

  # ---- iOS: TestFlight --------------------------------------------------------------------------
  testflight:
    name: iOS · TestFlight
    needs: [identity]
    if: (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'ios'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # full history → commit-count build number is monotonic
          persist-credentials: false
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: xcodebuild -version && xcodegen --version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID:        ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Manual signing: rebuild a FIXED Apple Distribution identity + App Store provisioning profile
      # from secrets. Automatic signing (-allowProvisioningUpdates) mints a fresh "Apple Development"
      # certificate on every clean runner and eventually trips Apple's per-account certificate cap
      # ("maximum number of certificates" → no profile found). A pinned distribution cert is reused
      # forever, so releases stop accumulating certs.
      - name: Import distribution certificate + provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64:     ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD:       ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD:            ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Make the temp keychain default + searchable so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"
          # Install the App Store provisioning profile; surface its Name for the signer / ExportOptions.
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROVISION_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile '$NAME' ($UUID)"

      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate

      - name: Archive
        working-directory: src/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # On a tag the tag drives the version; a manual dispatch falls back to the newest tag
          # rather than a hardcoded default that silently goes stale.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            MKT="${GITHUB_REF_NAME#v}"     # v0.1.2 or v0.1.2-beta.3 → 0.1.2-beta.3
          else
            MKT="$(git -c versionsort.suffix=-beta tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
            MKT="${MKT#v}"
          fi
          MKT="${MKT%%-*}"                 # strip any -beta.N → numeric X.Y.Z (CFBundleShortVersionString)
          MKT="${MKT:-0.0.0}"              # no tags (shallow clone) → placeholder
          BUILD="$(git rev-list --count HEAD)"
          echo "Building marketing $MKT (build $BUILD) with profile '$PROVISION_PROFILE_NAME'"
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Orbit.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISION_PROFILE_NAME" \
            MARKETING_VERSION="$MKT" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            archive

      - name: Export + upload to TestFlight
        working-directory: src/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/REPLACE_WITH_TEAM_ID/${APPLE_TEAM_ID}/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          # Overwrite the profile-name placeholder via PlistBuddy (handles spaces in the name safely).
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:io.orbitd.app $PROVISION_PROFILE_NAME" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Orbit.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

  # ---- Android: signed APK on the same GitHub Release ---------------------------------------------
  # Tag pushes only. The signing material lives in the android-internal environment, which only
  # this job uses; nothing here runs Apple tooling or holds a write token.
  android-build:
    name: Android · signed release APK
    needs: [identity]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: android-internal
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # versionCode is the commit count, as the iOS build number is
          persist-credentials: false
      # Before anything reads a secret: the tag names the version, and the commit count must exceed every
      # published Android versionCode. A commit already published by another v* tag skips the rest quietly.
      - name: Check tag, version and release history
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT_ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
        run: |
          set -euo pipefail
          python3 src/android/scripts/github-release.py validate --tag "$GITHUB_REF_NAME" \
            --version-code "$(git rev-list --count HEAD)" --source-sha "$(git rev-parse HEAD)" \
            --application-id "$ORBIT_ANDROID_APPLICATION_ID" --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.version.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '21.0.9+10.0.LTS'
      - name: Verify release trigger isolation
        if: steps.version.outputs.skip == 'false'
        run: node --test scripts/ci/release-workflows.test.mjs
      - name: Install Android SDK packages
        if: steps.version.outputs.skip == 'false'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmdline-tools;22.0'
          "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Verify Android
        if: steps.version.outputs.skip == 'false'
        run: bash src/android/scripts/verify.sh "$RUNNER_TEMP/android-verification"
      - name: Build and verify signed APK
        if: steps.version.outputs.skip == 'false'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ORBIT_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORBIT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBIT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORBIT_ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
          ORBIT_ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          ORBIT_ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ORBIT_ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ORBIT_ANDROID_SIGNING_PURPOSE: release
          ORBIT_ANDROID_FIREBASE_APP_ID: ${{ vars.ORBIT_ANDROID_FIREBASE_APP_ID }}
          ORBIT_ANDROID_FIREBASE_API_KEY: ${{ vars.ORBIT_ANDROID_FIREBASE_API_KEY }}
          ORBIT_ANDROID_FIREBASE_PROJECT_ID: ${{ vars.ORBIT_ANDROID_FIREBASE_PROJECT_ID }}
          ORBIT_ANDROID_FIREBASE_SENDER_ID: ${{ vars.ORBIT_ANDROID_FIREBASE_SENDER_ID }}
          ORBIT_ANDROID_FIREBASE_ANDROID_PACKAGE: ${{ vars.ORBIT_ANDROID_FIREBASE_ANDROID_PACKAGE }}
        run: |
          set -euo pipefail
          umask 077
          : "${ANDROID_KEYSTORE_BASE64:?Configure signing in the protected android-internal environment}"
          export ORBIT_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-internal-signing.jks"
          trap 'rm -f "$ORBIT_ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ORBIT_ANDROID_KEYSTORE_PATH"
          bash src/android/scripts/build-release.sh "$RUNNER_TEMP/android-internal-apk"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-internal-signing.jks"
      - name: Keep signed APK and identity
        if: steps.version.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-${{ github.run_id }}
          path: ${{ runner.temp }}/android-internal-apk
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # ---- Supply chain: checksums, SBOM, provenance ------------------------------------------------
  # Reads every build artifact, builds the runner binaries and both service images from the tag, and
  # writes the four documents that tie the release to its source. `verify` re-reads them; a mismatch
  # fails this job, and `publish` waits for it. Runs even when the Android build failed (its assets are
  # then simply absent, and android-publish will not attach any), but never when the DMG failed.
  supply-chain:
    name: Supply chain · checksums, SBOM, provenance
    needs: [dmg, android-build]
    if: always() && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.dmg.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write          # actions/attest-build-provenance signs with GitHub's OIDC identity
      attestations: write      # the signed attestation is stored on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: src/runner-go/go.sum

      - name: Download the macOS build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: Orbit-dmg
          path: ${{ runner.temp }}/artifacts/dmg
      - name: Download the Sparkle appcast
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sparkle-appcast
          path: ${{ runner.temp }}/artifacts/appcast
      - name: Download the Android build
        if: needs.android-build.outputs.skip == 'false'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: android-release-${{ github.run_id }}
          path: ${{ runner.temp }}/artifacts/android
      - name: Stage every artifact under one name
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/supply-chain"
          mkdir -p "$work/artifacts"
          cp "$RUNNER_TEMP"/artifacts/dmg/*.dmg "$RUNNER_TEMP"/artifacts/dmg/*.zip "$work/artifacts/"
          cp "$RUNNER_TEMP"/artifacts/appcast/appcast.xml "$work/artifacts/"
          if [ -f "$RUNNER_TEMP/artifacts/android/app-release.apk" ]; then
            cp "$RUNNER_TEMP/artifacts/android/app-release.apk" "$work/artifacts/orbit-android-${GITHUB_REF_NAME#v}.apk"
            cp "$RUNNER_TEMP/artifacts/android/identity.json" "$work/artifacts/android-identity.json"
          fi
          ls -l "$work/artifacts"
      # The runner release is built from the tag with the same script a deployment runs. A deployment
      # serves its own build (with its own origin baked in) at /dl; this reference build is what the
      # release's sums, SBOM and provenance describe.
      - name: Build the runner binaries
        env:
          ORBIT_SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/build-binaries.sh "$RUNNER_TEMP/supply-chain/artifacts"
      # Build both service images from this tag and record what was built. A deployment rebuilds them
      # from the same source; the recorded config and layer digests are this build's, not a promise
      # that Docker builds are bit-reproducible.
      - name: Build the service images
        run: |
          set -euo pipefail
          for spec in 'orbit-apiserver src/apiserver/Dockerfile' 'orbit-web src/web/Dockerfile'; do
            set -- $spec
            name="$1"; dockerfile="$2"
            for attempt in 1 2 3; do
              if docker build -f "$dockerfile" -t "$name:release" . ; then built=1; break; fi
              echo "::warning::$name image build attempt $attempt failed; retrying in 20s"
              sleep 20
            done
            [ "${built:-0}" = 1 ] || exit 1
            node scripts/supply-chain.mjs image-inspect --name "$name" --image "$name:release" \
              --dockerfile "$dockerfile" --out "$RUNNER_TEMP/supply-chain/images/$name.json"
          done
      - name: Generate the bundle
        run: |
          set -euo pipefail
          # A bundle that silently loses a surface is not a release; the Android one is required
          # only when this run built it (a second tag on a published commit skips Android).
          require=(--require-surface macos --require-surface sparkle-appcast --require-surface runner)
          if [ -f "$RUNNER_TEMP/artifacts/android/app-release.apk" ]; then
            require+=(--require-surface android --require-surface android-identity)
          fi
          node scripts/supply-chain.mjs generate \
            --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --artifacts "$RUNNER_TEMP/supply-chain/artifacts" \
            --out "$RUNNER_TEMP/supply-chain/bundle" --tree . \
            --build-number "$(git rev-list --count HEAD)" \
            --lockfile "$PWD/package-lock.json" \
            --workflow ".github/workflows/release.yml" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --started-on "$(git show -s --format=%cI "$GITHUB_SHA")" \
            --finished-on "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${require[@]}" \
            --image "$RUNNER_TEMP/supply-chain/images/orbit-apiserver.json" \
            --image "$RUNNER_TEMP/supply-chain/images/orbit-web.json"
      # The gate: a version, checksum, SBOM or provenance mismatch stops here, and publish waits.
      - name: Verify the bundle
        run: |
          node scripts/supply-chain.mjs verify --dir "$RUNNER_TEMP/supply-chain/bundle" \
            --tag "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --tree . --require-ci
      - name: Attest the bundle
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ runner.temp }}/supply-chain/bundle/*
      - name: Keep the verified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.run_id }}
          path: ${{ runner.temp }}/supply-chain/bundle
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # ---- Publish: the one job that creates the GitHub Release --------------------------------------
  # Holds the write token but never the signing environment or its secrets. The APK is attached by
  # android-publish after this job (its update manifest is written there); everything else here.
  publish:
    name: Publish the GitHub Release
    needs: [supply-chain]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: supply-chain-${{ github.run_id }}
          path: ${{ runner.temp }}/supply-chain
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/supply-chain"
          ver="${GITHUB_REF_NAME#v}"
          prerelease=""; case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          # The APK and its .sha256 are attached by android-publish, together with the update
          # manifest installed apps read; uploading them here would make that job collide.
          mapfile -t assets < <(find "$dir" -maxdepth 1 -type f ! -name 'orbit-android-*.apk' | sort)
          # The body is the release's own human-written notes; the identity job refused the tag without them.
          gh release create "$GITHUB_REF_NAME" --title "Orbit $ver" \
            --notes-file "release-notes/$ver.md" $prerelease "${assets[@]}"
      - name: Stage the appcast for Pages
        run: |
          mkdir -p "$RUNNER_TEMP/appcast"
          cp "$RUNNER_TEMP/supply-chain/appcast.xml" "$RUNNER_TEMP/appcast/appcast.xml"
      - name: Publish appcast to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ${{ runner.temp }}/appcast
          # Keep the public entrance deployed by pages.yml alongside Sparkle's feed.
          keep_files: true

  # Holds the write token but never the signing environment or its secrets. It does not create the
  # Release or change its pre-release/latest state, and never replaces an asset already there.
  android-publish:
    name: Android · attach to the GitHub Release
    needs: [publish, android-build]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.android-build.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: android-release-${{ github.run_id }}
          path: ${{ runner.temp }}/android-release
      - name: Write update manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The update carries the release's own human-written notes; the identity job refused the tag without them.
          cp "release-notes/${GITHUB_REF_NAME#v}.md" "$RUNNER_TEMP/notes.txt"
          python3 src/android/scripts/github-release.py manifest --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            --identity "$RUNNER_TEMP/android-release/identity.json" --apk "$RUNNER_TEMP/android-release/app-release.apk" \
            --notes-file "$RUNNER_TEMP/notes.txt" --output "$RUNNER_TEMP/publish" --github-output "$GITHUB_OUTPUT"
      - name: Attach to the GitHub Release
        if: steps.manifest.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/publish"
          mapfile -t pending < "$out/pending-assets.txt"
          # The APK and its .sha256 first: installed apps act only on a release that carries the manifest.
          if [ "${#pending[@]}" -gt 0 ]; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${pending[@]/#/$out/}"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$out/android-update.json"
      - name: Verify published assets
        if: steps.manifest.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/android/scripts/github-release.py verify-published --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/publish"
