# PROBE, never merged: ci.yml's `dependency-review` job copied verbatim from the task branch head, with the
# workflow also triggered by a push to this probe branch. A push is not workflow_dispatch, so the job is skipped
# by its `if:`, and the check run it leaves shows the name GitHub reports for the skipped job.
name: CI

on:
  pull_request:
  push:
    branches: [main, probe/dependency-review-skip-name]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Dependency review' || 'Dependency review (workflow_dispatch only)' }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the base (main now) and the head (this run's commit)
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [ -n "$sha" ] || { echo "could not resolve main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base: main at $sha"
          echo "head: $GITHUB_SHA"
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ steps.base.outputs.sha }}
          head-ref: ${{ github.sha }}
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
