name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Two removal censuses (evidence-judgment-removal, session-current-work-startup-removal)
      # measure `git show --numstat` over the commit that carries their migration. A shallow
      # checkout leaves HEAD parentless, so that reports the whole tree as additions and never
      # mentions a deleted file at all. They need the history they read.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Build workspaces
        run: npm run build
      - name: Test shared
        run: npm test -w @orbit/shared
      # This step does NOT collect `*.pg.spec.js`, and that is the repair rather than an omission.
      # It used to: the glob took all 441 compiled specs, 113 of them pg specs, every one of which
      # skips itself when COORDINATOR_PG_URL is unset — and this workflow has never set it. The last
      # green on main before this change (run 34201926745) reported `tests 3479 / pass 3090 /
      # skipped 389` and was a success. A spec that is collected and then skipped is the hole; a
      # spec that is not collected is a spec another job owns, and the `postgres` job below owns
      # these. What is left here is 328 specs that need no database and now report `skipped 0`, so
      # a skip appearing in this step again is a fact about this step rather than about PostgreSQL.
      - name: Test API server
        run: npm test -w @orbit/apiserver
      - name: Test web
        run: npm test -w @orbit/web
      - name: Test upgrade source SHA propagation
        run: npm run test:upgrade-source-sha

  # Every `*.pg.spec` in the apiserver, against a real PostgreSQL, with a skip counted red.
  #
  # WHY THIS JOB EXISTS
  # ===================
  # Before it, no CI run had ever witnessed a single assertion in a single pg spec. There was no
  # `services:` block anywhere in this file, so COORDINATOR_PG_URL was always unset, so all 113 of
  # them skipped themselves, and `node --test` exits 0 on a file whose every case skipped. "CI is
  # green" therefore said nothing about coordinator delivery, the completion gates, the migrations,
  # or any lock or concurrency property — every one of those is held by a pg spec and by nothing
  # else. The count was printed on every run (`skipped 389`) and cost nothing to read.
  #
  # WHY IT PROVISIONS ITS OWN CONTAINER RATHER THAN USING `services: postgres:`
  # ==========================================================================
  # A `services:` block is one database, and one database is the wrong shape for this tree three
  # times over. `scripts/project-pg-matrix.sh` is the shape that fits, and it already exists:
  #
  #   * Specs own schema. Sharing a database means one spec's DDL is the schema the next one is
  #     measured against. The script migrates a template once and hands every spec its own clone.
  #   * `steer-dequeue` needs an EMPTY database, not a migrated one — its `DROP TABLE "session"`
  #     would otherwise hit the dependent objects of every migration. The script special-cases it.
  #   * Two specs (`task-dispatch-epoch-aba`, `task-run-winner-recovery`) assert what survives a
  #     real server restart, and skip without COORDINATOR_PG_RESTART_COMMAND. A container this job
  #     owns can be restarted; a service container's name is not this job's to know.
  #
  # It also hands over the three URL names the tree reads (COORDINATOR_PG_URL, ORBIT_TEST_PG_URL,
  # WORK_OVERVIEW_PG_URL), the three COORDINATOR_PG_EXPECTED_* the specs' own isolation guard
  # demands, and ORBIT_DB_CONFLICT_ORIGIN=fault_injection. Each of those is there so that some spec
  # does not skip, which is why the run below has no allowlist: the alternative to excusing a spec
  # has always been a variable the harness can supply.
  #
  # A SKIP IS RED, AND EVERY PG SPEC IS IN
  # ======================================
  # The script parses each child's TAP summary with `pg_matrix_summary`
  # (`scripts/pg-matrix-summary.lib.sh`) and goes red on a skip, a failure, `tests=0`, or a summary
  # it cannot vouch for. No subset was carved out, so there is no "these did not make it" list to
  # keep honest: `ls build/**/*.pg.spec.js` is the roster, an empty roster is fatal, and the
  # complement of it is exactly what the JavaScript job's `Test API server` step runs. Nothing in
  # the tree is collected-then-skipped by either job.
  #
  # This job is RED on main the day it lands, and that is the finding rather than a regression it
  # introduced: `project-criterion-satisfaction.pg.spec` has been failing since 36e62c76 added a
  # reader its census does not name, and nothing was running it. 822 assertions, 820 of them
  # passing. The repair is task 34LChICOPrNfBwmKdqjE2, not this file.
  #
  # The control that holds this to it is the script's own, and it is one line in the step below:
  #
  #     env:
  #       PCC_PG_CONTROL: omit-url
  #
  # With that set, everything happens exactly as it normally does except that no URL reaches a child
  # under any of its three names — this workflow's own condition until today. It was pushed in that
  # state once, on this branch, and run 34216156128 reported
  #
  #     ==== tests=409 pass=20 fail=0 skipped=389 missing-summary=0 spec-level-red=113 ====
  #     RED: agent-identity-migration.pg.spec.js: 6 SKIPPED — those assertions were not witnessed
  #
  # and FAILED. Note `fail=0`: not one assertion failed, every `node --test` exited 0, and the job
  # went red anyway — which is the whole claim. Note also `skipped=389`, the same 389 the JavaScript
  # job used to print under a green check. If that knob ever goes green, every green this job has
  # ever printed is worth nothing.
  #
  # WHAT IT COSTS
  # =============
  # Its own runner for about six and a half minutes, in parallel with the JavaScript job rather than
  # after it: 113 specs, 822 assertions, `skipped 0` (run 34215251448, 6m28s). The JavaScript job
  # got shorter rather than longer — 3m03s before this change, 2m30s after, because `Test API
  # server` no longer loads 113 files in order to skip them (73s -> 48s).
  postgres:
    name: PostgreSQL specs
    runs-on: ubuntu-latest
    # Above a passing run rather than at it: a budget is not a second chance.
    timeout-minutes: 45
    steps:
      # No `fetch-depth: 0` here, unlike the JavaScript job: the two removal censuses that read this
      # repository's history are plain specs, and the only pg specs that run `git` at all build
      # their own throwaway repositories.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The matrix compiles `@orbit/shared` and `tsconfig.test.json` itself, but it deliberately
      # does NOT generate the Prisma client in a plain checkout — generating there rewrites the
      # client every concurrent tree is compiling against. On a runner there is no other tree, so
      # the generation it skips has to happen here or `tsc` compiles against nothing.
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Run every pg spec against a real PostgreSQL
        env:
          # The matrix prints one summary line per spec and keeps each child's own output only if
          # told where to put it. Without this a red reads `fail=6` and nothing else — which
          # assertion, and what it saw, would be in a buffer the run threw away.
          PCC_PG_LOG_DIR: ${{ runner.temp }}/pg-spec-logs
        run: mkdir -p "$PCC_PG_LOG_DIR" && bash scripts/project-pg-matrix.sh
      - name: Keep the failing specs' output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pg-spec-logs
          path: ${{ runner.temp }}/pg-spec-logs
          if-no-files-found: warn

  go-runner:
    name: Go runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: src/runner-go/go.sum
      - name: Test runner
        working-directory: src/runner-go
        run: go test ./...

  swift-core:
    name: Swift core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7
      - name: Test OrbitKit
        working-directory: src/macos/OrbitKit
        run: swift test

  # Both images this repository ships, built from the tree under test and then RUN.
  #
  # WHY THIS JOB EXISTS
  # ===================
  # `grep -rn 'docker build' .` over the whole tree — no path argument, no `--include`, so
  # nothing could hide behind a filename this file does not end in — returned three lines before
  # this job, and all three were prose: two Dockerfile header comments and one test name. Inside
  # `.github/`, `grep -rniE 'docker|buildx|compose|image'` reached the two dependabot docker
  # ecosystems and a comment in a Swift step. No CI run had ever built an image.
  #
  # On 2026-09-09 that cost the site ten minutes of 502. Dependabot's prisma 7.9.1 -> 7.10.0 bump
  # (`2eead690`) passed `npm ci`, `npm audit`, every workspace's tests, the pg matrix and the Go
  # and Swift jobs, because npm's decision about WHERE to put the `prisma` CLI — the workspace's
  # own node_modules or the hoisted root one — is invisible to all of them, and fatal only to an
  # image whose boot command named one of those trees outright. `003abb91` reverted it.
  #
  # BUILDING IS NOT ENOUGH; IT HAS TO BOOT
  # ======================================
  # That bump's image BUILT. `docker build` exited 0 on the very commit that took production
  # down, so a build-only gate would have been green on the one commit it existed to catch: what
  # failed was the first half of CMD, several minutes later, on a machine with a database in
  # front of it. So this job runs the image — a throwaway PostgreSQL, the four variables the
  # container actually requires, no command override, and then the predicate docker-compose.yml
  # itself waits on. scripts/image-boot-check.sh owns that and says why each step is shaped the
  # way it is; the short version is that every verdict there reads `.State.Status`, because
  # `docker run -d` and `docker compose up -d` both exit 0 for a container that is crash-looping.
  #
  # WHAT ALREADY EXISTED, AND WHY IT WAS NOT THIS
  # =============================================
  # The deploy path is not blind: `.agents/skills/upgrade/scripts/upgrade.sh` runs `migrate
  # deploy` through `$DC run` before it recreates any service, so a database the new image cannot
  # migrate stops the upgrade instead of the site. Three things that pre-flight structurally
  # cannot do, which is why it is not the gate:
  #   * It RETYPES the command rather than running the image's CMD. A CMD that is itself wrong —
  #     a typo, a moved path, anything in the half after the `&&` — passes it and then crash-
  #     loops. In 2026-09-09 it would have failed only by coincidence: the deploy script happened
  #     to name the same wrong path, and had to be fixed in the same commit as the Dockerfile.
  #   * It runs on the production host, after a person decided to deploy. The author of the
  #     change is long gone by then, and dependabot never sees it at all — which is exactly the
  #     author this accident had.
  #   * It says nothing about the web image, which has no pre-flight of any kind.
  #
  # WHEN IT RUNS
  # ============
  # Every pull request and every push to main, with deliberately no `paths:` filter. The
  # tempting filter is package-lock.json plus the two Dockerfiles plus docker-compose.yml, and it
  # would have caught 2026-09-09. But the set of changes that can break only the image is the set
  # of files the Dockerfiles COPY: src/apiserver/**, src/shared/**, src/web/**, contracts/**, the
  # Prisma migrations, scripts/build-binaries.sh, and one individually named file under
  # scripts/. A filter is a hand-maintained second copy of those COPY lists that goes stale the
  # first time a COPY line is added — and a filtered workflow that does not run reports nothing
  # at all, so a hole in the list looks exactly like a pass. Against that, the filter buys
  # nothing here: the job costs no wall clock (see below) and no money, this repository being
  # public, where GitHub's standard runners are free.
  #
  # WHY THE WEB IMAGE IS IN
  # =======================
  # Its fragile surface is different from the apiserver's and just as uncovered. ORBIT_SOURCE_SHA
  # has to reach scripts/build-binaries.sh or the build aborts; `COPY .gi[t]` works only because
  # .dockerignore re-admits exactly .git/HEAD, .git/refs and .git/packed-refs; and the runner
  # binaries come out of a Go stage nothing else in CI compiles. It builds in a fraction of the
  # apiserver's time and boots in seconds, so it rides along rather than earning its own job.
  #
  # WHAT IT COSTS
  # =============
  # Its own runner, in parallel with the four jobs above rather than after them. Measured on this
  # branch: apiserver image PLACEHOLDER_API_BUILD, web image PLACEHOLDER_WEB_BUILD, boot
  # PLACEHOLDER_BOOT, PLACEHOLDER_TOTAL for the job. CI's wall clock is set by its slowest job,
  # and that is still `PostgreSQL specs` at about six and a half minutes, so the run as a whole
  # PLACEHOLDER_VERDICT. No layer cache is configured on purpose: `cache-to: type=gha` would have
  # to run in `mode=max` to reach the `npm ci` layer at all (it lives in a build stage that never
  # ships), the two images are about 1.5 GB together, and the repository's 10 GB Actions cache is
  # already carrying the npm cache four other jobs restore from. A cache that evicts that to
  # store this is a net loss while the uncached build already fits inside the run.
  #
  # ITS NEGATIVE CONTROL IS THE DEFECT ITSELF
  # =========================================
  # The `postgres` job above needs a knob to prove it can fail, because its failure mode is a
  # silent skip. This job has no such mode: it either builds and boots or it does not. It was
  # proven red by putting the accident back — CMD returned to the hardcoded
  # `node_modules/prisma/build/index.js` under src/apiserver, against this branch's lock, which
  # is already the 7.10.0 that hoisted that file away — and green again with it removed.
  # PLACEHOLDER_RUNS
  images:
    name: Container images
    runs-on: ubuntu-latest
    # Above a passing run rather than at it: a budget is not a second chance.
    timeout-minutes: 40
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Build the apiserver image
        run: docker build -f src/apiserver/Dockerfile -t orbit-apiserver:ci .
      # The commit stamped into the runner binaries. A checkout has .git, but naming the commit
      # is what upgrade.sh does too, and it is the one input build-binaries.sh refuses to guess.
      - name: Build the web image
        run: |
          docker build -f src/web/Dockerfile \
            --build-arg ORBIT_SOURCE_SHA="${{ github.sha }}" \
            -t orbit-web:ci .
      - name: Boot both images
        env:
          ORBIT_APISERVER_IMAGE: orbit-apiserver:ci
          ORBIT_WEB_IMAGE: orbit-web:ci
        run: bash scripts/image-boot-check.sh
