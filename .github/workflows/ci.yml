name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Two removal censuses (evidence-judgment-removal, session-current-work-startup-removal)
      # measure `git show --numstat` over the commit that carries their migration. A shallow
      # checkout leaves HEAD parentless, so that reports the whole tree as additions and never
      # mentions a deleted file at all. They need the history they read.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Build workspaces
        run: npm run build
      - name: Test shared
        run: npm test -w @orbit/shared
      - name: Test API server
        run: npm test -w @orbit/apiserver
      - name: Test web
        run: npm test -w @orbit/web
      - name: Test upgrade source SHA propagation
        run: npm run test:upgrade-source-sha

  go-runner:
    name: Go runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: src/runner-go/go.sum
      - name: Test runner
        working-directory: src/runner-go
        run: go test ./...

  swift-core:
    name: Swift core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7
      - name: Test OrbitKit
        working-directory: src/macos/OrbitKit
        run: swift test
