name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown and local links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Always report the check so branch protection can require it without leaving
      # code-only PRs pending. Install/run the tools only for documentation inputs.
      - name: Detect documentation changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'check=true' >> "$GITHUB_OUTPUT"
          elif [ -n "$(git diff --name-only "$BASE_SHA" HEAD -- '*.md' '.github/ISSUE_TEMPLATE/**' \
            '.github/workflows/docs.yml' '.github/workflows/ci.yml' '.markdownlint-cli2.jsonc' '.markdown-link-check.json' \
            'scripts/check-docs.mjs' 'scripts/docs-public-files.txt' 'test/check-docs.test.mjs' \
            'test/configuration-reference.test.mjs' \
            'package.json' 'package-lock.json')" ]; then
            echo 'check=true' >> "$GITHUB_OUTPUT"
          else
            echo 'check=false' >> "$GITHUB_OUTPUT"
            echo 'No documentation inputs changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.check == 'true'
        with:
          node-version: 26
          cache: npm
      - name: Install tools without lifecycle scripts
        if: steps.changes.outputs.check == 'true'
        run: npm ci --ignore-scripts
      - name: Test the documentation checker
        if: steps.changes.outputs.check == 'true'
        run: npm run test:docs > docs-check.log 2>&1
      - name: Lint Markdown and check local links and anchors
        if: steps.changes.outputs.check == 'true'
        run: |
          if npm run docs:check >> docs-check.log 2>&1; then
            cat docs-check.log
          else
            cat docs-check.log
            exit 1
          fi
      - name: Upload documentation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-diagnostics
          path: docs-check.log
          if-no-files-found: ignore
          retention-days: 7
