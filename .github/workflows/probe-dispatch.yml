# TEMPORARY (task 34bkMbJBijj8rD2HwWXqJ, deleted with the probe branch). The Mac that holds this
# repository's evidence has no GitHub token and no `gh`, so it cannot call the dispatch API and
# cannot open a pull request: a push is the one trigger it has. This job turns that push into the
# `workflow_dispatch` run of client.yml the probe needs, using the one token that does exist inside
# the repository — the runner's own GITHUB_TOKEN, which is allowed to dispatch (GitHub excepts
# workflow_dispatch and repository_dispatch from the no-recursion rule for that token).
#
# It fires only when the probe's own wiring changes, so a later push that only writes evidence back
# does not buy a second Mac runner.
name: Probe dispatch (client.yml, source-refused shots)

on:
  push:
    branches: ["probe/source-refused-mac-shots"]
    paths:
      - ".github/workflows/client.yml"
      - ".github/workflows/probe-dispatch.yml"

permissions:
  actions: write

jobs:
  dispatch:
    name: Dispatch client.yml with the probe switched on
    runs-on: ubuntu-latest
    steps:
      - name: POST the dispatch, with source_refused_probe on
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -o /tmp/answer -w 'HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/client.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"source_refused_probe\":\"true\"}}"
          cat /tmp/answer
