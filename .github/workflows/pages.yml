name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The public site is a small static tree. It is published to the existing gh-pages
# branch rather than replacing the Pages source with a second hosting system. The
# release workflow also writes appcast.xml to that branch.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy public entrance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node for the dependency-free link checker
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and validate Pages artifact
        run: ./scripts/build-pages.sh --output dist/pages

      # Keep a downloadable report even when validation fails. The script also writes
      # ::error and $GITHUB_STEP_SUMMARY details so a failed build is visible in the run.
      - name: Upload Pages build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-build-diagnostics
          path: |
            dist/pages-build-diagnostics.txt
            dist/pages/build-report.md
          if-no-files-found: ignore

      - name: Publish build summary
        if: success()
        run: |
          {
            echo "### GitHub Pages deployed"
            echo
            echo "- URL: https://jianghailong-xy.github.io/orbit/"
            echo "- Appcast: https://jianghailong-xy.github.io/orbit/appcast.xml"
            echo "- Deployment branch: \`gh-pages\`"
            echo "- Preservation: \`keep_files=true\`; the Sparkle release workflow's appcast.xml is retained"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to the existing gh-pages branch
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist/pages
          keep_files: true
          commit_message: "deploy: GitHub Pages ${{ github.sha }}"
