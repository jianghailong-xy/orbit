# TEMPORARY evidence probe (never merged): iPhone shots of "Show both languages" interleaved.
name: Bilingual interleave probe
on:
  push:
    branches: ["probe/bilingual-interleave-shots"]
permissions:
  contents: read
jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: bash .bi-probe/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bilingual-iphone-shots
          path: .bi-probe/shots
