version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      # A dependency does NOT join the first group it matches — it joins the MOST
      # SPECIFIC one, and dependabot counts rule keys to decide that. `npm-production`
      # states two (`dependency-type` + `update-types`) and a bare `patterns` group
      # states one, so without the exclusions below the catch-alls win every time and
      # these two groups never see a single package. That is not a guess: run
      # 34290952231 said it in as many words —
      #   Skipping @prisma/client for group 'prisma' - belongs to more specific
      #   group 'npm-production'
      # and then `Skipping update group for 'nestjs' as it does not match any allowed
      # dependencies`. So the split is closed here, on the catch-alls, rather than by
      # ordering or by out-specifying them.
      #
      # It has to be closed because both families straddle `dependency-type`, which is
      # the only thing the catch-alls sort on:
      #
      #   `@prisma/client` + `@prisma/adapter-pg` are dependencies, the `prisma` CLI is
      #   a devDependency. Split across two PRs, each moved half and left the other at
      #   the old version, and `npm run prisma:generate` failed on both with
      #   `Could not resolve @prisma/client`.
      #
      #   `@nestjs/cli` + `@nestjs/schematics` are devDependencies and the other five
      #   are dependencies; and since the catch-alls take only minor and patch, the
      #   11 -> 12 major arrived as seven single-package PRs. `@nestjs/core@12` needs
      #   `@nestjs/common@^12` as a peer, so not one of them can land alone.
      #
      # No `update-types` on these two: for nestjs the major IS the case that needs it.
      #
      # One more thing the first attempt at this walked into, worth writing down: a
      # group is skipped when a group processed BEFORE it already claimed its packages
      # — `Skipping @prisma/client in group prisma as it has already been handled by a
      # previous group`. The catch-alls are handled first, and "handled" counts the
      # membership of the PR that is already open, not the membership the current
      # config would give it. So on the run right after these exclusions were added,
      # the still-open pre-exclusion npm-production/npm-development PRs held the prisma
      # packages and the prisma group came out empty. It only forms on the NEXT full
      # run, once those PRs have been replaced by ones that no longer name them.
      # Changing group membership therefore costs two update runs, not one.
      # This group used to carry one cost no CI job could see. 7.10.0 moved the
      # `prisma` CLI out of the workspace and up to the root node_modules, and four
      # places named the workspace path outright — the apiserver image's boot command
      # among them, which runs `migrate deploy` before the server binds. So `2eead690`
      # merged green and took the site down with a crash loop until `003abb91`
      # reverted it. All four now ask node where the CLI is, and CI's `Container
      # images` job builds both images and boots the apiserver against a real
      # database, so a green run on this group now covers that too.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      nestjs:
        patterns:
          - "@nestjs/*"
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "prisma"
          - "@prisma/*"
          - "@nestjs/*"
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "prisma"
          - "@prisma/*"
          - "@nestjs/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin

  - package-ecosystem: gomod
    directory: /src/runner-go
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin

  - package-ecosystem: swift
    directory: /src/macos/OrbitKit
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Berlin

  - package-ecosystem: swift
    directory: /src/macos/OrbitApp
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin

  - package-ecosystem: docker
    directory: /src/apiserver
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Berlin

  - package-ecosystem: docker
    directory: /src/web
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Berlin
