version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin

  - package-ecosystem: gomod
    directory: /src/runner-go
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin

  - package-ecosystem: swift
    directory: /src/macos/OrbitKit
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Berlin

  - package-ecosystem: swift
    directory: /src/macos/OrbitApp
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin

  - package-ecosystem: docker
    directory: /src/apiserver
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Berlin

  - package-ecosystem: docker
    directory: /src/web
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Berlin
