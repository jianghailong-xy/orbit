<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20293b"/>
      <stop offset="1" stop-color="#171e2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { fill: #f3f4f6; font-size: 34px; font-weight: 700; }
      .subtitle { fill: #9ca3af; font-size: 18px; }
      .label { fill: #cbd5e1; font-size: 16px; font-weight: 600; }
      .muted { fill: #94a3b8; font-size: 15px; }
      .branch { fill: #f8fafc; font-size: 20px; font-weight: 600; }
      .monoBranch { fill: #f8fafc; font-size: 19px; font-weight: 600; }
      .stats { fill: #cbd5e1; font-size: 17px; }
      .buttonText { fill: #e2e8f0; font-size: 16px; font-weight: 700; }
      .note { fill: #a7f3d0; font-size: 16px; font-weight: 600; }
      .small { fill: #64748b; font-size: 14px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1390" cy="110" r="250" fill="#25345c" opacity=".25"/>
  <circle cx="120" cy="920" r="220" fill="#123b48" opacity=".18"/>

  <text x="120" y="105" class="ui title">Project code diff parking bar</text>
  <text x="120" y="145" class="ui subtitle">Two display rules for the same project integration line</text>

  <!-- Task panel -->
  <g filter="url(#shadow)">
    <rect x="100" y="205" width="1400" height="265" rx="18" fill="url(#panel)" stroke="#334155" stroke-width="1"/>
  </g>
  <text x="145" y="255" class="ui label">PROJECT TASK</text>
  <rect x="1315" y="225" width="135" height="34" rx="17" fill="#123d35" stroke="#287c68"/>
  <text x="1382" y="248" text-anchor="middle" class="ui note">code task</text>

  <rect x="145" y="292" width="1310" height="115" rx="12" fill="#141b2a" stroke="#2c394d"/>
  <text x="180" y="335" class="mono monoBranch">⎇  orbit/validate-api-7f3a</text>
  <text x="665" y="335" class="ui stats"><tspan fill="#4ade80">+18</tspan><tspan>  </tspan><tspan fill="#fb7185">−6</tspan><tspan>  · 4 files</tspan></text>
  <line x1="180" y1="360" x2="1420" y2="360" stroke="#29364a"/>
  <text x="180" y="390" class="ui muted">Merge target</text>
  <text x="320" y="390" class="mono" fill="#8be9fd" font-size="18" font-weight="700">project/acme-42</text>
  <text x="585" y="390" class="ui small">ProjectCodebase.integrationRef</text>
  <rect x="1160" y="365" width="245" height="44" rx="10" fill="#2b6cb0"/>
  <text x="1282" y="393" text-anchor="middle" class="ui buttonText">Merge to project/acme-42</text>

  <text x="145" y="447" class="ui note">Task branch stays isolated; its landing target is the project integration ref.</text>

  <!-- Coordinator panel -->
  <g filter="url(#shadow)">
    <rect x="100" y="535" width="1400" height="315" rx="18" fill="url(#panel)" stroke="#334155" stroke-width="1"/>
  </g>
  <text x="145" y="585" class="ui label">PROJECT COORDINATOR</text>
  <rect x="1270" y="555" width="180" height="34" rx="17" fill="#3b315f" stroke="#765bc0"/>
  <text x="1360" y="578" text-anchor="middle" class="ui" fill="#ddd6fe" font-size="15" font-weight="700">integration diff</text>

  <rect x="145" y="622" width="1310" height="148" rx="12" fill="#141b2a" stroke="#2c394d"/>
  <text x="180" y="665" class="mono monoBranch">⎇  project/acme-42</text>
  <text x="575" y="665" class="ui stats"><tspan fill="#4ade80">+42</tspan><tspan>  </tspan><tspan fill="#fb7185">−13</tspan><tspan>  · 9 files</tspan></text>
  <text x="980" y="665" class="ui muted">integrationRef</text>
  <line x1="180" y1="690" x2="1420" y2="690" stroke="#29364a"/>
  <text x="180" y="725" class="ui muted">Compared with workspace target</text>
  <text x="525" y="725" class="mono" fill="#8be9fd" font-size="18" font-weight="700">project/acme-42</text>
  <text x="805" y="725" class="ui" fill="#64748b" font-size="21">→</text>
  <text x="845" y="725" class="mono" fill="#fbbf24" font-size="18" font-weight="700">main</text>
  <text x="930" y="725" class="ui small">workspace.defaultMergeTarget</text>
  <rect x="1160" y="705" width="245" height="44" rx="10" fill="#5b4aa3"/>
  <text x="1282" y="733" text-anchor="middle" class="ui buttonText">Review integration diff</text>

  <text x="145" y="810" class="ui note">Coordinator view compares the project line with the workspace target; it is not a task branch merge.</text>

  <!-- Legend -->
  <rect x="100" y="900" width="1400" height="1" fill="#263246"/>
  <circle cx="145" cy="940" r="6" fill="#8be9fd"/>
  <text x="165" y="946" class="ui small">integrationRef</text>
  <circle cx="350" cy="940" r="6" fill="#fbbf24"/>
  <text x="370" y="946" class="ui small">workspace target branch</text>
  <text x="1180" y="946" class="ui small">concept mockup · v1</text>
</svg>
