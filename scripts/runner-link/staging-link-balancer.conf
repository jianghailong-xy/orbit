# The layer-4 balancer in front of the staging stack's two link gateway nodes (staging.gateways.compose.yml), as a cell's
# nodes stand behind one (docs/runner-link-design.md §15.3): each TCP connection goes to a node that accepts it, with TLS
# passed through to the node. A node that is down refuses the connection, or lets it time out, and the next node gets
# it. The nodes' names are resolved again every 5 s through Docker's resolver, so a node started again under another
# address is found.
worker_processes 1;
events {
  worker_connections 4096;
}
stream {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream link_gateways {
    zone link_gateways 64k;
    server link-gateway:8443 resolve max_fails=1 fail_timeout=10s;
    server link-gateway-b:8443 resolve max_fails=1 fail_timeout=10s;
  }
  server {
    listen 8443;
    proxy_pass link_gateways;
    proxy_connect_timeout 2s;
    # Longer than a connection is ever quiet: the gateway pings every connection.
    proxy_timeout 10m;
  }
}
