# TEMPORARY evidence probe (see ../README.md).
name: PoolProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
packages:
  OrbitKit:
    path: ../../src/macos/OrbitKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Simulator only: ad-hoc "sign to run locally", no team, no profile.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  PoolProbe:
    type: application
    platform: iOS
    sources:
      - Sources
      - Generated
      # The app's own asset catalog, for its accent colour.
      - path: ../../src/ios/Support/Assets.xcassets
    dependencies:
      - package: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.poolprobe
        PRODUCT_NAME: PoolProbe
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  PoolProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PoolProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.poolprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PoolProbe:
    build:
      targets:
        PoolProbe: all
        PoolProbeUITests: [test]
    test:
      targets:
        - PoolProbeUITests
