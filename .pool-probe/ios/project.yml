# TEMPORARY evidence probe (see ../README.md). Two apps in one project:
#   PoolProbe  — the real picker/composer code copied in by gen.py, one screen per launch.
#   OrbitProbe — the real iOS app (src/ios's own target definition, re-declared here so nothing of
#                the delivery branch is touched), driven by a UI test against ../stub.py.
name: PoolProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
packages:
  OrbitKit:
    path: ../../src/macos/OrbitKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "1"
    # Simulator only: ad-hoc "sign to run locally", no team, no profile.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  PoolProbe:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Generated
        excludes: ["Info-probe.plist"]
      # The app's own asset catalog, for its accent colour.
      - path: ../../src/ios/Support/Assets.xcassets
    dependencies:
      - package: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.poolprobe
        PRODUCT_NAME: PoolProbe
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  PoolProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PoolProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.poolprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PoolProbe
  # The real app: src/ios's target, source for source (see src/ios/project.yml), with gen.py's
  # ATS-off Info.plist so it can reach the stub, and no entitlements (this build takes no capability).
  OrbitProbe:
    type: application
    platform: iOS
    sources:
      - path: ../../src/ios/Sources
      - path: ../../src/ios/Support/Assets.xcassets
      - path: ../../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
          - "HotKeyManager.swift"
          - "UpdaterModel.swift"
          - "RunnerControl.swift"
          - "Views/RunnerControlPane.swift"
          - "Views/MenuBarContent.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.orbitprobe
        PRODUCT_NAME: OrbitProbe
        INFOPLIST_FILE: Generated/Info-probe.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OrbitProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RealUITests]
    dependencies:
      - target: OrbitProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.orbitprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OrbitProbe
schemes:
  PoolProbe:
    build:
      targets:
        PoolProbe: all
        PoolProbeUITests: [test]
    test:
      targets:
        - PoolProbeUITests
  OrbitProbe:
    build:
      targets:
        OrbitProbe: all
        OrbitProbeUITests: [test]
    test:
      targets:
        - OrbitProbeUITests
