# TEMPORARY evidence probe (never merged). The iOS app's own shared sources and shells — CompactShell on an
# iPhone, MainView's three columns on an iPad, as OrbitiOSApp picks them — and the Mac app's MainView, with this
# probe's entry points in place of OrbitiOSApp / OrbitApp, and UI tests that photograph the Wiki (task I2).
name: WikiProbe
options:
  bundleIdPrefix: io.orbitd
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  OrbitKit:
    path: ../src/macos/OrbitKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  WikiProbe:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: ../src/ios/Support/Assets.xcassets
      - path: ../src/ios/Sources
        name: Shell
        excludes:
          - "OrbitiOSApp.swift"
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
          - "HotKeyManager.swift"
          - "UpdaterModel.swift"
          - "RunnerControl.swift"
          - "Views/RunnerControlPane.swift"
          - "Views/MenuBarContent.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.wikiprobe
        PRODUCT_NAME: WikiProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  WikiProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests/Shared, UITests/iOS]
    dependencies:
      - target: WikiProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.wikiprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  WikiMacProbe:
    type: application
    platform: macOS
    sources:
      - path: mac
      - path: ../src/macos/Assets.xcassets
      - path: ../src/macos/OrbitApp/Sources/OrbitApp
        name: Shared
        excludes:
          - "OrbitApp.swift"
    dependencies:
      - package: OrbitKit
        product: OrbitKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.wikimacprobe
        PRODUCT_NAME: WikiMacProbe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
  WikiMacProbeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests/Shared, UITests/Mac]
    dependencies:
      - target: WikiMacProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.orbitd.wikimacprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  WikiProbe:
    build:
      targets:
        WikiProbe: all
        WikiProbeUITests: [test]
    test:
      targets:
        - WikiProbeUITests
  WikiMacProbe:
    build:
      targets:
        WikiMacProbe: all
        WikiMacProbeUITests: [test]
    test:
      targets:
        - WikiMacProbeUITests
